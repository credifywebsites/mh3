<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="Credify">
  <title>Credify</title>
  <desc>Credify — Behavioral Health Growth Engine</desc>
  <style>
    .logo-circle-bg { fill: none; stroke: #1a8a66; stroke-width: 4; }
    .logo-check { fill: none; stroke: #1a8a66; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .logo-pulse { fill: none; stroke: #22a87e; stroke-width: 1.5; opacity: 0.35; }
    .logo-pulse-2 { fill: none; stroke: #22a87e; stroke-width: 1; opacity: 0.18; }
    .logo-main-pill { fill: #0a3d2b; }
    .logo-main-text { font-family: 'Instrument Serif', 'Playfair Display', Georgia, serif; font-size: 48px; font-weight: 400; fill: #ffffff; }
    .logo-tagline { font-family: 'Sora', 'Inter', sans-serif; font-size: 20px; font-weight: 600; fill: #1a8a66; letter-spacing: 2px; text-transform: uppercase; }
    .divider { stroke: #dde8e3; stroke-width: 1; }
  </style>
  <!-- No background rect — transparent -->
  <g transform="translate(85, 100)">
    <circle cx="0" cy="0" r="60" class="logo-pulse-2"/>
    <circle cx="0" cy="0" r="52" class="logo-pulse"/>
    <circle cx="0" cy="0" r="44" class="logo-circle-bg"/>
    <path d="M -19 0 L -6 14 L 21 -14" class="logo-check"/>
  </g>
  <rect x="170" y="60" width="440" height="80" rx="40" class="logo-main-pill"/>
  <text x="390" y="113" class="logo-main-text" text-anchor="middle">Credify</text>
  <line x1="170" y1="170" x2="550" y2="170" class="divider"/>
  <text x="170" y="198" class="logo-tagline">BEHAVIORAL HEALTH GROWTH ENGINE</text>
</svg>
