<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img" aria-label="StayingBooked">
  <title>StayingBooked</title>
  <desc>StayingBooked by Credify — Real People Answering Your Phones (dark version)</desc>
  <style>
    .logo-circle-bg { fill: none; stroke: #22a87e; stroke-width: 4; }
    .logo-check { fill: none; stroke: #22a87e; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
    .logo-pulse { fill: none; stroke: #22a87e; stroke-width: 1.5; opacity: 0.4; }
    .logo-pulse-2 { fill: none; stroke: #22a87e; stroke-width: 1; opacity: 0.2; }
    .logo-main-pill { fill: #1a8a66; }
    .logo-main-text { font-family: 'Instrument Serif', 'Playfair Display', Georgia, serif; font-size: 42px; font-weight: 400; fill: #ffffff; }
    .logo-tagline { font-family: 'Sora', 'Inter', sans-serif; font-size: 19px; font-weight: 600; fill: #3dbd94; letter-spacing: 3px; text-transform: uppercase; }
    .divider { stroke: #1a5d4a; stroke-width: 1; }
  </style>
  <!-- No background rect — transparent -->
  <g transform="translate(85, 100)">
    <circle cx="0" cy="0" r="60" class="logo-pulse-2"/>
    <circle cx="0" cy="0" r="52" class="logo-pulse"/>
    <circle cx="0" cy="0" r="44" class="logo-circle-bg"/>
    <path d="M -19 0 L -6 14 L 21 -14" class="logo-check"/>
  </g>
  <rect x="165" y="58" width="490" height="80" rx="40" class="logo-main-pill"/>
  <text x="410" y="112" class="logo-main-text" text-anchor="middle">StayingBooked</text>
  <line x1="165" y1="168" x2="655" y2="168" class="divider"/>
  <text x="165" y="198" class="logo-tagline">BY CREDIFY</text>
</svg>
