    const a=state._lobbyId && state.appointments.find(x=>x.id===state._lobbyId);
    state._lobbyId=null; renderLobby();
    toast("Connecting…","Joining your secure video session"+(a?" with "+PROVIDER.name.split(" ")[0]:"")+".","video");
  },

  /* ---- reschedule ---- */
  rescheduleOpen(id){
    const a=state.appointments.find(x=>x.id===id); if(!a) return;
    state.reschedule={id};
    state.typeId=a.typeId; state.mode=a.mode;
    state.calMonth=startOfDay(new Date()); state.selDate=null; state.selSlot=null; state.pickedSlot=null; state.note=a.note||"";
    state.step=1; App._go("book");
  },
  rescheduleCancel(){
    state.reschedule=null; state.typeId=null; state.mode=null; state.selDate=null; state.selSlot=null; state.pickedSlot=null; state.note=""; state.step=0;
    App._go("appts");
  },
  waitlistToggle(id){
    const a=state.appointments.find(x=>x.id===id); if(!a) return;
    a.waitlist=!a.waitlist; render();
    if(a.waitlist) toast("You're on the waitlist","We'll text you if an earlier "+typeById(a.typeId).name.toLowerCase()+" opens up.","bell");
  },

  /* ---- settings ---- */
  openSettings(){ App._go("settings"); },
  prefToggle(key){ state.commPrefs[key]=!state.commPrefs[key]; render(); },
  secToggle(key){ state.security[key]=!state.security[key]; if(key==="timeoutEnabled") markActivity(); render(); },
  setTimeoutMin(v){ state.security.timeoutMin=Number(v)||15; markActivity(); },
  profileSave(){
    const g=id=>{ const el=document.getElementById(id); return el?el.value.trim():""; };
    const chk=id=>{ const el=document.getElementById(id); return el?!!el.checked:false; };
    const p=state.profile;
    p.firstName=g("pf-first")||p.firstName; p.lastName=g("pf-last"); p.preferredName=g("pf-pref"); p.email=g("pf-email"); p.phone=g("pf-phone");
    p.street=g("pf-street"); p.city=g("pf-city"); p.region=g("pf-region"); p.zip=g("pf-zip"); p.dob=g("pf-dob"); p.language=g("pf-lang");
    p.pronouns=g("pf-pronouns"); p.genderIdentity=g("pf-gender"); p.sexAtBirth=g("pf-sex"); p.race=g("pf-race"); p.ethnicity=g("pf-ethnicity");
    const e1=state.emergency; e1.name=g("em-name"); e1.relationship=g("em-rel"); e1.phone=g("em-phone"); e1.email=g("em-email"); e1.okToDiscuss=chk("em-ok");
    const e2=state.emergency2; e2.name=g("em2-name"); e2.relationship=g("em2-rel"); e2.phone=g("em2-phone"); e2.email=g("em2-email"); e2.okToDiscuss=chk("em2-ok");
    const pr=state.providers; pr.pcpName=g("ct-pcp"); pr.pcpPhone=g("ct-pcpphone"); pr.referredBy=g("ct-ref");
    state.pharmacy.name=g("ph-name"); state.pharmacy.address=g("ph-addr");
    updateIdentity(); render();
    toast("Changes saved","Your profile and preferences are up to date.","check-circle-2");
  },

  /* ---- insurance ---- */
  _readInsurance(){
    const g=id=>{ const el=document.getElementById(id); return el?el.value.trim():undefined; };
    const set=(obj,map)=>{ for(const k in map){ const v=g(map[k]); if(v!==undefined) obj[k]=v; } };
    const ins=state.insurance;
    set(ins.primary,{payer:"in-payer",plan:"in-plan",memberId:"in-member",group:"in-group",effective:"in-eff"});
    set(ins.primary.subscriber,{relationship:"in-sub-rel",name:"in-sub-name",dob:"in-sub-dob"});
    if(ins.secondary.enabled){ set(ins.secondary,{payer:"in2-payer",plan:"in2-plan",memberId:"in2-member",group:"in2-group"}); set(ins.secondary.subscriber,{relationship:"in2-sub-rel",name:"in2-sub-name",dob:"in2-sub-dob"}); }
    if(ins.tertiary.enabled){ set(ins.tertiary,{payer:"in3-payer",plan:"in3-plan",memberId:"in3-member",group:"in3-group"}); set(ins.tertiary.subscriber,{relationship:"in3-sub-rel",name:"in3-sub-name",dob:"in3-sub-dob"}); }
  },
  insSave(){ this._readInsurance(); render(); toast("Insurance saved","Your coverage details are up to date.","check-circle-2"); },
  insSecondaryToggle(){ this._readInsurance(); state.insurance.secondary.enabled=!state.insurance.secondary.enabled; render(); },
  insTertiaryToggle(){ this._readInsurance(); state.insurance.tertiary.enabled=!state.insurance.tertiary.enabled; render(); },
  insCheckEligibility(){
    state.insurance.eligibility.status="active"; state.insurance.eligibility.checkedAt=Date.now(); render();
    toast("Eligibility verified","Active coverage confirmed with "+state.insurance.primary.payer+".","shield-check");
  },
  insCardUpload(side,input){
    const f=input&&input.files&&input.files[0]; if(!f) return;
    const url=(window.URL&&URL.createObjectURL)?URL.createObjectURL(f):"";
    state.insurance['card'+(side==='front'?'Front':'Back')]={name:f.name,url}; render();
    toast("Card uploaded",(side==='front'?'Front':'Back')+" of your insurance card was added.","check-circle-2");
  },
  insCardRemove(side){ state.insurance['card'+(side==='front'?'Front':'Back')]=null; render(); },
  idCardUpload(side,input){
    const fl=input&&input.files&&input.files[0]; if(!fl) return;
    const url=(window.URL&&URL.createObjectURL)?URL.createObjectURL(fl):"";
    state.photoId[side]={name:fl.name,url}; render();
    toast("ID uploaded",(side==='front'?'Front':'Back')+" of your photo ID was added.","check-circle-2");
  },
  idCardRemove(side){ state.photoId[side]=null; render(); },
  allergyAdd(){
    const s=document.getElementById("alg-substance"), r=document.getElementById("alg-reaction");
    const sub=s?s.value.trim():""; if(!sub){ if(s)s.focus(); return; }
    state.allergies.push({ id:"al_"+Date.now(), substance:sub, reaction:(r?r.value.trim():"") });
    render(); toast("Allergy added",sub+" was added to your record.","check-circle-2");
  },
  allergyRemove(id){ state.allergies=state.allergies.filter(a=>a.id!==id); render(); },

  /* ---- consent review & signing ---- */
  consentOpen(key){ state.consentView=key; renderConsent(); },
  consentClose(){ state.consentView=null; renderConsent(); },
  consentBackdrop(e){ if(e.target===e.currentTarget) App.consentClose(); },
  consentSignCheck(){
    const sig=(document.getElementById("consent-sig")||{}).value||"";
    const agree=(document.getElementById("consent-agree")||{}).checked;
    const b=document.getElementById("consent-sign-btn"); if(b) b.disabled=!(agree && sig.trim());
  },
  consentSign(){
    const key=state.consentView; if(!key) return;
    const sig=((document.getElementById("consent-sig")||{}).value||"").trim();
    const agree=(document.getElementById("consent-agree")||{}).checked;
    if(!agree || !sig) return;
    if(key==="telehealth"){ state.tele.consent=true; state.tele.consentAt=Date.now(); }
    else { state.consents[key].signed=true; state.consents[key].at=Date.now(); }
    state.consentView=null; renderConsent(); render();
    toast("Consent signed",CONSENT_DOCS[key].title+" is now on file.","check-circle-2");
  },

  /* ---- documents ---- */
  docUpload(input){
    const f=input&&input.files&&input.files[0]; if(!f) return;
    const sel=document.getElementById("doc-cat-sel"); const cat=(sel&&sel.value)||state.docCategory||"other";
    state.docCategory=cat;
    const url=(window.URL&&URL.createObjectURL)?URL.createObjectURL(f):"";
    this._docAdd({ name:f.name, sizeKB:Math.max(1,Math.round(f.size/1024)), category:cat, url });
  },
  _docAdd(rec){
    state.documents.push({ id:"doc_"+Date.now(), name:rec.name, category:rec.category||"other", sizeKB:rec.sizeKB||1, uploadedAt:Date.now(), url:rec.url||null });
    render(); toast("Document uploaded",(rec.name||"Your file")+" was added to your records.","check-circle-2");
  },
  docRemove(id){ state.documents=state.documents.filter(d=>d.id!==id); render(); toast("Document removed","It's no longer attached to your records.","trash-2"); },

  /* ---- assessments ---- */
  assessOpen(key){ state.assess=key; renderAssess(); focusFirst(document.getElementById("modal-host")); },
  assessClose(){ state.assess=null; renderAssess(); },
  assessBackdrop(e){ if(e.target===e.currentTarget) App.assessClose(); },
  assessPick(){
    const meta=ASSESS[state.assess]; if(!meta) return; let all=true;
    for(let i=0;i<meta.items.length;i++){ if(!document.querySelector('input[name="as-'+i+'"]:checked')){ all=false; break; } }
    const b=document.getElementById("assess-submit"); if(b) b.disabled=!all;
  },
  assessSubmit(){
    const key=state.assess, meta=ASSESS[key]; if(!meta) return;
    let total=0, riskFlag=false;
    for(let i=0;i<meta.items.length;i++){ const el=document.querySelector('input[name="as-'+i+'"]:checked'); const v=el?Number(el.value):0; total+=v; if(i===meta.riskItem && v>0) riskFlag=true; }
    state.assessments[key].push({ date:Date.now(), score:total });
    state.assess=null; renderAssess();
    state.tab="records"; state.recordsTab="assessments"; render();
    const sev=sevFor(key,total);
    toast(meta.name+" recorded","Score "+total+" / "+meta.max+" — "+sev.label+".","activity");
    if(riskFlag) App.crisisOpen();
  },

  /* ---- printable documents (statement / superbill / GFE / NPP) ---- */
  openPrint(kind){ state.printDoc=kind; renderPrint(); },
  closePrint(){ state.printDoc=null; renderPrint(); },
  doPrint(){ if(window.print){ try{ window.print(); }catch(e){} } },

  /* ---- autopay ---- */
  autopayToggle(){
    if(!state.autopay.enabled){
      if(!state.cards.length){ toast("Add a card first","Add a payment method to use autopay.","alert-triangle"); state.autopay.enabled=false; state.addCardOpen=true; render(); return; }
      state.autopay.enabled=true;
      if(!state.autopay.cardId || !state.cards.find(c=>c.id===state.autopay.cardId)) state.autopay.cardId=(defaultCard()||{}).id||null;
      render(); toast("Autopay on","We'll automatically pay new balances with your saved card.","check-circle-2");
    } else {
      state.autopay.enabled=false; render(); toast("Autopay off","You'll pay balances manually from Billing.","info");
    }
  },
  autopaySetCard(id){ state.autopay.cardId=id; render(); },

  /* ---- HIPAA right of access: download a copy of the record ---- */
  downloadHealthInfo(){
    try{
      const blob=new Blob([healthExportHTML()],{type:"text/html"});
      const url=URL.createObjectURL(blob); const a=document.createElement("a");
      a.href=url; a.download="riverside-health-information.html"; document.body.appendChild(a); a.click();
      document.body.removeChild(a); setTimeout(()=>{ try{URL.revokeObjectURL(url);}catch(e){} },1500);
    }catch(e){}
    toast("Download started","A copy of your health information is downloading.","download");
  },

  /* ---- accessibility: Escape closes the active modal ---- */
  modalEscape(){
    if(state.printDoc){ App.closePrint(); return; }
    if(state.consentView){ App.consentClose(); return; }
    if(state._crisis){ App.crisisClose(); return; }
    if(state._lobbyId){ App.lobbyClose(); return; }
    if(state.assess){ App.assessClose(); return; }
    if(state.cancel){ App.cancelClose(); return; }
    // leave/task guards and the sign-in gate intentionally stay open
  }
};
window.App=App;

/* ===================== boot ===================== */
// close the add-to-calendar menu on any outside click
document.addEventListener("click",function(e){
  const w=document.getElementById("cal-wrap");
  if(w && w.classList.contains("open") && !w.contains(e.target)) w.classList.remove("open");
});
// guard actual window close / reload / external navigation when a booking
// hasn't been added to a calendar yet (browser shows its own generic prompt —
// custom buttons aren't possible there; the in-app leave-guard covers those)
window.addEventListener("beforeunload",function(e){
  if(calmOn()) return;   // calm mode: no close/reload trap
  const cal = state.tab==="book" && state.step===3 && !state.calAdded && !state.calSkipped;
  const tasks = !state.tasksAck && outstandingTasks().length>0;
  if(cal || tasks){ e.preventDefault(); e.returnValue=""; return ""; }
});
// close any open custom dropdown on outside click or Escape
document.addEventListener("click",function(e){
  document.querySelectorAll(".cdd-menu:not([hidden])").forEach(function(m){
    const wrap=m.closest(".cdd");
    if(wrap && !wrap.contains(e.target)){ m.hidden=true; const t=wrap.querySelector(".cdd-trigger"); if(t) t.classList.remove("open"); }
  });
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape") document.querySelectorAll(".cdd-menu:not([hidden])").forEach(function(m){ m.hidden=true; const w=m.closest(".cdd"), t=w&&w.querySelector(".cdd-trigger"); if(t) t.classList.remove("open"); });
});
// Respect the OS "reduce motion" preference: start in calm mode for those users.
if(prefersReducedMotion() && !state.calm) state.calm=true;
function tickClock(){
  const el=document.getElementById("clock"); if(!el) return;
  try{
    const now=new Date(), TZ={timeZone:"America/Los_Angeles"};
    const d=now.toLocaleDateString("en-US",Object.assign({weekday:"long",month:"long",day:"numeric",year:"numeric"},TZ));
    const t=now.toLocaleTimeString("en-US",Object.assign({hour:"numeric",minute:"2-digit"},TZ));
    el.textContent=d+" · "+t+" PT";
  }catch(e){ el.textContent=new Date().toLocaleString(); }
}
enterPortal();   // open the standalone live demo directly, using the existing auth-skip path
tickClock(); setInterval(tickClock, 30000);   // live date/time stamp in the footer
// idle tracking for HIPAA auto sign-out (only acts when enabled in Settings → Security)
["mousemove","keydown","click","scroll","touchstart"].forEach(function(ev){ document.addEventListener(ev, markActivity, {passive:true}); });
setInterval(checkTimeout, 5000);
// accessibility: trap focus within an open modal and let Escape close it
document.addEventListener("keydown", modalKeydown, true);
// NOTE: the attention loop now starts in enterPortal(), so the single jiggle
// fires 10s after the patient actually enters the portal (not on the login screen).
</script>
</body>
