      '<div class="rec-row">' +
        '<span class="rec-label">Every</span>' +
        '<input type="number" class="rec-num-input" min="1" max="99" value="' + rec.interval + '" id="recint-' + opts.id + '">' +
        '<span class="rec-unit-label">' + unitLabel + '</span>' +
      '</div>' +
      (rec.freq === 'weekly' ?
        '<div class="rec-row">' +
          '<span class="rec-label">On</span>' +
          '<div class="rec-dow-row">' +
            REC_DOW_LABELS.map((d, i) => '<button type="button" class="rec-dow-chip' + (rec.daysOfWeek.includes(i) ? ' on' : '') + '" data-recdow="' + i + '" title="' + REC_DOW_FULL[i] + '">' + d + '</button>').join('') +
          '</div>' +
        '</div>' : '') +
      (rec.freq === 'monthly' ?
        '<div class="rec-row">' +
          '<span class="rec-label">On day</span>' +
          '<input type="number" class="rec-num-input" min="1" max="31" value="' + rec.monthDay + '" id="recmday-' + opts.id + '">' +
          '<span class="rec-unit-label">of the month</span>' +
        '</div>' : '') +
      '<div class="rec-row" style="margin-bottom:6px">' +
        '<span class="rec-label">Ends</span>' +
        '<div class="rec-ends-seg">' +
          '<button type="button" class="rec-ends-btn' + (rec.ends === 'never' ? ' active' : '') + '" data-recends="never">Never</button>' +
          '<button type="button" class="rec-ends-btn' + (rec.ends === 'on' ? ' active' : '') + '" data-recends="on">On date</button>' +
          '<button type="button" class="rec-ends-btn' + (rec.ends === 'after' ? ' active' : '') + '" data-recends="after">After</button>' +
        '</div>' +
      '</div>' +
      (rec.ends === 'on' ?
        '<div class="rec-ends-detail"><input type="date" class="rec-num-input" style="width:auto;padding:0 8px" id="recenddate-' + opts.id + '" value="' + (rec.endDate || '') + '"></div>' : '') +
      (rec.ends === 'after' ?
        '<div class="rec-ends-detail"><input type="number" class="rec-num-input" min="1" value="' + rec.endCount + '" id="reccount-' + opts.id + '"><span class="rec-unit-label">occurrences</span></div>' : '');

    // Wire frequency buttons
    container.querySelectorAll('[data-recfreq]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        rec.freq = btn.dataset.recfreq;
        if (rec.freq === 'weekly' && !rec.daysOfWeek.length) rec.daysOfWeek = [1];
        render(); emit();
      });
    });
    // Interval
    var intInp = container.querySelector('#recint-' + opts.id);
    if (intInp) intInp.addEventListener('input', function() { rec.interval = Math.max(1, parseInt(intInp.value) || 1); emit(); });
    // Day of week chips
    container.querySelectorAll('[data-recdow]').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var d = parseInt(chip.dataset.recdow);
        var idx = rec.daysOfWeek.indexOf(d);
        if (idx >= 0) { if (rec.daysOfWeek.length > 1) rec.daysOfWeek.splice(idx, 1); }
        else rec.daysOfWeek.push(d);
        render(); emit();
      });
    });
    // Month day
    var mdInp = container.querySelector('#recmday-' + opts.id);
    if (mdInp) mdInp.addEventListener('input', function() { rec.monthDay = Math.min(31, Math.max(1, parseInt(mdInp.value) || 1)); emit(); });
    // Ends buttons
    container.querySelectorAll('[data-recends]').forEach(function(btn) {
      btn.addEventListener('click', function() { rec.ends = btn.dataset.recends; render(); emit(); });
    });
    // End date
    var endDate = container.querySelector('#recenddate-' + opts.id);
    if (endDate) endDate.addEventListener('input', function() { rec.endDate = endDate.value; emit(); });
    // End count
    var countInp = container.querySelector('#reccount-' + opts.id);
    if (countInp) countInp.addEventListener('input', function() { rec.endCount = Math.max(1, parseInt(countInp.value) || 1); emit(); });
  }

  render();
}

function renderSchedule(doc, host, { resolved, sources, onChange, win, state, onSaveConditions, seriesId, exceptions, onScopeEdit, onExceptionRevert, allSeries, onSeriesChange, onExceptionEdit }) {
  host.innerHTML = '';
  const sched = resolved.schedule || {};
  const conditions = JSON.parse(JSON.stringify(sched.conditions && sched.conditions.length ? sched.conditions : DEFAULT_CONDITIONS));
  const deadline = Object.assign({}, DEFAULT_DEADLINE, sched.deadline || {});

  // Saved condition presets — state-root storage, bypasses submitPolicy
  if (!state) state = {};
  if (!state.savedConditions) state.savedConditions = [];
  const getSavedConditions = () => (state && state.savedConditions) || [];
  const persistSaved = (list) => { if (onSaveConditions) onSaveConditions(list); };

  // Per-block UI state: which mode (new/saved) and search query
  const condUiMode = {};   // condId → 'new' | 'saved'
  const condSearch = {};   // condId → string

  const emit = () => {
    const steps = conditionsToSteps(conditions, deadline);
    onChange({ 'schedule.conditions': conditions, 'schedule.deadline': deadline, 'schedule.steps': steps });
  };

  const card = doc.createElement('section');
  card.className = 'cf-cond-card';

  const stack = doc.createElement('div');
  stack.className = 'cf-cond-stack';
  card.appendChild(stack);

  conditions.forEach((cond, idx) => {
    // V7: AND/OR joiner pills removed — each condition fires independently.

    const row = doc.createElement('div');
    row.className = 'cf-cond-row';
    row.dataset.condId = cond.id;

    /* V33.2: card header is now title + summary, matching the approved mockup.
       The trigger controls moved down into the labelled top grid in the body. */
    const head = doc.createElement('div');
    head.className = 'cf-cond-head';
    const num = doc.createElement('div');
    num.className = 'cf-cond-num';
    num.textContent = String(idx + 1);
    head.appendChild(num);

    const headTxt = doc.createElement('div');
    headTxt.className = 'cf-cond-headtxt';
    const headTitle = doc.createElement('div');
    headTitle.className = 'cf-cond-headtitle';
    const headSub = doc.createElement('div');
    headSub.className = 'cf-cond-headsub';
    headTxt.appendChild(headTitle);
    headTxt.appendChild(headSub);
    head.appendChild(headTxt);

    /* cond.channels is an ARRAY of channel values (see the checkbox handler
       below), not a keyed object — indexing it by name silently reports every
       condition as having no channels. */
    const CHAN_NAMES = { sms: 'SMS', voice: 'AI Phone Call', email: 'Email' };
    const chanLabel = () => {
      const sel = Array.isArray(cond.channels) ? cond.channels : [];
      const on = ['sms', 'voice', 'email']
        .filter(c => sel.includes(c))
        .map(c => CHAN_NAMES[c]);
      return on.length ? on.join(' + ') : 'no channel selected';
    };
    const apptLabelFor = v => {
      const t = COND_APPT_TYPES.find(x => x.value === (v || 'every'));
      return t ? t.label : 'Every appointment (any type)';
    };
    /* Called after the controls mount, so `hasApptType` reflects whether this
       trigger actually takes an appointment type — clinical and admin triggers
       don't, and claiming "Every appointment (any type)" for them is wrong. */
    const paintHead = (hasApptType) => {
      const opt = COND_TRIGGERS.find(o => o.value === cond.type);
      headTitle.textContent = opt ? opt.label : 'Condition';
      headSub.textContent = [hasApptType ? apptLabelFor(cond.apptType) : null, chanLabel()]
        .filter(Boolean).join(' · ');
    };

    const typeSel = doc.createElement('select');
    typeSel.id = `cond-${idx}-type`;
    typeSel.name = typeSel.id;
    typeSel.dataset.policyPath = `schedule.conditions.${idx}.type`;

    const rm = doc.createElement('button');
    rm.type = 'button';
    rm.className = 'cf-cond-remove';
    rm.id = `cond-${idx}-remove`;
    rm.setAttribute('aria-label', 'Remove condition');
    rm.textContent = 'x';
    rm.addEventListener('click', () => {
      conditions.splice(idx, 1);
      if (conditions.length && conditions[0].joiner) conditions[0].joiner = null;
      emit();
    });
    head.appendChild(rm);
    row.appendChild(head);

    // ---- New / Saved toggle bar (tab-driven labels) ----
    const condId = cond.id;
    if (!condUiMode[condId]) condUiMode[condId] = 'new';
    if (!condSearch[condId]) condSearch[condId] = '';

    /* V33.2: these used to repeat the category ("New Appointment" / "Saved
       Appointments"). The category is now a segmented control directly above
       this one, so the repetition is redundant — and the long strings forced
       the segments to wrap or ellipsize. The pair only ever distinguished
       building a fresh condition from loading a saved preset. */
    const condTabLabel = () => ({ new: 'New', saved: 'Saved' });

    const toggleBar = doc.createElement('div');
    toggleBar.className = 'cf-cond-toggle-bar';
    const lbls = condTabLabel();
    const newToggle = doc.createElement('button');
    newToggle.type = 'button';
    newToggle.className = 'cf-cond-mode-btn' + (condUiMode[condId] === 'new' ? ' is-new is-active' : '');
    newToggle.textContent = lbls.new;
    const savedToggle = doc.createElement('button');
    savedToggle.type = 'button';
    savedToggle.className = 'cf-cond-mode-btn is-saved' + (condUiMode[condId] === 'saved' ? ' is-active' : '');
    savedToggle.textContent = lbls.saved;
    toggleBar.appendChild(newToggle);
    toggleBar.appendChild(savedToggle);

    const body = doc.createElement('div');
    body.className = 'cf-cond-body';
    body.style.display = condUiMode[condId] === 'new' ? '' : 'none';
    row.appendChild(body);

    /* V33.2: labelled 2-up top grid — Trigger category | Trigger on the first
       line, Applies to | Appointment type on the second. Cells are filled in
       source order; the appointment-type cell is added below only when the
       selected trigger actually takes one. */
    const topGrid = doc.createElement('div');
    topGrid.className = 'cf-cond-grid';
    body.appendChild(topGrid);

    const gridCell = (labelText, control) => {
      const cell = doc.createElement('div');
      cell.className = 'cf-field';
      const lab = doc.createElement('label');
      lab.textContent = labelText;
      cell.appendChild(lab);
      if (control) cell.appendChild(control);
      topGrid.appendChild(cell);
      return cell;
    };

    const catHost = doc.createElement('div');
    gridCell('Trigger category', catHost);
    gridCell('Trigger', typeSel);
    gridCell('Applies to', toggleBar);

    // Saved panel — rendered below body, toggled separately
    const savedPanel = doc.createElement('div');
    savedPanel.className = 'cf-cond-saved-panel';
    savedPanel.style.display = condUiMode[condId] === 'saved' ? '' : 'none';

    const renderSavedPanel = () => {
      savedPanel.innerHTML = '';
      const all = getSavedConditions();
      if (!all.length) {
        const empty = doc.createElement('p');
        empty.className = 'cf-tmpl-empty';
        empty.textContent = 'No saved condition presets yet. Configure a condition and click Save.';
        savedPanel.appendChild(empty);
        return;
      }
      // Search
      const sw = doc.createElement('div'); sw.className = 'cf-tmpl-search';
      const si = doc.createElement('input');
      si.type = 'text'; si.className = 'cf-tmpl-search-input';
      si.id = `cond-${idx}-saved-search`; si.name = si.id;
      si.placeholder = 'Search saved presets…';
      si.value = condSearch[condId] || '';
      sw.appendChild(si);
      savedPanel.appendChild(sw);
      const cardsWrap = doc.createElement('div');
      savedPanel.appendChild(cardsWrap);
      const renderCards = () => {
        cardsWrap.innerHTML = '';
        const q = (condSearch[condId] || '').trim().toLowerCase();
        let shown = 0;
        all.forEach((preset, pi) => {
          const hay = [preset.name, preset.type].filter(Boolean).join(' ').toLowerCase();
          if (q && !hay.includes(q)) return;
          shown++;
          const card = doc.createElement('div'); card.className = 'cf-tmpl-card';
          const head2 = doc.createElement('div'); head2.className = 'cf-tmpl-card-head';
          const nm = doc.createElement('span'); nm.className = 'cf-tmpl-card-name'; nm.textContent = preset.name;
          head2.appendChild(nm); card.appendChild(head2);
          const prev = doc.createElement('div'); prev.className = 'cf-tmpl-card-body';
          const trig = COND_TRIGGERS.find(t => t.value === preset.type);
          prev.textContent = [
            trig ? trig.label : preset.type,
            preset.amount ? `${preset.amount} day(s)` : '',
            preset.channels && preset.channels.length ? 'via ' + preset.channels.join(', ') : ''
          ].filter(Boolean).join(' · ');
          card.appendChild(prev);
          const acts = doc.createElement('div'); acts.className = 'cf-tmpl-card-actions';
          const loadBtn = doc.createElement('button'); loadBtn.type = 'button';
          loadBtn.className = 'cf-cond-mode-btn is-new is-active'; loadBtn.textContent = 'Load';
          loadBtn.style.fontSize = '12px'; loadBtn.style.padding = '0 10px';
          loadBtn.addEventListener('click', () => {
            // Load preset into this condition — keep this block's own id so two
            // blocks never collide (older presets may still carry a stale id).
            const keepId = cond.id;
            Object.assign(cond, JSON.parse(JSON.stringify(preset.config)));
            cond.id = keepId;
            condUiMode[condId] = 'new';
            emit();
          });
          acts.appendChild(loadBtn);
          const delBtn = doc.createElement('button'); delBtn.type = 'button';
          delBtn.className = 'cf-tmpl-action-btn danger'; delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', () => {
            if (!win.confirm(`Delete "${preset.name}"?`)) return;
            const updated = getSavedConditions().filter((_, i) => i !== pi);
            persistSaved(updated);
            renderSavedPanel();
          });
          acts.appendChild(delBtn);
          card.appendChild(acts); cardsWrap.appendChild(card);
        });
        if (!shown) {
          const none = doc.createElement('p'); none.className = 'cf-tmpl-empty';
          none.textContent = 'No presets match your search.'; cardsWrap.appendChild(none);
        }
      };
      si.addEventListener('input', () => { condSearch[condId] = si.value; renderCards(); });
      renderCards();
    };

    // Wire toggle buttons
    newToggle.addEventListener('click', () => {
      condUiMode[condId] = 'new';
      newToggle.className = 'cf-cond-mode-btn is-new is-active';
      savedToggle.className = 'cf-cond-mode-btn is-saved';
      body.style.display = '';
      savedPanel.style.display = 'none';
    });
    savedToggle.addEventListener('click', () => {
      condUiMode[condId] = 'saved';
      newToggle.className = 'cf-cond-mode-btn';
      savedToggle.className = 'cf-cond-mode-btn is-saved is-active';
      body.style.display = 'none';
      savedPanel.style.display = '';
      renderSavedPanel();
    });

    const needsEvent = COND_NEEDS_EVENT.has(cond.type);
    const needsAppt = COND_NEEDS_APPT.has(cond.type);
    const needsDate = COND_NEEDS_DATE.has(cond.type);
    const needsOffset = COND_NEEDS_OFFSET.has(cond.type);

    let evSel = null, apSel = null, daySel = null, minSel = null;

    if (needsEvent) {
      const evRow = doc.createElement('div');
      evRow.className = 'cf-cond-inline';
      const lab = doc.createElement('span');
      lab.className = 'cf-cond-inline-label';
      lab.textContent = 'Program / Event:';
      evRow.appendChild(lab);
      evSel = doc.createElement('select');
      evSel.id = `cond-${idx}-event`;
      evSel.name = evSel.id;
      evSel.dataset.policyPath = `schedule.conditions.${idx}.event`;
      const evWrap = doc.createElement('div');
      evWrap.className = 'cf-cond-inline-ctl';
      evWrap.appendChild(evSel);
      evRow.appendChild(evWrap);
      body.appendChild(evRow);
    }

    /* V33.4: Appointment type renders for EVERY trigger. It is a scoping filter
       ("which appointment types does this condition cover"), not a timing input,
       so an event trigger like "Upon admission" can legitimately be limited to
       one type. Timing and Booking window stay gated on needsOffset below —
       those genuinely need an appointment to offset from. */
    apSel = doc.createElement('select');
    apSel.id = `cond-${idx}-appt`;
    apSel.name = apSel.id;
    apSel.dataset.policyPath = `schedule.conditions.${idx}.apptType`;
    gridCell('Appointment type', apSel);

    if (!needsOffset) {
      const note = doc.createElement('p');
      note.className = 'cf-cond-note';
      note.id = `cond-${idx}-no-timing`;
      note.textContent = 'This trigger fires on the event itself, so it has no '
        + 'send-offset or booking window. Switch the trigger to "Before appointment" '
        + 'or "After appointment" to schedule relative to a visit.';
      body.appendChild(note);
    }

    if (needsDate) {
      /* V33.4: was a raw <input type="date">, which renders the browser's own
         chrome and ignores the Credify theme. Now the same chip + themed popup
         the EHR uses (openDatePicker). The hidden input stays as the value
         holder so the policyPath binding and any form serialisation are
         unchanged. */
      const dLbl = doc.createElement('div');
      dLbl.className = 'cf-cond-sublabel';
      dLbl.textContent = 'Date';
      body.appendChild(dLbl);

      const dRow = doc.createElement('div');
      dRow.className = 'cf-datefield';
      const dInput = input(doc, { id: `cond-${idx}-date`, type: 'date', path: `schedule.conditions.${idx}.dateVal`, value: cond.dateVal || '' });
      dInput.hidden = true;
      dRow.appendChild(dInput);

      const chip = doc.createElement('span');
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'cf-btn-secondary cf-datefield-btn';
      btn.id = `cond-${idx}-date-btn`;

      const paintDate = () => {
        const v = cond.dateVal || '';
        chip.className = v ? 'cf-datechip' : 'cf-datechip is-empty';
        chip.textContent = v ? fmtDateChip(v) : 'No date set';
        btn.textContent = v ? 'Change' : 'Pick a date';
      };
      btn.addEventListener('click', () => openDatePicker(doc, win, cond.dateVal || '', v => {
        cond.dateVal = v;
        dInput.value = v;
        emit();
      }));
      dRow.appendChild(chip);
      dRow.appendChild(btn);
      paintDate();
      body.appendChild(dRow);
    }

    if (needsOffset) {
      const dir = (cond.type === 'offset_before' || cond.type === 'appt_before') ? 'before' : 'after';
      /* V33.3: the offset and guard rows were unlabelled, so they read as loose
         controls rather than the mockup's "Timing" / "Booking window" fields. */
      const oLbl = doc.createElement('div');
      oLbl.className = 'cf-cond-sublabel';
      oLbl.textContent = 'Timing';
      body.appendChild(oLbl);
      const oRow = doc.createElement('div');
      oRow.className = 'cf-cond-offset';
      const s1 = doc.createElement('span'); s1.className = 'cf-cond-inline-label'; s1.textContent = 'Send'; oRow.appendChild(s1);
      daySel = doc.createElement('select'); daySel.id = `cond-${idx}-amt`; daySel.name = daySel.id; daySel.dataset.policyPath = `schedule.conditions.${idx}.amount`;
      const dayWrap = doc.createElement('div'); dayWrap.className = 'cf-cond-inline-ctl'; dayWrap.appendChild(daySel); oRow.appendChild(dayWrap);
      const s2 = doc.createElement('span'); s2.className = 'cf-cond-inline-sep'; s2.textContent = 'and'; oRow.appendChild(s2);
      minSel = doc.createElement('select'); minSel.id = `cond-${idx}-amtmin`; minSel.name = minSel.id; minSel.dataset.policyPath = `schedule.conditions.${idx}.minutes`;
      const minWrap = doc.createElement('div'); minWrap.className = 'cf-cond-inline-ctl'; minWrap.appendChild(minSel); oRow.appendChild(minWrap);
      const s3 = doc.createElement('span'); s3.className = 'cf-cond-inline-label'; s3.textContent = `${dir} ${needsAppt ? 'appointment' : 'event'}`; oRow.appendChild(s3);
      body.appendChild(oRow);

      // Send-window guard — only fire if appointment was booked within a certain window
      const gLbl = doc.createElement('div');
      gLbl.className = 'cf-cond-sublabel';
      gLbl.innerHTML = 'Booking window <span class="cf-cond-sublabel-opt">— optional</span>';
      body.appendChild(gLbl);
      const guardRow = doc.createElement('div');
      guardRow.className = 'cf-cond-guard';
      const gLab = doc.createElement('span');
      gLab.className = 'cf-cond-guard-label';
      gLab.textContent = 'Only send if booked between';
      guardRow.appendChild(gLab);
      const gMin = doc.createElement('input');
      gMin.type = 'number'; gMin.min = '0'; gMin.max = '365';
      gMin.id = `cond-${idx}-guard-min`; gMin.name = gMin.id;
      gMin.placeholder = '—';
      gMin.value = cond.guardMin != null ? String(cond.guardMin) : '';
      gMin.addEventListener('change', () => { cond.guardMin = gMin.value !== '' ? parseInt(gMin.value, 10) : null; emit(); });
      guardRow.appendChild(gMin);
      const gSep1 = doc.createElement('span'); gSep1.className = 'cf-cond-guard-label'; gSep1.textContent = 'and';
      guardRow.appendChild(gSep1);
      const gMax = doc.createElement('input');
      gMax.type = 'number'; gMax.min = '0'; gMax.max = '365';
      gMax.id = `cond-${idx}-guard-max`; gMax.name = gMax.id;
      gMax.placeholder = '—';
      gMax.value = cond.guardMax != null ? String(cond.guardMax) : '';
      gMax.addEventListener('change', () => { cond.guardMax = gMax.value !== '' ? parseInt(gMax.value, 10) : null; emit(); });
      guardRow.appendChild(gMax);
      const gSep2 = doc.createElement('span'); gSep2.className = 'cf-cond-guard-label'; gSep2.textContent = `days ${dir === 'before' ? 'before' : 'after'} appointment`;
      guardRow.appendChild(gSep2);
      body.appendChild(guardRow);
    }

    // Send via (channel) — V7: checkbox sub-field row matching Forms Hub pattern
    const chLab = doc.createElement('div');
    chLab.className = 'cf-cond-sublabel';
    chLab.textContent = 'Send via';
    body.appendChild(chLab);
    const chRow = doc.createElement('div');
    chRow.className = 'cf-cond-inline cf-cond-channels';
    const chWrap = doc.createElement('div');
    chWrap.className = 'cf-cond-channels-wrap';
    const selChans = Array.isArray(cond.channels) ? cond.channels.slice() : [];
    cond.channels = selChans;
    CHANNELS.forEach(ch => {
      const lbl = doc.createElement('label');
      lbl.className = 'cf-chan-chk';
      const chk = doc.createElement('input');
      chk.type = 'checkbox';
      chk.id = `cond-${idx}-chan-${ch.value}`;
      chk.name = chk.id;
      chk.checked = selChans.includes(ch.value);
      chk.addEventListener('change', () => {
        if (chk.checked) {
          if (!cond.channels.includes(ch.value)) cond.channels = cond.channels.concat([ch.value]);
        } else {
          cond.channels = cond.channels.filter(c => c !== ch.value);
        }
        emit();
      });
      lbl.appendChild(chk);
      const txt = doc.createElement('span');
      txt.textContent = ch.label;
      lbl.appendChild(txt);
      chWrap.appendChild(lbl);
    });
    chRow.appendChild(chWrap);
    body.appendChild(chRow);

    // Recurring — V7: per-condition, FH pattern
    const recRow = doc.createElement('div');
    recRow.className = 'cf-cond-recurring';
    const recLbl = doc.createElement('label');
    recLbl.className = 'cf-switch-row'; // V33.3: toggle, not a checkbox pill
    const recChk = doc.createElement('input');
    recChk.type = 'checkbox';
    recChk.className = 'cf-sw';
    recChk.id = `cond-${idx}-recurring`;
    recChk.name = recChk.id;
    recChk.checked = !!cond.recurring;
    const recTxt = doc.createElement('span');
    recTxt.textContent = 'Recurring';
    recLbl.appendChild(recChk);
    recLbl.appendChild(recTxt);
    recRow.appendChild(recLbl);
    const recPanel = doc.createElement('div');
    recPanel.className = 'rec-panel' + (cond.recurring ? ' show' : '');
    recPanel.id = `rec-panel-${cond.id}`;
    recRow.appendChild(recPanel);
    if (cond.recurring) {
      makeRecurrencePanel(recPanel, {
        id: 'rec-' + cond.id,
        value: cond.recObj,
        onChange: function(recObj) { cond.recObj = recObj; emit(); }
      });
    }
    recChk.addEventListener('change', () => {
      cond.recurring = recChk.checked;
      recPanel.classList.toggle('show', cond.recurring);
      if (cond.recurring) {
        recPanel.innerHTML = '';
        makeRecurrencePanel(recPanel, {
          id: 'rec-' + cond.id,
          value: cond.recObj,
          onChange: function(recObj) { cond.recObj = recObj; emit(); }
        });
      } else {
        recPanel.innerHTML = '';
      }

      const count = getSavedConditions().filter(p => p.type === cond.type).length + 1;
      const name = `${trig.label} #${count}`;
      const preset = {
        id: 'cpreset_' + Date.now().toString(36),
        name,
        type: cond.type,
        amount: cond.amount,
        minutes: cond.minutes,
        channels: (cond.channels || []).slice(),
        config: (() => { const c = JSON.parse(JSON.stringify(cond)); delete c.id; return c; })()
      };
      const updated = getSavedConditions().concat([preset]);
      persistSaved(updated);
      // Flash Save button green confirmation
      saveCondBtn.textContent = 'Saved ✓';

    mountTabbedSelect(typeSel, {

      tabsHost: catHost,

    if (evSel) {

      mountSelect(evSel, { options: evOptions, value: cond.event || '', win, onChange: v => { cond.event = v; emit(); } });
    }
    if (apSel) mountSelect(apSel, { options: COND_APPT_TYPES, value: cond.apptType || 'every', win, onChange: v => { cond.apptType = v; emit(); } });
    paintHead(!!apSel);
    if (daySel) mountSelect(daySel, { options: OFFSET_DAYS, value: String(cond.amount || 1), win, forceCustom: true, onChange: v => { cond.amount = parseInt(v, 10) || 1; emit(); } });
    if (minSel) {
      const minOpts = [{ value: '0', label: '+ 0 min' }].concat(DUR_MINS.slice(1).map(o => ({ value: o.value, label: '+ ' + o.label })));
      mountSelect(minSel, { options: minOpts, value: String(cond.minutes || 0), win, onChange: v => { cond.minutes = parseInt(v, 10) || 0; emit(); } });
    }
  });

  // ---- shared timing block ----
  const dl = doc.createElement('div');
  dl.className = 'cf-deadline';

  const mkDurRow = (labelText, enabledKey, dKey, hKey, mKey) => {
    const rowEl = doc.createElement('div');
    rowEl.className = 'cf-deadline-row';
    const chk = input(doc, { id: `deadline-${enabledKey}`, type: 'checkbox', value: deadline[enabledKey] });
    chk.classList.add('cf-deadline-chk', 'cf-sw'); // V33.3: toggle, not a checkbox
    rowEl.appendChild(chk);
    const lab = doc.createElement('span');
    lab.className = 'cf-deadline-label';
    lab.textContent = labelText;
    rowEl.appendChild(lab);
    const ctls = doc.createElement('div');
    ctls.className = 'cf-deadline-ctls' + (deadline[enabledKey] ? '' : ' is-disabled');
    const sels = [];
    const mk = (id, opts, key) => {
      const sel = doc.createElement('select'); sel.id = id; sel.name = id; sel.dataset.policyPath = `schedule.deadline.${key}`;
      const w = doc.createElement('div'); w.className = 'cf-cond-inline-ctl'; w.appendChild(sel);
      ctls.appendChild(w);
      sels.push([sel, opts, key]);
    };
    mk(`${enabledKey}-days`, DUR_DAYS, dKey);
    mk(`${enabledKey}-hours`, DUR_HOURS, hKey);
    mk(`${enabledKey}-mins`, DUR_MINS, mKey);
    rowEl.appendChild(ctls);
    chk.addEventListener('change', () => {
      deadline[enabledKey] = chk.checked;
      ctls.classList.toggle('is-disabled', !chk.checked);
      emit();
    });
    dl.appendChild(rowEl);
    sels.forEach(([sel, opts, key]) => {
      const forceCustom = opts.length > 8;
      mountSelect(sel, { options: opts, value: String(deadline[key] || 0), win, forceCustom, onChange: v => { deadline[key] = parseInt(v, 10) || 0; emit(); } });
    });
  };

  // "Send within" governs lead time only for non-offset triggers; offset-type
  // conditions carry their own offset row, so hide it while every condition is
  // offset-type (avoids an inert control on the appt-before default).
  const anyNonOffset = conditions.some(c => !COND_NEEDS_OFFSET.has(c.type));
  if (anyNonOffset) mkDurRow('Send within', 'withinEnabled', 'wDays', 'wHours', 'wMins');
  mkDurRow('If not confirmed send every', 'remindEnabled', 'rDays', 'rHours', 'rMins');
  card.appendChild(dl);

  // ---- add condition ----
  const addRow = doc.createElement('div');
  addRow.className = 'cf-cond-addrow';
  const addBtn = doc.createElement('button');
  addBtn.type = 'button';
  addBtn.id = 'add-condition';
  addBtn.className = 'cf-btn-secondary';
  addBtn.textContent = '+ Add Condition';
  addBtn.addEventListener('click', () => {
    conditions.push({ id: 'c' + Date.now().toString(36), type: 'appt_before', event: '', apptType: 'every', amount: 1, minutes: 0, channels: [], joiner: null, recurring: false, recObj: null, guardMin: null, guardMax: null });
    emit();
  });
  addRow.appendChild(addBtn);
  card.appendChild(addRow);

  host.appendChild(card);
}

// Channels tab: per-channel enable, consent, and the full AI Phone Call config.


const CHANNEL_LABELS = { sms: 'SMS', email: 'Email', voice: 'AI Phone Call' };
const CHANNEL_HINTS = {
  sms: 'Short reminder text. Client replies with a confirm keyword.',
  email: 'Longer reminder with confirm and reschedule links.',
  voice: 'Outbound AI call. Confirms by keypad or spoken phrase.'
};

/* Compliance is Credify's determination, not the practice's, so it renders
   locked in every channel card instead of as editable policy. THIS TABLE IS THE
   SWITCH: set a channel's `permitted` to false and that channel's Enabled
   toggle is forced off and disabled, its settings collapse, and the card reads
   "Not permitted" — that is the "e.g. no phone calls" case. Everything ships
   permitted; flip what legal decides. `note` is the plain-English why, shown
   under the rules. Deliberately a module constant and not policy state: it must
   not be reachable through commit() or a scope override. */
const CHANNEL_COMPLIANCE = {
  sms: { permitted: true, note: 'Written consent required before the first send. STOP and UNSUBSCRIBE are honored automatically.' },
  email: { permitted: true, note: 'Unsubscribe link required in every send. No PHI in subject lines.' },
  voice: { permitted: true, note: 'Consent required before dialing. Quiet hours are enforced and cannot be overridden per scope.' }
};

/* One locked read-out of the compliance rules that apply to a channel. Plain
   text rather than disabled inputs: there is no editable version of this to
   grey out, and a disabled control implies it could be enabled. */
function channelComplianceStrip(doc, ch, compliance, rule) {
  const box = doc.createElement('div');
  box.className = 'cf-chan-compliance';

  const head = doc.createElement('div');
  head.className = 'cf-chan-compliance-head';
  const lbl = doc.createElement('span');
  lbl.className = 'cf-chan-compliance-label';
  lbl.textContent = 'Compliance — set by Credify';
  head.appendChild(lbl);
  const badge = doc.createElement('span');
  badge.className = 'cf-chan-compliance-badge' + (rule.permitted ? '' : ' blocked');
  badge.textContent = rule.permitted ? 'Permitted' : 'Not permitted';
  head.appendChild(badge);
  box.appendChild(head);

  const rows = doc.createElement('div');
  rows.className = 'cf-chan-compliance-rows';
  const row = (k, v) => {
    const d = doc.createElement('div');
    d.appendChild(doc.createTextNode(k + ' '));
    const b = doc.createElement('b');
    b.textContent = v;
    d.appendChild(b);
    return d;
  };
  rows.appendChild(row('Quiet hours',
    `${compliance.quietStart || '21:00'}–${compliance.quietEnd || '08:00'}`));
  rows.appendChild(row('PHI-safe content', compliance.phiSafe !== false ? 'On' : 'Off'));
  box.appendChild(rows);

  if (rule.note) {
    const p = doc.createElement('p');
    p.className = 'cf-chan-compliance-note';
    p.textContent = rule.note;
    box.appendChild(p);
  }
  return box;
}

/* The "Inherited - Agency Default" chips (and their x-to-revert) are gone per
   Jay. Every call site is left intact and still passes its revert callback, so
   restoring them is a one-line change here rather than a re-thread through
   every field. inheritBadge() is likewise still defined and still correct.
   Note the revert paths (patch[path] = null) are now unreachable from the UI —
   nothing else triggers them, so a value set at a scope can no longer be
   cleared back to inherited from these tabs. */
function badgeFor(doc, sources, path, onRevert) {
  return null;
}

function renderChannels(doc, host, { resolved, sources, onChange, win }) {
  host.innerHTML = '';
  const patch = {};
  const emit = () => onChange({ ...patch });

  const compliance = resolved.compliance || {};

  for (const ch of ['sms', 'email', 'voice']) {
    const cfg = (resolved.channels && resolved.channels[ch]) || {};
    const rule = CHANNEL_COMPLIANCE[ch] || { permitted: true, note: '' };

    const card = doc.createElement('section');
    card.className = 'cf-channel-card';
    card.dataset.channel = ch;
    card.dataset.permitted = String(rule.permitted);

    /* Channel name and its on/off switch share one row. They were stacked —
       an h3 followed by a full-width .cf-field whose uppercase "ENABLED" label
       sat above its own checkbox — which spent three lines saying what belongs
       beside the title. Not the shared field() helper for that reason; this
       builds its own <label for>, so the control keeps its id/name and its
       label association. */
    const head = doc.createElement('div');
    head.className = 'cf-channel-head';

    const h = doc.createElement('h3');
    h.textContent = CHANNEL_LABELS[ch];
    head.appendChild(h);

    const toggle = input(doc, {
      id: `${ch}-enabled`, type: 'checkbox',
      path: `channels.${ch}.enabled`, value: !!cfg.enabled
    });
    const enableLbl = doc.createElement('label');
    enableLbl.className = 'cf-channel-enable';
    enableLbl.htmlFor = toggle.id;
    const enableTxt = doc.createElement('span');
    enableTxt.textContent = 'Enabled';
    enableLbl.appendChild(enableTxt);
    enableLbl.appendChild(toggle);
    // Returns null today (inherited chips removed) — kept so re-enabling them
    // puts the chip back in the right place rather than nowhere.
    const enBadge = badgeFor(doc, sources, `channels.${ch}.enabled`, () => {
      patch[`channels.${ch}.enabled`] = null;
      emit();
    });
    if (enBadge) enableLbl.appendChild(enBadge);
    head.appendChild(enableLbl);

    card.appendChild(head);

    const detail = doc.createElement('div');
    detail.id = `${ch}-detail`;
    detail.className = 'cf-channel-detail';
    detail.hidden = !cfg.enabled;
    card.appendChild(detail);

    toggle.addEventListener('change', () => {
      detail.hidden = !toggle.checked;
      patch[`channels.${ch}.enabled`] = toggle.checked;
      emit();
    });

    /* A channel Credify has not cleared cannot be switched on at all — the
       toggle is forced off and disabled rather than merely warned about, and
       its settings stay collapsed. Not written back to policy: leave whatever
       the practice had stored intact so the channel returns as it was if the
       determination is reversed. */
    if (!rule.permitted) {
      toggle.checked = false;
      toggle.disabled = true;
      detail.hidden = true;
    }

    const consent = input(doc, {
      id: `${ch}-consent`, type: 'checkbox',
      path: `channels.${ch}.consentRequired`, value: !!cfg.consentRequired
    });
    consent.addEventListener('change', () => {
      patch[`channels.${ch}.consentRequired`] = consent.checked;
      emit();
    });
    const consentField = field(doc, 'Require consent on file', consent);

    const defWait = input(doc, {
      id: `${ch}-default-wait`, type: 'number',
      path: `channels.${ch}.waitAfterMin`, value: cfg.waitAfterMin === undefined ? 0 : cfg.waitAfterMin
    });
    defWait.min = '0';
    defWait.addEventListener('input', () => {
      patch[`channels.${ch}.waitAfterMin`] = Number(defWait.value);
      emit();
    });
    const defWaitField = field(doc, 'Default wait when added to a chain (minutes)', defWait,
      badgeFor(doc, sources, `channels.${ch}.waitAfterMin`, () => {
        patch[`channels.${ch}.waitAfterMin`] = null;
        emit();
      }));

    detail.appendChild(pairRow(doc, consentField, defWaitField));

    if (ch === 'voice') {
      const script = doc.createElement('textarea');
      script.id = 'voice-script';
      script.name = script.id;
      script.rows = 4;
      script.dataset.policyPath = 'channels.voice.script';
      script.value = cfg.script || '';
      script.addEventListener('input', () => { patch['channels.voice.script'] = script.value; emit(); });
      detail.appendChild(field(doc, 'AI Phone Call script', script,
        badgeFor(doc, sources, 'channels.voice.script', () => {
          patch['channels.voice.script'] = null;
          emit();
        })));

      const phrases = input(doc, {
        id: 'voice-confirm-phrases', type: 'text',
        path: 'channels.voice.confirmPhrases', policyType: 'csv',
        value: (cfg.confirmPhrases || []).join(', ')
      });
      phrases.addEventListener('input', () => {
        patch['channels.voice.confirmPhrases'] =
          phrases.value.split(',').map(s => s.trim()).filter(Boolean);
        emit();
      });
      detail.appendChild(field(doc, 'Confirm phrases (comma separated)', phrases));

      const retry = input(doc, {
        id: 'voice-retry-count', type: 'number',
        path: 'channels.voice.retryCount', value: cfg.retryCount === undefined ? 0 : cfg.retryCount
      });
      retry.min = '0';
      retry.addEventListener('input', () => { patch['channels.voice.retryCount'] = Number(retry.value); emit(); });
      const retryField = field(doc, 'Retry attempts', retry,
        badgeFor(doc, sources, 'channels.voice.retryCount', () => {
          patch['channels.voice.retryCount'] = null;
          emit();
        }));

      const vm = doc.createElement('select');
      vm.id = 'voice-voicemail-behavior';
      vm.name = vm.id;
      vm.dataset.policyPath = 'channels.voice.voicemailBehavior';
      const vmField = field(doc, 'On voicemail', vm);

      detail.appendChild(pairRow(doc, retryField, vmField));

      const transfer = doc.createElement('select');
      transfer.id = 'voice-transfer-target';
      transfer.name = transfer.id;
      transfer.dataset.policyPath = 'channels.voice.transferTarget';
      const transferField = field(doc, 'Transfer to human', transfer);

      /* Who to hand off to was configurable; the number to actually ring was
         not, so "transfer to a real person" had no destination. Paired with the
         target select and hidden when the target is "No transfer" — there is
         nothing to dial then, and an orphaned number field reads as a bug. */
      const target = cfg.transferTarget || 'front_office';
      if (target === 'none') {
        detail.appendChild(transferField);
      } else {
        const transferNum = input(doc, {
          id: 'voice-transfer-number', type: 'tel',
          path: 'channels.voice.transferNumber',
          value: cfg.transferNumber || ''
        });
        transferNum.placeholder = '(555) 123-4567';
        transferNum.autocomplete = 'off';
        transferNum.addEventListener('input', () => {
          patch['channels.voice.transferNumber'] = transferNum.value;
          emit();
        });
        detail.appendChild(pairRow(doc, transferField,
          field(doc, 'Transfer to phone number', transferNum)));
      }

      card.appendChild(channelComplianceStrip(doc, ch, compliance, rule));
      host.appendChild(card);

      mountSelect(vm, {
        options: [
          { value: 'leave', label: 'Leave a message' },
          { value: 'hangup', label: 'Hang up' },
          { value: 'retry', label: 'Retry later' }
        ],
        value: cfg.voicemailBehavior || 'leave', win,
        onChange: v => { patch['channels.voice.voicemailBehavior'] = v; emit(); }
      });

      mountSelect(transfer, {
        options: [
          { value: 'front_office', label: 'Front office' },
          { value: 'care_coordinator', label: 'Care coordinator' },
          { value: 'none', label: 'No transfer' }
        ],
        value: cfg.transferTarget || 'front_office', win,
        onChange: v => { patch['channels.voice.transferTarget'] = v; emit(); }
      });
      continue;
    }

    card.appendChild(channelComplianceStrip(doc, ch, compliance, rule));
    host.appendChild(card);
  }

  const comp = doc.createElement('section');
  comp.className = 'cf-channel-card';
  comp.dataset.channel = 'compliance';

  comp.dataset.locked = 'true';

  const ch2 = doc.createElement('h3');
  ch2.textContent = 'Compliance';
  comp.appendChild(ch2);

  /* Locked, not removed: these are still the canonical values the per-channel
     strips read from, so they stay visible and greyed rather than disappearing.
     Every control below is disabled — a disabled input is also never collected
     by collectPolicy, so there is no path from this card into a commit. */
  const lockNote = doc.createElement('p');
  lockNote.className = 'cf-locked-note';
  lockNote.textContent = 'Determined by Credify and applied to every channel. Not editable here.';
  comp.appendChild(lockNote);

  const qs = input(doc, { id: 'quiet-start', type: 'time',
    path: 'compliance.quietStart', value: compliance.quietStart || '21:00' });
  qs.addEventListener('input', () => { patch['compliance.quietStart'] = qs.value; emit(); });
  const qsField = field(doc, 'Quiet hours start', qs,
    badgeFor(doc, sources, 'compliance.quietStart', () => {
      patch['compliance.quietStart'] = null;
      emit();
    }));

  const qe = input(doc, { id: 'quiet-end', type: 'time',
    path: 'compliance.quietEnd', value: compliance.quietEnd || '08:00' });
  qe.addEventListener('input', () => { patch['compliance.quietEnd'] = qe.value; emit(); });
  const qeField = field(doc, 'Quiet hours end', qe);

  comp.appendChild(pairRow(doc, qsField, qeField));

  const phi = input(doc, { id: 'phi-safe', type: 'checkbox',
    path: 'compliance.phiSafe', value: compliance.phiSafe !== false });
  phi.addEventListener('change', () => { patch['compliance.phiSafe'] = phi.checked; emit(); });
  comp.appendChild(field(doc, 'PHI-safe content mode', phi,
    badgeFor(doc, sources, 'compliance.phiSafe', () => {
      patch['compliance.phiSafe'] = null;
      emit();
    })));

  // Listeners above are left wired but unreachable: disabled controls fire nothing.
  for (const el of [qs, qe, phi]) el.disabled = true;

  host.appendChild(comp);
}
