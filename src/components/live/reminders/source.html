     keepFocus(el) before emit(), and renderWhatIfs restores id + caret at the
     end of the rebuild. The capture cannot happen at the top of renderWhatIfs

     input is already detached and doc.activeElement is <body> by then. (That

     new name field (7) usable at all; it also fixes the condition value input,
     which has been dropping keystrokes since the field was added.

     to change); the header renders it as an editable Instrument Serif field

<head>

<style>
/* src/styles/tokens.css */
:root {
  --c-primary: #1a8a66;
  --c-primary-dark: #157254;
  --c-accent: #22a87e;
  --c-accent-2: #3dbd94;
  --c-mint: #edfaf4;
  --c-mint-2: #d4f4e8;
  --c-text: #0d1f18;
  --c-muted: #527060;
  --c-muted-2: #8aaa9a;
  --c-surface: #f4f7f5;
  --c-surface-2: #eaf0ec; /* segmented-control trough (matches EHR --surface-2) */
  --c-surface-3: #cfdcd6; /* switch track, off state */
  --c-border: #dde8e3;
  --c-danger: #b4453a;
  --c-danger-bg: #fbeeec;
  --r-sm: 8px;
  --r-md: 10px;
  --r-lg: 14px;
  --ctl-h: 36px;
  --ctl-fs: 13.5px;
  --ctl-h-lg: 40px;
  --ctl-fs-lg: 14px;
  --f-body: 'Sora', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-display: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  --shadow-sm: 0 1px 2px rgba(13, 31, 24, 0.05);
  --shadow-md: 0 6px 20px rgba(13, 31, 24, 0.08);
}

*, *::before, *::after { box-sizing: border-box; }

input, select, textarea, button {
  height: var(--ctl-h);
  font-size: var(--ctl-fs);
  font-family: inherit;
  color: var(--c-text);
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  padding: 0 10px;
}

textarea {
  height: auto;
  padding: 8px 10px;
  line-height: 1.5;
  resize: vertical;
}

input[type="checkbox"] {
  height: 18px;
  width: 18px;
  padding: 0;
  accent-color: var(--c-primary);
}

input[type="range"] {
  padding: 0;
  border: 0;
  background: transparent;
  accent-color: var(--c-primary);
  width: 100%;
}

input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: 2px solid var(--c-accent);
  outline-offset: 1px;
}

/* src/styles/app.css */
body {
  margin: 0;
  font-family: var(--f-body);
  font-size: 14px;
  color: var(--c-text);
  background: var(--c-surface);
  line-height: 1.5;
}

h1, h2, h3 { font-weight: 500; margin: 0 0 8px; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: 30px; letter-spacing: 0.2px; }
h2 { font-size: 17px; }
h3 { font-size: 14px; }

/* V33: module owns no rail. The deep-green rail below is the EHR host nav,
   rendered here only so the module can be viewed standalone. Reminders puts
   nothing in it — its own nav lives in .mod-head. */
.cf-scope-chip { display: none; }

/* ---- EHR host rail (host-owned; not module nav) ---- */
.ehr-rail {
  width: 218px;
  flex-shrink: 0;
  background: #0f3b2c;
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
  overflow: hidden;
  z-index: 20;
}
.ehr-rail-brand { display: flex; align-items: center; gap: 10px; padding: 16px 15px 18px; }
.ehr-rail-mark {
  width: 32px; height: 32px; border-radius: 9px; flex-shrink: 0;
  display: grid; place-items: center;
  background: linear-gradient(135deg, var(--c-primary), var(--c-accent));
  color: #fff; font-family: var(--f-display); font-size: 19px; line-height: 1;
}
.ehr-rail-name { font-family: var(--f-display); font-size: 20px; line-height: 1; color: #fff; }
.ehr-rail-sub {
  font-size: 9px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase;
  color: rgba(255,255,255,.45); margin-top: 4px;
}
.ehr-rail-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 0 14px; }
.ehr-rail-item {
  display: flex; align-items: center; gap: 11px; width: 100%;
  padding: 8px 16px; border: 0; background: none;
  color: rgba(255,255,255,.68); font-family: inherit; font-size: 13.5px;
  font-weight: 500; text-align: left; height: auto; border-radius: 0;

.ehr-rail-item svg { flex-shrink: 0; opacity: .75; }
.ehr-rail-item.is-active {

  box-shadow: inset 3px 0 0 var(--c-accent-2);

.ehr-rail-item.is-active svg { opacity: 1; }
.ehr-rail-label {
  padding: 16px 16px 6px; font-size: 9px; font-weight: 600;
  letter-spacing: .16em; text-transform: uppercase; color: rgba(255,255,255,.32);

.ehr-rail-note {
  padding: 12px 15px 16px; border-top: 1px solid rgba(255,255,255,.10);
  font-size: 9.5px; line-height: 1.45; letter-spacing: .05em;
  text-transform: uppercase; color: rgba(255,255,255,.30);
}

/* ---- module shell ---- */
.cf-shell { display: flex; align-items: stretch; min-height: 100vh; }
.cf-shell-center {
  flex: 1; min-width: 0; display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}

/* ---- module header: title + scope chip + actions + tab row ---- */
.mod-head {
  flex-shrink: 0;
  background: #fff;
  border-bottom: 1px solid var(--c-border);
  padding: 16px 24px 0;

.mod-head-top { display: flex; align-items: flex-end; gap: 14px; margin-bottom: 12px; }
.mod-title {
  font-family: var(--f-display); font-weight: 400; font-size: 26px;
  line-height: 1; letter-spacing: -.01em; margin: 0;
}
.mod-desc { font-size: 12.5px; color: var(--c-muted); margin-bottom: 3px; }
.mod-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }

/* scope selector — replaces the old sidebar Clients/Providers/+Customize block */
.mod-scope {
  display: flex; align-items: center; gap: 9px;
  height: 32px; padding: 0 12px 0 13px;
  border: 1px solid var(--c-mint-2); background: var(--c-mint);
  border-radius: var(--r-sm); cursor: pointer; font-family: inherit;
}
.mod-scope:hover { background: var(--c-mint-2); }
.mod-scope-k {
  font-size: 10px; font-weight: 600; letter-spacing: .13em;
  text-transform: uppercase; color: var(--c-muted-2);
}
.mod-scope-v { font-size: 13px; font-weight: 600; color: var(--c-primary); }
.mod-scope-cv { font-size: 9px; color: var(--c-primary); }
.mod-scope-reset {
  height: 32px; padding: 0 13px; border: 1px solid var(--c-border);
  background: #fff; border-radius: var(--r-sm); font-family: inherit;
  font-size: 12.5px; color: var(--c-muted); cursor: pointer;
}
.mod-scope-reset:hover { background: var(--c-surface); color: var(--c-text); }

/* house tab row — matches the EHR contact-record pattern */
.mod-tabs { display: flex; gap: 2px; overflow-x: auto; }
.mod-tab {
  position: relative; height: auto; border: 0; background: none;
  padding: 0 13px 11px; border-radius: 0;
  font-family: inherit; font-size: 13.5px; font-weight: 500;
  color: var(--c-muted); cursor: pointer; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
}
.mod-tab:hover { color: var(--c-text); }
.mod-tab.is-active { color: var(--c-primary); font-weight: 600; }
.mod-tab.is-active::after {
  content: ''; position: absolute; left: 11px; right: 11px; bottom: -1px;
  height: 2.5px; border-radius: 3px 3px 0 0; background: var(--c-primary);
}
.mod-tab-cnt {
  min-width: 18px; height: 18px; padding: 0 5px; border-radius: 6px;
  background: var(--c-surface); color: var(--c-muted);
  font-size: 10px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.mod-tab.is-active .mod-tab-cnt { background: var(--c-mint); color: var(--c-primary); }

/* ---- body split ---- */
.cf-body-split { flex: 1; min-height: 0; display: flex; }

.cf-pane { background: #fff; padding: 16px; }
.cf-pane-editor {
  background: var(--c-surface);
  flex: 1; min-width: 0; min-height: 0;
  overflow-y: auto;
  border-right: 0;
  padding: 18px 24px 48px;
}
#policy-form { max-width: 840px; }
.cf-pane-sim {
  border-left: 1px solid var(--c-border);
  width: 320px; flex-shrink: 0;
  overflow-y: auto;
  padding: 0;
}

.cf-pane-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  color: var(--c-muted-2);
  margin-bottom: 10px;
}

.cf-hint { color: var(--c-muted); font-size: 12.5px; margin: 0 0 12px; }

.cf-scope-tree, .cf-scope-sub { list-style: none; margin: 0; padding: 0; }
.cf-scope-sub { padding-left: 8px; }
.cf-scope-group {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  color: var(--c-muted-2);
  margin: 14px 0 4px;
}
.cf-scope-btn {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 6px;
  width: 100%;
  background: transparent;
  border: 0;
  border-radius: var(--r-sm);
  text-align: left;
  padding: 0 8px;
  cursor: pointer;
  color: var(--c-text);
}
.cf-scope-btn:hover { background: var(--c-mint); }
.cf-scope-btn.is-active {
  background: var(--c-mint-2);
  color: var(--c-primary-dark);
  font-weight: 600;
}
.cf-override-count {
  background: var(--c-primary);
  color: #fff;
  border-radius: 6px;
  font-size: 10.5px;
  min-width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  padding: 0 5px;
  flex: none;
}

.cf-tabs {
  display: flex;
  gap: 2px;
  border-bottom: 1px solid var(--c-border);
  margin-bottom: 16px;
}
.cf-tab {
  background: transparent;
  border: 0;
  border-bottom: 2px solid transparent;
  border-radius: 0;
  padding: 0 14px;
  cursor: pointer;
  color: var(--c-muted);
}
.cf-tab:hover { color: var(--c-text); }
.cf-tab.is-active {
  color: var(--c-primary);
  border-bottom-color: var(--c-primary);
  font-weight: 600;
}

.cf-field { display: grid; gap: 4px; margin-bottom: 12px; }
/* V31: 2-column paired field rows on Channels tab; children keep their own margin reset */
.cf-field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cf-field-grid > .cf-field { margin-bottom: 12px; }
@media (max-width: 720px) {
  .cf-field-grid { grid-template-columns: 1fr; gap: 0; }
}
.cf-field label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--c-muted);
}

.cf-inherit-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 10.5px;
  color: var(--c-muted);
  background: var(--c-mint);
  /* Squared with everything else even though badgeFor() currently returns null
     and these render nowhere — so re-enabling the inherited chips later does not
     reintroduce a pill into a squared UI. */
  border-radius: 6px;
  padding: 1px 3px 1px 9px;
}
.cf-inherit-revert {
  height: 15px;
  width: 15px;
  padding: 0;
  border: 0;
  border-radius: 5px;
  background: var(--c-muted-2);
  color: #fff;
  font-size: 9px;
  line-height: 15px;
  cursor: pointer;
}
.cf-inherit-revert:hover { background: var(--c-primary); }

.cf-select { position: relative; }
.cf-select-trigger {
  width: 100%;
  text-align: left;
  background: #fff;
  cursor: pointer;
}
/* Empty state: the trigger is showing a `placeholder: true` option's label, not
   a chosen value. Matches ::placeholder on a text input. */
.cf-select-trigger.is-placeholder { color: var(--c-muted-2); }
.cf-select-trigger::after {
  content: '';
  position: absolute;
  right: 12px;
  top: 15px;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--c-muted-2);
}
/* Sized to its longest option rather than pinned to the trigger's width —
   "No confirmation after N attempts" was wrapping onto two lines in a 190px
   control. Still never narrower than the trigger. */
.cf-select-list {
  position: absolute;
  z-index: 30;
  top: calc(100% + 4px);
  left: 0;
  right: auto;
  min-width: 100%;
  width: max-content;
  max-width: min(340px, 78vw);
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  padding: 4px;
}
.cf-select-search {
  display: block;
  width: 100%;
  box-sizing: border-box;
  height: 32px;
  font-size: 13px;
  font-family: inherit;
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  padding: 0 8px;
  margin-bottom: 4px;
  color: var(--c-text);
  background: var(--c-surface);
}
.cf-select-search:focus { outline: 2px solid var(--c-accent); outline-offset: 1px; border-color: var(--c-accent); }
.cf-select-options { max-height: 240px; overflow-y: auto; }
/* the default OS scrollbar reads as a heavy grey slab inside a small popup */
.cf-select-options, .cf-tsel-options, .cf-picker-list {
  scrollbar-width: thin;
  scrollbar-color: #c3d5cd transparent;
}
.cf-select-options::-webkit-scrollbar,
.cf-tsel-options::-webkit-scrollbar,
.cf-picker-list::-webkit-scrollbar { width: 8px; }
.cf-select-options::-webkit-scrollbar-track,
.cf-tsel-options::-webkit-scrollbar-track,
.cf-picker-list::-webkit-scrollbar-track { background: transparent; }
.cf-select-options::-webkit-scrollbar-thumb,
.cf-tsel-options::-webkit-scrollbar-thumb,
.cf-picker-list::-webkit-scrollbar-thumb {
  background: #c3d5cd; border-radius: 99px;
  border: 2px solid #fff; background-clip: padding-box;
}

/* V9: tabbed trigger picker — tabs always visible above the trigger button */
.cf-tsel { position: relative; }
.cf-tsel-tabs {
  display: flex;
  border: 1px solid var(--c-border);
  border-bottom: none;
  border-radius: var(--r-sm) var(--r-sm) 0 0;
  background: var(--c-surface);
  overflow: hidden;
}
.cf-tsel-tab {
  flex: 1;
  padding: 6px 4px;
  font-size: 11.5px;
  font-weight: 600;
  font-family: inherit;
  border: none;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--c-muted);
  cursor: pointer;
  transition: color .12s, background .12s;
  height: auto;
}
.cf-tsel-tab:hover { color: var(--c-text); background: rgba(0,0,0,.03); }
.cf-tsel-tab.is-active { color: var(--c-primary); border-bottom-color: var(--c-primary); background: #fff; }
.cf-tsel-trigger {
  width: 100%;
  text-align: left;
  background: #fff;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  border-top: none;
}
.cf-tsel-trigger::after {
  content: '';
  width: 0; height: 0;
  border-left: 4px solid transparent;
  border-right: 4px solid transparent;
  border-top: 5px solid var(--c-muted-2);
  flex-shrink: 0;
}
.cf-tsel-panel {
  position: absolute;
  z-index: 30;
  top: calc(100% + 2px);
  left: 0;
  min-width: 100%;
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}
.cf-tsel-options {
  max-height: 220px;
  overflow-y: auto;
  padding: 4px;
}
.cf-tsel-option {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: var(--r-sm);
  padding: 7px 10px;
  font-size: 13px;
  font-family: inherit;
  color: var(--c-text);
  cursor: pointer;
  height: auto;
  line-height: 1.3;
}
.cf-tsel-option:hover { background: var(--c-mint); }
.cf-tsel-option.is-active { font-weight: 600; color: var(--c-primary); }
.cf-select-option {
  display: block;
  width: 100%;
  text-align: left;
  background: transparent;
  border: 0;
  border-radius: var(--r-sm);
  cursor: pointer;
}
.cf-select-option:hover { background: var(--c-mint); }

.cf-step-card, .cf-channel-card, .cf-recurrence-card {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.cf-step-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.cf-step-head h3 { margin: 0; }
.cf-step-when {
  background: var(--c-mint);
  color: var(--c-primary-dark);
  border-radius: 6px;
  padding: 2px 10px;
  font-size: 11.5px;
  font-weight: 600;
}
.cf-step-head .cf-btn-quiet { margin-left: auto; }

.cf-chain {
  border-left: 2px solid var(--c-mint-2);
  padding-left: 12px;
  margin: 10px 0;
}
.cf-chain-row {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
  gap: 10px;
  align-items: end;
  padding: 8px 0;
  border-bottom: 1px dashed var(--c-border);
}
.cf-chain-row:last-child { border-bottom: 0; }
.cf-repeat-host { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--c-border); }

.cf-weekday-row { display: flex; gap: 6px; margin-bottom: 12px; }
.cf-weekday {
  height: 32px;
  width: 32px;
  padding: 0;
  border-radius: var(--r-sm);
  background: #fff;
  color: var(--c-muted);
  cursor: pointer;
}
.cf-weekday.is-on {
  background: var(--c-primary);
  border-color: var(--c-primary);
  color: #fff;
  font-weight: 600;
}

/* Channel title and its Enabled switch on one row, the switch pushed right. */
.cf-channel-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-bottom: 4px;
}
.cf-channel-head h3 { margin: 0; }
.cf-channel-enable {
  margin-left: auto;
  display: inline-flex; align-items: center; gap: 8px;
  min-height: 26px; cursor: pointer;   /* label is the hit target, 26px floor */
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--c-muted-2);
}
.cf-channel-enable input { margin: 0; }
.cf-channel-detail { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--c-border); }

.cf-preset-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.cf-preset-btn {
  background: var(--c-mint);
  border-color: var(--c-mint-2);
  color: var(--c-primary-dark);
  cursor: pointer;
  font-size: 12.5px;
}
.cf-preset-btn:hover { background: var(--c-mint-2); }

.cf-rule-list { margin-bottom: 14px; }
.cf-rule-row {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 8px;
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 10px 12px;
  margin-bottom: 8px;
}
.cf-rule-row[data-drifted="true"] { border-left: 3px solid var(--c-accent); }
.cf-rule-row .cf-field { margin-bottom: 0; }
.cf-rule-row > select, .cf-rule-row .cf-select { min-width: 190px; }
.cf-rule-kw {
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.9px;
  color: var(--c-muted-2);
  padding-bottom: 9px;
}
.cf-rule-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.cf-rule-action { display: flex; gap: 4px; align-items: center; }
.cf-rule-cond { width: 76px; }
.cf-drift-flag {
  font-size: 10.5px;
  color: var(--c-accent);
  background: var(--c-mint);
  border-radius: 6px;
  padding: 2px 9px;
}

.cf-template-block {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow-sm);
}
.cf-template-block label { display: block; font-size: 12px; color: var(--c-muted); margin-bottom: 4px; }
.cf-template-block input, .cf-template-block textarea { width: 100%; }
.cf-preview-label {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  color: var(--c-muted-2);
  margin: 10px 0 4px;
}
.cf-template-preview {
  margin: 0;
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  padding: 10px;
  font-family: var(--f-body);
  font-size: 12.5px;
  white-space: pre-wrap;
  color: var(--c-muted);
}

.cf-warn {
  color: var(--c-danger);
  background: var(--c-danger-bg);
  border-radius: var(--r-sm);
  padding: 6px 10px;
  font-size: 12px;
  margin: 8px 0 0;
}

.cf-sim-stamp {
  font-size: 12px;
  color: var(--c-muted);
  margin-bottom: 10px;
}
.cf-log { font-size: 12px; margin-top: 12px; }
.cf-log-row {
  display: grid;
  grid-template-columns: 96px 62px minmax(0, 1fr);
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--c-border);
}
.cf-log-when { color: var(--c-muted-2); }
.cf-log-chan { color: var(--c-muted); text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.5px; padding-top: 1px; }
.cf-log-row[data-kind="suppressed"] .cf-log-detail { color: var(--c-muted-2); }
.cf-log-row[data-kind="rule"] .cf-log-detail { color: var(--c-primary); font-weight: 600; }
.cf-log-row[data-kind="inbound"] .cf-log-detail { color: var(--c-accent); font-weight: 600; }
.cf-log-row[data-kind="final"] { border-bottom: 0; }
.cf-log-row[data-kind="final"] .cf-log-detail { font-weight: 700; }

.cf-btn-primary {
  background: var(--c-primary);
  border-color: var(--c-primary);
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  padding: 0 16px;
}
.cf-btn-primary:hover { background: var(--c-primary-dark); }
.cf-btn-secondary {
  background: #fff;
  color: var(--c-primary-dark);
  cursor: pointer;
  font-size: 12.5px;
}
.cf-btn-secondary:hover { background: var(--c-mint); }
.cf-btn-quiet {
  background: transparent;
  border-color: transparent;
  color: var(--c-muted-2);
  cursor: pointer;
  font-size: 12px;
  padding: 0 8px;
}
.cf-btn-quiet:hover { color: var(--c-danger); background: var(--c-danger-bg); }

.cf-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  background: rgba(13, 31, 24, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.cf-modal {
  background: #fff;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md);
  padding: 20px;
  width: 340px;
  max-width: 100%;
}
.cf-modal h2 { font-family: var(--f-display); font-weight: 400; margin-bottom: 14px; }
.cf-modal-choice {
  display: block;
  width: 100%;
  text-align: left;
  margin-bottom: 8px;
  cursor: pointer;
}
.cf-modal-choice:hover { background: var(--c-mint); border-color: var(--c-mint-2); }
.cf-modal-cancel {
  display: block;
  width: 100%;
  background: transparent;
  border-color: transparent;
  color: var(--c-muted);
  cursor: pointer;
  margin-top: 4px;
}

/* V2: exceptions panel */
.cf-exceptions-panel {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--c-border);
}
.cf-exceptions-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  color: var(--c-muted-2);
  margin-bottom: 8px;
}
.cf-exception-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--c-mint);
  border: 1px solid var(--c-mint-2);
  border-radius: var(--r-sm);
  padding: 6px 10px;
  margin-bottom: 6px;
  font-size: 12.5px;
}
.cf-exception-row:last-child { margin-bottom: 0; }
.cf-exception-date { color: var(--c-primary-dark); font-weight: 600; min-width: 80px; }
.cf-exception-desc { flex: 1; color: var(--c-muted); }
.cf-exception-revert {
  background: transparent;
  border-color: transparent;
  color: var(--c-muted-2);
  cursor: pointer;
  font-size: 11px;
  height: 22px;
  padding: 0 6px;
}
.cf-exception-revert:hover { color: var(--c-danger); }

/* V2: conditions builder */
.cf-conditions-block {
  border-top: 1px solid var(--c-border);
  margin-top: 10px;
  padding-top: 10px;
}
.cf-conditions-title {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.9px;
  color: var(--c-muted-2);
  margin-bottom: 8px;
}
.cf-condition-row {
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  gap: 6px;
  margin-bottom: 6px;
}
.cf-condition-row select, .cf-condition-row .cf-select { min-width: 120px; flex: 1; }
.cf-condition-row input { min-width: 80px; flex: 0 0 80px; }
.cf-cond-add { font-size: 12px; margin-top: 4px; }

/* V2: language */
.cf-lang-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}
.cf-lang-btn {
  background: #fff;
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  color: var(--c-muted);
  cursor: pointer;
  font-size: 12px;
  padding: 0 12px;
  height: 28px;
}
.cf-lang-btn.is-active {
  background: var(--c-primary);
  border-color: var(--c-primary);
  color: #fff;
  font-weight: 600;
}
.cf-lang-fallback {
  font-size: 11.5px;
  color: var(--c-accent);
  background: var(--c-mint);
  border-radius: 6px;
  padding: 2px 9px;
}

/* V3 additions */
/* V33: the old `#sim-channel { display: block }` override forced the native
   <select> to stay visible after mountSelect() set [hidden] on it, so the
   simulator rendered two stacked channel pickers. The custom trigger is the
   control; the native element is the value holder and must stay hidden. */

/* Gap 3: exceptions panel series picker spacing */
.cf-exceptions-panel > .cf-field:first-child { margin-bottom: 8px; }

/* Gap 4: exception row inline edit */
.cf-exception-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.cf-exception-edit {
  background: none;
  border: 1px solid var(--c-border);
  border-radius: var(--r-sm);
  color: var(--c-primary);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 8px;
  margin-left: auto;
}
.cf-exception-edit:hover { background: var(--c-mint); }
.cf-exception-edit-panel {
  border-top: 1px solid var(--c-border);
  margin-top: 8px;
  padding-top: 10px;
}
.cf-exception-edit-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

/* Gap 5: compliance table */
.cf-compliance-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 10px;
}
.cf-compliance-table th {
  text-align: left;
  padding: 6px 10px;
  background: var(--c-surface);
  border-bottom: 1px solid var(--c-border);
  font-weight: 600;
  font-size: 12px;
  color: var(--c-muted);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.cf-compliance-table td {
  padding: 7px 10px;
  border-bottom: 1px solid var(--c-border);
  color: var(--c-text);
}
.cf-compliance-table tr:last-child td { border-bottom: 0; }

@media (max-width: 900px) {
  .cf-shell { flex-direction: column; }
  .cf-shell-center { height: auto; overflow: visible; }
  .ehr-rail {
    width: 100%; height: auto; position: static;
    flex-direction: row; align-items: center; overflow-x: auto;
  }
  .ehr-rail-brand { padding: 10px 14px; }
  .ehr-rail-scroll { display: flex; flex-direction: row; padding: 0; overflow-x: auto; }
  .ehr-rail-item { width: auto; white-space: nowrap; flex-shrink: 0; }
  .ehr-rail-item.is-active { box-shadow: inset 0 -3px 0 var(--c-accent-2); }
  .ehr-rail-label, .ehr-rail-note { display: none; }
  .mod-head { padding: 16px 16px 0; }

  }

    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 40;

    max-height: 72vh;
    overflow-y: auto;
    border-top: 1px solid var(--c-border);

    border-bottom: 0;
    box-shadow: 0 -8px 24px rgba(13, 31, 24, 0.12);
    width: auto;

  }
  /* Collapsed height must clear .cf-sim-head (18px + ~20px + 14px + border). */
  .cf-sim-collapsed .cf-pane-sim { max-height: 54px; overflow: hidden; }
  .cf-sim-toggle {
    position: fixed;
    right: 14px;
    bottom: 14px;

    cursor: pointer;
    border-radius: var(--r-sm);
    padding: 0 18px;
    box-shadow: var(--shadow-md);

  .cf-rule-row { flex-direction: column; align-items: stretch; }
  .cf-rule-kw { padding-bottom: 0; }
  .cf-log-row { grid-template-columns: 88px 56px minmax(0, 1fr); }
}

/* =====================================================================
   V33 restyle. Everything below re-skins the EXISTING component classes
   so all five tabs pick up the new look without their render functions
   changing. Ordering matters: these rules intentionally come last.
   ===================================================================== */

/* ---- simulator rail ---- */
.cf-sim-head {
  position: sticky; top: 0; z-index: 2;
  display: flex; align-items: center; gap: 9px;
  padding: 14px 16px 11px;
  background: #fff; border-bottom: 1px solid var(--c-border);
}
.cf-sim-title { font-size: 13.5px; font-weight: 600; }
.cf-sim-live {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-size: 10px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--c-primary); background: var(--c-mint); border-radius: 6px; padding: 4px 9px;
}
.cf-sim-live i { width: 6px; height: 6px; border-radius: 50%; background: var(--c-accent); display: block; }
.cf-sim-body { padding: 14px 16px 24px; }
.cf-sim-tz {
  font-size: 11.5px; line-height: 1.45; color: var(--c-muted-2);
  background: var(--c-surface); border-radius: var(--r-sm);
  padding: 9px 11px; margin: 0 0 14px;
}
.cf-sim-stamp { font-size: 12px; color: var(--c-muted); margin: 14px 0 10px; }
.cf-log {
  margin-top: 16px; border: 1px solid var(--c-border);
  border-radius: var(--r-md); overflow: hidden; font-size: 11.5px;
}
/* Narrower columns than the old three-pane layout allowed — the rail is 320px,
   so the timestamp/channel columns shrink and the detail wraps instead of clipping. */
.cf-log-row {
  grid-template-columns: 72px 44px minmax(0, 1fr);
  gap: 7px; padding: 8px 12px; align-items: baseline;
}
.cf-log-row:nth-child(odd) { background: #fbfdfc; }
.cf-log-when, .cf-log-chan { font-size: 10px; line-height: 1.35; }
.cf-log-detail { overflow-wrap: anywhere; line-height: 1.4; }

/* ---- micro-labels ---- */
.cf-field { gap: 6px; margin-bottom: 13px; }
.cf-field > label {
  flex-wrap: wrap; gap: 6px; line-height: 1.35;
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--c-muted-2);
}
/* Badges and controls that live inside a label must not inherit its
   uppercase/tracking — long inherited-source names become unreadable. */
.cf-field > label .cf-inherit-badge,
.cf-field > label input,
.cf-field > label select {
  text-transform: none; letter-spacing: 0; font-weight: 500;
}
.cf-inherit-badge {
  font-size: 10px; padding: 2px 3px 2px 8px;
  border: 1px solid var(--c-mint-2); color: var(--c-primary);
}
/* Long labels wrap instead of forcing a two-column grid into slivers. The
   1280px breakpoint was set when labels were 13.5px and the pane was wider;
   at 10px/.09em tracking two columns hold comfortably down to ~1040px. */
.cf-field-grid { gap: 12px 16px; }
@media (max-width: 1040px) { .cf-field-grid { grid-template-columns: 1fr; gap: 0; } }
.cf-pane-title {
  font-size: 10px; font-weight: 600; letter-spacing: .13em;
  color: var(--c-muted-2); margin-bottom: 12px;
}

/* ---- controls ---- */
input, select, textarea, .cf-select-trigger, .cf-tsel-trigger {
  height: 34px; font-size: 13px; padding: 0 11px;
  transition: border-color .12s, box-shadow .12s;
}
textarea { height: auto; padding: 9px 11px; min-height: 76px; }
input:focus, select:focus, textarea:focus,
.cf-select-trigger:focus, .cf-tsel-trigger:focus {
  outline: none; border-color: var(--c-accent);
  box-shadow: 0 0 0 3px rgba(34,168,126,.13);
}
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible {
  outline: none; border-color: var(--c-accent);
  box-shadow: 0 0 0 3px rgba(34,168,126,.13);
}
.cf-select-trigger::after { top: 14px; }

/* ---- cards ---- */
.cf-step-card, .cf-channel-card, .cf-recurrence-card,
.cf-template-block, .cf-tmpl-card {
  border-radius: var(--r-lg); padding: 16px;
  margin-bottom: 11px; box-shadow: var(--shadow-sm);
}
.cf-cond-card { background: transparent; border: 0; padding: 0; }
.cf-cond-row {
  border-radius: var(--r-lg); box-shadow: var(--shadow-sm);
  margin-bottom: 11px; overflow: hidden;
}
.cf-cond-head {
  padding: 11px 16px; gap: 10px;
  background: linear-gradient(180deg, #fbfdfc, #fff);
  border-radius: 0;
}
.cf-cond-num { width: 23px; height: 23px; border-radius: 7px; font-weight: 600; font-size: 11.5px; }
.cf-cond-body { padding: 16px; gap: 13px; }
.cf-cond-saved-panel { padding: 16px; }
.cf-cond-toggle-bar { padding: 12px 16px 0; }

/* ---- inline "sentence" rows ---- */
.cf-cond-guard, .cf-cond-inline, .cf-cond-offset, .cf-deadline-row {
  gap: 9px; align-items: center;
}
.cf-cond-guard {
  padding: 11px 13px; border-radius: var(--r-md); font-size: 13px;
}
.cf-cond-guard-label, .cf-cond-inline-label { font-size: 13.5px; color: var(--c-muted); }
.cf-cond-guard input[type=number] { width: 64px; height: 34px; font-size: 13px; }
.cf-cond-inline-ctl { min-width: 140px; }
.cf-deadline { gap: 10px; margin-top: 13px; padding-top: 13px; }
.cf-deadline-label { font-size: 13px; color: var(--c-text); font-weight: 500; }

/* ---- toggles / chips / segmented ----
   Rounded rectangles, not pills, per Jay. This is the consolidated rule for the
   whole toggle family — language, channel, New/Saved and the Schedule
   equivalents — so all four rows of controls above a message body match the
   squared buttons and rule cards from the earlier radius pass. */
.cf-chanchip, .cf-cond-mode-btn, .cf-tmpl-mode-btn, .cf-lang-btn, .cf-tmpl-chan-btn {
  height: 32px; border-radius: var(--r-sm); font-size: 12.5px; font-weight: 500;
  transition: background .12s, color .12s, border-color .12s;
}
.cf-chanchip { padding: 0 15px; }
.cf-chanchip:hover, .cf-cond-mode-btn:hover, .cf-tmpl-mode-btn:hover,
.cf-lang-btn:hover, .cf-tmpl-chan-btn:hover { border-color: var(--c-accent); color: var(--c-primary); }
.cf-chanchip.is-on, .cf-tmpl-chan-btn.is-active, .cf-lang-btn.is-active {
  background: var(--c-mint); border-color: var(--c-accent);
  color: var(--c-primary); font-weight: 600;
}
.cf-cond-mode-btn.is-new, .cf-tmpl-mode-btn.is-new {
  background: var(--c-primary); border-color: var(--c-primary); color: #fff; font-weight: 600;
}
/* Per-condition channel checkboxes read as pills, matching .cf-chanchip
   elsewhere. The native checkbox stays in the DOM as the value holder. */
.cf-cond-channels-wrap { gap: 9px; }
.cf-chan-chk {
  gap: 8px; height: 32px; padding: 0 13px;
  border: 1px solid var(--c-border); border-radius: var(--r-sm); background: #fff;
  font-size: 13px; font-weight: 500; color: var(--c-muted);
  transition: background .12s, color .12s, border-color .12s;
}
.cf-chan-chk:hover { border-color: var(--c-accent); color: var(--c-primary); }
.cf-chan-chk input { width: 15px; height: 15px; }
.cf-chan-chk:has(input:checked) {
  background: var(--c-mint); border-color: var(--c-accent);
  color: var(--c-primary); font-weight: 600;
}

/* ---- buttons ---- */
/* V2: squared off with the rule card. The card redesign moves every pill in
   the What-Ifs block to --r-sm/--r-md; leaving these four classes at 999px
   made the card read as a different component family. Segmented troughs,
   .mod-btn and the channel pills deliberately stay round. */
.cf-btn-primary, .cf-cond-save-btn, .cf-tmpl-save-btn {
  height: 32px; border-radius: var(--r-md); padding: 0 17px;
  font-size: 12.5px; font-weight: 600;
  background: var(--c-primary); border: 1px solid var(--c-primary); color: #fff;
  transition: background .12s;
}
.cf-btn-primary:hover, .cf-cond-save-btn:hover, .cf-tmpl-save-btn:hover {
  background: var(--c-primary-dark); border-color: var(--c-primary-dark); opacity: 1;
}
.cf-btn-secondary, .cf-preset-btn, .cf-tmpl-action-btn, .cf-cond-add, .cf-exception-edit {
  height: 30px; border-radius: var(--r-md); padding: 0 14px; font-size: 12.5px;
}
.cf-preset-bar { gap: 8px; margin-bottom: 18px; }
.cf-cond-addrow { margin-top: 14px; }
.cf-cond-save-row { margin-top: 8px; }

/* Add-condition affordance reads as a target, not a stray button. */
.cf-cond-addrow .cf-btn-secondary {
  width: 100%; height: 40px; justify-content: center;
  border: 1.5px dashed #cfdcd6; border-radius: var(--r-md);
  background: transparent; color: var(--c-muted); font-weight: 500;
}
.cf-cond-addrow .cf-btn-secondary:hover {
  border-style: solid; border-color: var(--c-accent);
  background: var(--c-mint); color: var(--c-primary);
}

/* ---- opt-out roster + holiday tables ----
   Both are checkbox grids, so the channel columns are sized to their headers
   and centred rather than left-aligned like text columns. Each table scrolls
   inside its own wrapper: the roster is 6 columns wide and must not push the
   editor pane sideways. */
.cf-optout-table, .cf-holiday-table { width: 100%; }
.cf-optout-table th:not(:first-child):not(:last-child),
.cf-holiday-table th:nth-child(n+3) { text-align: center; }
.cf-optout-cell { text-align: center; padding: 4px 14px; }
/* The label, not the box, is the hit target — 26px minimum per the gate, while
   the checkbox itself stays 18px so the grid does not look chunky. */
.cf-optout-hit {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-width: 26px; min-height: 26px;
  margin: 0; cursor: pointer;
}
.cf-optout-cell input { margin: 0; }
.cf-optout-kind, .cf-holiday-date { color: var(--c-muted); white-space: nowrap; }
.cf-optout-chart { color: var(--c-muted-2); font-size: 11.5px; }
.cf-optout-table tbody tr:hover, .cf-holiday-table tbody tr:hover { background: var(--c-surface); }
/* trailing remove column hugs its button */
.cf-holiday-table th:last-child, .cf-holiday-table td:last-child { width: 44px; }
.cf-holiday-custom-tag {
  margin-left: 7px; padding: 1px 6px; border-radius: 5px;
  background: var(--c-mint); color: var(--c-primary-dark);
  font-size: 10px; font-weight: 600; letter-spacing: .04em;
}
.cf-holiday-restore {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px; padding: 9px 12px;
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 12px; color: var(--c-muted);
}
.cf-holiday-restore span { flex: 1; min-width: 180px; }
/* Add-a-holiday row: name stretches, month and day are capped, button hugs.
   align-items:end keeps the control bottoms level under the two-line labels. */
.cf-holiday-add {
  display: flex; align-items: end; gap: 8px; flex-wrap: wrap; margin-top: 14px;
  padding-top: 14px; border-top: 1px solid var(--c-border);
}
.cf-holiday-add > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.cf-holiday-add-name { flex: 1 1 200px; }
.cf-holiday-add-name input { width: 100%; min-width: 0; }
.cf-holiday-add-month { flex: 0 0 150px; }
.cf-holiday-add-month .cf-select, .cf-holiday-add-month select { width: 100%; }
.cf-holiday-add-day { flex: 0 0 76px; }
.cf-holiday-add-day input { width: 100%; min-width: 0; }
.cf-holiday-add-err {
  flex: 1 0 100%; margin: 2px 0 0;
  font-size: 12px; color: var(--c-danger);
}
#compliance-optout-card .cf-hint, #compliance-holidays-card .cf-hint { margin: -4px 0 13px; }

/* ---- activity log ---- */
.cf-activity-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 13px; }
/* 5 columns and long client names — scroll inside the card rather than pushing
   the editor pane sideways. */
.cf-activity-tablewrap { overflow-x: auto; }
.cf-activity-table { width: 100%; min-width: 560px; }
.cf-activity-table th:last-child, .cf-activity-table td:last-child { white-space: nowrap; }
.cf-activity-when { white-space: nowrap; color: var(--c-text); }
.cf-activity-timing { white-space: nowrap; color: var(--c-muted); }
/* provider under client, reason under status — a second line keeps the row
   scannable without a sixth column */
.cf-activity-sub { display: block; font-size: 11px; color: var(--c-muted-2); margin-top: 2px; }
.cf-activity-note {
  display: inline-block; margin-left: 7px; padding: 1px 6px; border-radius: 5px;
  background: var(--c-surface-2); color: var(--c-muted);
  font-size: 10px; font-weight: 600;
}
.cf-activity-badge {
  display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
  border-radius: 6px; font-size: 11px; font-weight: 600; white-space: nowrap;
}
.cf-activity-badge.is-sent { background: var(--c-mint-2); color: var(--c-primary-dark); }
.cf-activity-badge.is-upcoming { background: var(--c-surface-2); color: var(--c-muted); }
.cf-activity-badge.is-suppressed { background: var(--c-danger-bg); color: var(--c-danger); }
.cf-activity-table tbody tr[data-status="suppressed"] .cf-activity-when { color: var(--c-muted); }

/* ---- pager ---- */
.cf-pager {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--c-border);
}
.cf-pager-info { font-size: 12px; color: var(--c-muted); }
.cf-pager-page { margin-left: auto; font-size: 12px; color: var(--c-muted-2); }
.cf-pager .cf-rule-add:disabled { opacity: .45; cursor: default; }
.cf-pager .cf-rule-add:disabled:hover { background: #fff; border-color: var(--c-border); }

/* ---- per-channel compliance read-out (locked) ---- */
.cf-chan-compliance {
  margin-top: 13px; padding: 11px 13px;
  background: var(--c-surface); border: 1px solid var(--c-border);
  border-radius: var(--r-md);
  font-size: 12px; line-height: 1.5; color: var(--c-muted);
}
.cf-chan-compliance-head { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.cf-chan-compliance-label {
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--c-muted-2);
}
.cf-chan-compliance-badge {
  margin-left: auto; display: inline-flex; align-items: center;
  height: 20px; padding: 0 8px; border-radius: var(--r-sm);
  background: var(--c-mint-2); color: var(--c-primary-dark);
  font-size: 11px; font-weight: 600; white-space: nowrap;
}
.cf-chan-compliance-badge.blocked { background: var(--c-danger-bg); color: var(--c-danger); }
.cf-chan-compliance-rows { display: flex; flex-wrap: wrap; gap: 2px 20px; }
.cf-chan-compliance-rows b { font-weight: 600; color: var(--c-text); }
.cf-chan-compliance-note { margin: 7px 0 0; }

/* A channel Credify has not cleared reads as unavailable, not merely off. */
.cf-channel-card[data-permitted="false"] .cf-channel-head h3 { color: var(--c-muted); }
.cf-channel-card[data-permitted="false"] .cf-channel-enable { color: var(--c-surface-3); }

/* Locked Compliance card: greyed, still legible. */
.cf-locked-note { margin: -4px 0 14px; font-size: 12px; color: var(--c-muted-2); }
.cf-channel-card[data-locked="true"] .cf-field label { color: var(--c-muted-2); }
.cf-channel-card[data-locked="true"] input:disabled {
  background: var(--c-surface); color: var(--c-muted); cursor: default; opacity: 1;
}

/* ---- override notice ---- */
.cf-scope-strip {
  justify-content: flex-start; gap: 8px; margin-bottom: 18px; padding: 11px 14px;
  background: var(--c-mint); border: 1px solid var(--c-mint-2);
  border-radius: var(--r-md); color: var(--c-primary-dark); font-size: 12.5px;
}

/* ---- recurrence + tables ---- */
.rec-panel { border-radius: var(--r-md); padding: 16px; }
.rec-freq-btn, .rec-ends-btn { font-family: inherit; }
.rec-freq-btn.active, .rec-ends-btn.active { background: var(--c-primary); }
.cf-compliance-table {
  border: 1px solid var(--c-border); border-radius: var(--r-md);
  overflow: hidden; border-collapse: separate; border-spacing: 0;
}
.cf-compliance-table th {
  font-size: 10px; letter-spacing: .13em; color: var(--c-muted-2); padding: 10px 14px;
}
.cf-compliance-table td { padding: 10px 14px; }

/* ---- header action buttons ---- */
.mod-btn {
  height: 32px; padding: 0 14px; border-radius: var(--r-sm);
  border: 1px solid var(--c-border); background: #fff;
  font-family: inherit; font-size: 12.5px; font-weight: 500;
  color: var(--c-text); cursor: pointer; white-space: nowrap;
}
.mod-btn:hover { background: var(--c-surface); }
.mod-btn-primary {
  background: var(--c-primary); border-color: var(--c-primary);
  color: #fff; font-weight: 600;
}
.mod-btn-primary:hover { background: var(--c-primary-dark); border-color: var(--c-primary-dark); }
.mod-btn:disabled { opacity: .65; cursor: default; }

/* ---- condition card: header + labelled top grid ---- */
.cf-cond-headtxt { min-width: 0; flex: 1; }
.cf-cond-headtitle { font-size: 14px; font-weight: 600; line-height: 1.3; }
.cf-cond-headsub {
  font-size: 12px; color: var(--c-muted-2); line-height: 1.35; margin-top: 2px;
}
.cf-cond-head .cf-cond-remove { margin-left: auto; }
.cf-cond-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px;
}
.cf-cond-grid > .cf-field { margin-bottom: 0; }
@media (max-width: 820px) { .cf-cond-grid { grid-template-columns: 1fr; } }

/* Split tabbed-select: the category bar is a segmented control in its own
   cell, so the value trigger below it gets normal full borders back. */
.cf-tsel-split .cf-tsel-trigger {
  border: 1px solid var(--c-border); border-radius: var(--r-sm);
}
/* Segmented category bar. Keyed off .cf-tsel-tabs-seg, which mountTabbedSelect
   adds whenever a tabsHost is supplied — it used to be scoped to
   `.cf-cond-grid`, so only the Schedule card got the segmented look and every
   other caller fell back to the V9 boxy bar welded to the trigger. One class,
   both places. Specificity note: the base .cf-tsel-tab rules are also 0,1,0, so
   these must stay BELOW them in source order to win.
   Segmented controls hug their labels and sit left in the cell, as in the
   mockup — stretching them to the full cell width made the trough dominate
   and pushed the segment labels apart. */
.cf-tsel-tabs-seg {
  display: inline-flex; width: auto; justify-self: start; align-self: start;
  max-width: 100%;
  border: 0; border-radius: 9px; overflow: hidden;
  background: var(--c-surface-2); padding: 3px; gap: 3px; height: 32px;
}
.cf-tsel-tabs-seg .cf-tsel-tab {
  /* auto basis, not equal thirds: "Appointment" is much longer than "Admin",
     and equal shares truncated it while the short segments kept slack. */
  flex: 1 1 auto; min-width: 0; height: 26px; padding: 0 12px;
  border: 0; border-radius: 7px; background: none;
  font-size: 12.5px; font-weight: 500; color: var(--c-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  transition: background .12s, color .12s;
}
.cf-tsel-tabs-seg .cf-tsel-tab:hover { background: rgba(255,255,255,.6); color: var(--c-text); }
.cf-tsel-tabs-seg .cf-tsel-tab.is-active {
  background: #fff; color: var(--c-text); font-weight: 600;
  border: 0; box-shadow: var(--shadow-sm);
}

/* Applies-to toggle uses the same segmented language as the category bar. */
/* .cf-field is display:grid, so a direct child stretches to the full column
   regardless of width:auto — justify-self is what actually makes it hug.
   (The category bar escaped this only because it sits inside a wrapper div.) */
.cf-cond-grid .cf-cond-toggle-bar {
  display: inline-flex; width: auto; justify-self: start; align-self: start;
  max-width: 100%;
  padding: 3px; gap: 3px; height: 32px; border: 0;
  background: var(--c-surface-2); border-radius: 9px;
}
.cf-cond-grid .cf-cond-mode-btn {
  flex: 1 1 auto; min-width: 0; height: 26px; padding: 0 16px;
  border: 0; border-radius: 7px; background: none;
  font-size: 12.5px; font-weight: 500; color: var(--c-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cf-cond-grid .cf-cond-mode-btn:hover { background: rgba(255,255,255,.6); color: var(--c-text); }
.cf-cond-grid .cf-cond-mode-btn.is-new,
.cf-cond-grid .cf-cond-mode-btn.is-saved.is-active {
  background: #fff; border: 0; color: var(--c-text);
  font-weight: 600; box-shadow: var(--shadow-sm);
}

/* ---- toggle switches ---- */
/* Must be selected as input[type=checkbox].cf-sw: the base reset uses the
   attribute selector (0,1,1), which outranks a bare class (0,1,0) and pinned
   the track to 18px — the same height as the knob, so the knob filled the
   track and read as clipped. */
input[type="checkbox"].cf-sw,
.cf-sw {
  -webkit-appearance: none; appearance: none;
  width: 38px; height: 22px; min-width: 38px; flex: none;
  /* The ONLY control left intentionally round. This is a switch track with a
     circular knob sliding in it — squaring the track while the knob stays round
     reads as a rendering bug, not a design choice. */
  padding: 0; border: 0; border-radius: 999px;
  background: var(--c-surface-3); cursor: pointer; position: relative;
  transition: background .15s ease;
}
.cf-sw::after {
  content: ''; position: absolute; top: 2px; left: 2px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #fff; box-shadow: var(--shadow-sm);
  transition: transform .15s ease;
}
/* Must also carry the attribute qualifier: the off-state rule above is
   input[type="checkbox"].cf-sw (0,2,1), which outranks a plain .cf-sw:checked
   (0,2,0) — so the track stayed grey even when on. */
input[type="checkbox"].cf-sw:checked,
.cf-sw:checked { background: var(--c-primary); }
input[type="checkbox"].cf-sw:checked::after,
.cf-sw:checked::after { transform: translateX(16px); }
.cf-sw:focus-visible { box-shadow: 0 0 0 3px rgba(34,168,126,.25); }
.cf-switch-row {
  display: flex; align-items: center; gap: 11px;
  font-size: 13.5px; font-weight: 500; color: var(--c-text); cursor: pointer;
}
/* the deadline rows sized their input as a 15px checkbox */
.cf-deadline-chk.cf-sw { width: 38px; height: 22px; }

/* ---- in-card field labels (Timing / Booking window / Send via) ---- */
.cf-cond-sublabel {
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--c-muted-2);
  margin-bottom: -6px; /* body gap is 16px; pull the label onto its control */
}
.cf-cond-sublabel-opt {
  text-transform: none; letter-spacing: 0; font-weight: 400;
}

/* =====================================================================
   What-Ifs tab (ported from APPOINTMENT_REMINDERS_..._V34.html, a branch
   off V32). Everything below belongs to renderWhatIfs. The V34 desktop
   simulator-collapse rules (.cf-sim-desktop-collapsed / .cf-sim-collapse-btn)
   are deliberately NOT ported — this build keeps the docked simulator rail
   from the approved Mockup A.
   ===================================================================== */
.cf-wi-seg {
  display: inline-flex; align-items: center; margin-bottom: 13px;
  background: var(--c-surface-2); border-radius: 9px; padding: 3px; gap: 3px;
}
.cf-wi-seg-btn {
  padding: 0 15px; height: 26px; border: 0; border-radius: 7px;
  background: none; color: var(--c-muted);
  font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
  transition: background .12s, color .12s;
}
.cf-wi-seg-btn:hover { background: rgba(255,255,255,.6); color: var(--c-text); }
.cf-wi-seg-btn.is-active {
  background: #fff; color: var(--c-text); font-weight: 600; box-shadow: var(--shadow-sm);
}

/* ═══ V2: What-Ifs rule card ═══════════════════════════════════════════════
   One card, one background, hairline dividers between five sections:
   Header / When / Conditions / Then do / Footer. Replaces V1's three stacked
   bands (IF/THEN row + collapsible CONDITIONS strip + footer).

   STILL no overflow:hidden here. V34 set it so the conditions strip clipped to
   the card's rounded corners, but the section selects are absolutely
   positioned inside this block, so it trapped their popups too.
   .cf-rule-footer carries the bottom radius instead — it remains the only
   child with its own background. If a future edit gives another child a
   background at the bottom edge, the radius moves to that child. */
.cf-rule-block {
  background: #fff; border: 1px solid var(--c-border);
  border-radius: var(--r-lg); margin-bottom: 10px;
  box-shadow: var(--shadow-sm);
}

/* ---- header: drag handle, name, status badge, overflow ---- */
.cf-rule-head {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 16px; border-bottom: 1px solid var(--c-border);
}
.cf-rule-drag {
  flex: none; font-size: 13px; line-height: 1;
  color: var(--c-muted-2); cursor: grab; user-select: none;
}
/* Reads as a title until you touch it, then as the field it is. */
.cf-rule-name {
  flex: 1; min-width: 0; height: 28px; padding: 0 6px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: transparent; box-shadow: none;
  font-family: var(--f-display); font-size: 20px; font-weight: 400;
  line-height: 1.2; color: var(--c-text);
}
.cf-rule-name::placeholder { color: var(--c-muted-2); }
.cf-rule-name:hover { border-color: var(--c-border); }
.cf-rule-name:focus { border-color: var(--c-accent); background: #fff; }
.cf-rule-badge {
  flex: none; display: inline-flex; align-items: center;
  height: 22px; padding: 0 9px;
  border: 1px solid var(--c-border); border-radius: var(--r-sm);
  background: var(--c-surface); color: var(--c-muted);
  font-size: 11.5px; font-weight: 500; white-space: nowrap;
}
.cf-rule-more-wrap { position: relative; flex: none; }
.cf-rule-more {
  width: 30px; height: 30px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: transparent; color: var(--c-muted-2);
  font-size: 15px; line-height: 1; cursor: pointer;
}
.cf-rule-more:hover { background: var(--c-surface); color: var(--c-text); }
.cf-rule-menu {
  position: absolute; z-index: 30; top: calc(100% + 4px); right: 0;
  min-width: 150px; padding: 5px;
  background: #fff; border: 1px solid var(--c-border);
  border-radius: var(--r-md); box-shadow: var(--shadow-md);
}
.cf-rule-menu-item {
  display: block; width: 100%; height: 30px; padding: 0 9px;
  border: 0; border-radius: var(--r-sm); background: transparent;
  font-family: inherit; font-size: 12.5px; font-weight: 500;
  text-align: left; color: var(--c-danger); cursor: pointer;
}
.cf-rule-menu-item:hover { background: var(--c-danger-bg); }

/* ---- sections ---- */
.cf-rule-sec { padding: 16px; border-bottom: 1px solid var(--c-border); }
.cf-rule-sec-cond { background: #fbfdfc; }
.cf-rule-sec-then { border-bottom: 0; }
.cf-sec-label {
  display: block; margin-bottom: 8px;
  font-size: 10px; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--c-muted-2);
}
.cf-sec-labelrow { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.cf-sec-labelrow .cf-sec-label { margin-bottom: 0; }
.cf-cond-count {
  display: inline-flex; align-items: center; height: 17px; padding: 0 6px;
  border-radius: 6px; background: var(--c-mint-2); color: var(--c-primary-dark);
  font-size: 10.5px; font-weight: 600;
}
.cf-rule-sec select, .cf-rule-sec .cf-select-trigger {
  height: var(--ctl-h); border-radius: var(--r-md);
}
.cf-rule-sec-when select, .cf-rule-sec-when .cf-select { width: 100%; }
/* The event select shares the row with the attempts threshold when the trigger
   is "No confirmation after N attempts". Capped rather than full-bleed, to
   match the condition rows' width; 320px holds the longest event label. */
.cf-when-row { display: flex; flex-wrap: wrap; align-items: end; gap: 8px; }
/* 290px floor — enough for "No confirmation after N attempts" in full — so the
   attempts field wraps to its own line rather than truncating the event label.
   min() lets it shrink below that on a pane narrower than the floor itself
   instead of overflowing. 320px ceiling keeps it off full-bleed. */
.cf-when-event { flex: 1 1 290px; min-width: min(290px, 100%); max-width: 320px; }
/* padding-right is 11px on every trigger while the chevron sits at right:12px,
   so a long label runs under it. Harmless where labels are short; not here. */
.cf-rule-sec-when .cf-select-trigger {
  padding-right: 26px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* min-width:0 and an explicit input width are both required: a text input's
   intrinsic size is ~181px (size=20), and a flex item's automatic minimum is
   its content's min-content width, so the basis alone was being overridden. */
.cf-when-attempts {
  flex: 0 0 150px; min-width: 0;
  display: flex; flex-direction: column; gap: 4px;
}
.cf-when-attempts input { width: 100%; min-width: 0; }

/* Add condition / Add action / Add rule — one affordance, three places. */
.cf-rule-add {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 12px;
  border: 1px solid var(--c-border); border-radius: var(--r-sm);
  background: #fff; color: var(--c-primary-dark);
  font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.cf-rule-add:hover { background: var(--c-mint); border-color: var(--c-accent); }

/* ---- condition rows ----
   A grid, not a flex row: V1 let the operator select stretch to ~330px to hold
   "!=" while the value input was pinned to 90px. Scoped under .cf-rule-block
   on purpose — the Schedule tab shares .cf-condition-row and must not move.
   align-items:end rather than the spec's center: the value cell is two lines
   (V1's field-derived label), so centering leaves the control bottoms ragged. */
/* Columns are capped, not fr-based: with 1.5fr/1fr/1fr the row stretched to the
   full card width and the operator select was ~215px to hold ">=". Now each
   control gets roughly what it needs and the row ends where it ends. The
   minmax lower bounds keep it from overflowing a narrow pane. */
.cf-rule-block .cf-condition-row {
  display: grid;
  grid-template-columns: minmax(0, 200px) minmax(62px, 84px) minmax(70px, 116px) 28px;
  gap: 8px; align-items: end; margin-bottom: 8px; justify-content: start;
}
/* The value label ("Voicemail count threshold") was nowrap against a 215px
   column. In a 116px one it has to wrap rather than spill. */
.cf-rule-block .cf-cond-val-label { white-space: normal; line-height: 1.25; }
.cf-rule-block .cf-condition-row select,
.cf-rule-block .cf-condition-row .cf-select,
.cf-rule-block .cf-condition-row input,
.cf-rule-block .cf-condition-row .cf-cond-val { flex: none; width: 100%; min-width: 0; }
.cf-cond-rm {
  width: 28px; height: 28px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: transparent; color: var(--c-muted-2);
  font-size: 13px; line-height: 1; cursor: pointer;
}
.cf-cond-rm:hover {

}

/* ---- then do ---- */
.cf-then-wrap { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
/* The picker is no longer a select in the row: "+ Add action" opens it.
   mountSelect still owns the popup — its trigger is hidden and the button
   clicks it — so the list anchors to this wrapper instead of the trigger. */
.cf-action-add-wrap { position: relative; display: inline-flex; align-self: flex-start; }
.cf-action-add-wrap .cf-select { position: static; }
.cf-action-add-wrap .cf-select-trigger { display: none; }
.cf-action-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cf-action-chip {
  display: inline-flex; align-items: center; gap: 2px;
  height: 30px; padding: 0 3px 0 11px;
  border: 1px solid var(--c-mint-2); border-radius: var(--r-sm);

}

/* V2: these measured 11x13px. The gate asserts no click target below 26px and
   these were the only two controls in the card failing it — V1 had them as
   bare glyphs with height:auto. Behaviour is unchanged; only the hit area is. */
.cf-action-chip-gear, .cf-action-chip-rm {

.cf-action-params-row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

.cf-cond-val { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }

}

/* the field/op selects sit next to a two-line value control */
.cf-condition-row { align-items: flex-end; }
.cf-cond-neq-hint {
  margin: -2px 0 10px; padding: 9px 12px;
  background: var(--c-caution-soft, #fef6e7); border: 1px solid #f2ddb4;

/* ---- V2 rule-card footer + list-level action bar ----
   The footer holds Delete rule alone. "+ New condition" (which added a *rule*)
   and Save moved out to one .cf-rule-listbar below every card: Save writes the
   whole set, so one per block was N buttons doing one thing. The footer keeps
   its own background because it carries the card's bottom radius; -1px for the
   card's border so the corner doesn't gap. */
.cf-rule-footer {
  display: flex; align-items: center; gap: 8px;
  padding: 12px 16px; border-top: 1px solid var(--c-border);
  background: var(--c-surface);
  border-radius: 0 0 calc(var(--r-lg) - 1px) calc(var(--r-lg) - 1px);
}
.cf-rule-del {
  display: inline-flex; align-items: center; gap: 6px;
  height: 30px; padding: 0 8px;
  border: 1px solid transparent; border-radius: var(--r-sm);
  background: transparent; color: var(--c-danger);
  font-family: inherit; font-size: 12.5px; font-weight: 500; cursor: pointer;
}
.cf-rule-del:hover { background: var(--c-danger-bg); }
.cf-rule-listbar { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
/* Both carry margin-left:auto so Save stays right-aligned whether or not the
   hint is showing — the first one in flow absorbs the free space, and when the
   hint is [hidden] it is out of flow entirely and Save takes it instead. */
.cf-rule-dirty { margin-left: auto; font-size: 11.5px; color: var(--c-muted-2); }
.cf-rule-save {
  margin-left: auto;
  height: 34px; padding: 0 18px;
  border: 1px solid var(--c-primary); border-radius: var(--r-md);
  background: var(--c-primary); color: #fff;
  font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
}
.cf-rule-save:hover { background: var(--c-primary-dark); border-color: var(--c-primary-dark); }
.cf-rule-save:disabled { opacity: .7; cursor: default; }

/* The 4-column condition grid stacks rather than overflowing. Children are
   field / operator / value / remove in DOM order — mountSelect swaps each
   select for a .cf-select wrapper in place, so the order holds. */
@media (max-width: 1040px) {
  .cf-rule-block .cf-condition-row {
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 28px;
    grid-template-areas: 'fld fld fld' 'op val rm';
  }
  .cf-rule-block .cf-condition-row > :nth-child(1) { grid-area: fld; }
  .cf-rule-block .cf-condition-row > :nth-child(2) { grid-area: op; }
  .cf-rule-block .cf-condition-row > :nth-child(3) { grid-area: val; }
  .cf-rule-block .cf-condition-row > :nth-child(4) { grid-area: rm; }
}

<!-- hidden scope-chip kept so JS reference doesn't throw -->
<span id="scope-chip" style="display:none"></span>
<!-- hidden pane-scope kept so renderScopeSidebar JS ref doesn't throw -->
