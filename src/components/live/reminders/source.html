// What-Ifs tab: one ordered rule list. Presets drop editable rows in;
// every row can then be rewritten or deleted.



const EVENT_LABELS = {
  [EVENTS.NO_CONFIRMATION]: 'No confirmation after N attempts',
  [EVENTS.CANCELLED]: 'Client cancels',
  [EVENTS.RESCHEDULED]: 'Client reschedules',
  [EVENTS.NO_SHOW]: 'No-show',
  [EVENTS.VOICEMAIL]: 'Voicemail reached',
  [EVENTS.BAD_CONTACT]: 'Bad number or address',
  [EVENTS.OPT_OUT]: 'STOP or opt-out received',
  [EVENTS.CONFIRMED]: 'Client confirms'
};

const ACTION_LABELS = {
  [ACTIONS.NOTIFY_STAFF]: 'Notify staff',
  [ACTIONS.CREATE_TASK]: 'Create worklist task',
  [ACTIONS.RELEASE_SLOT]: 'Release slot',
  [ACTIONS.OFFER_WAITLIST]: 'Offer slot to waitlist',
  [ACTIONS.SEND_RESCHEDULE_LINK]: 'Send reschedule link',
  [ACTIONS.FLAG_CHART]: 'Flag chart',
  [ACTIONS.INCREMENT_NO_SHOW]: 'Increment no-show counter',
  [ACTIONS.SET_FEE_FLAG]: 'Set fee flag',
  [ACTIONS.ESCALATE_CHANNEL]: 'Escalate to next channel',
  [ACTIONS.SUPPRESS_CHANNEL]: 'Suppress channel',
  [ACTIONS.RESEED_LADDER]: 'Reseed ladder',
  [ACTIONS.HALT_LADDER]: 'Halt ladder'
};

const opts = map => Object.entries(map).map(([value, label]) => ({ value, label }));

let uid = 0;
const newId = () => `rc${Date.now().toString(36)}${(uid++).toString(36)}`;

/* What-Ifs state that MUST live outside renderWhatIfs. Every edit fires
   emit() -> onChange -> commit() -> renderAll(), which calls renderWhatIfs
   afresh, so anything held on a DOM node — or in a let/const inside that
   function — is rebuilt from nothing on every keystroke.

   V1's `openCondRuleIds` is gone: the collapsible Conditions strip it tracked
   was replaced by an always-expanded section, so there is no collapse state
   left to preserve.

   `openParamKey` is the same bug one level down. It was declared INSIDE
   renderWhatIfs in V1 (as `openParamRuleId`), which is why an open ⚙ panel
   snapped shut the moment you typed in it. Keyed `<ruleId>|<actionType>` so
   renderChips knows which chip's panel to re-open, not merely that one was. */
let openParamKey = null;
/* Backs the "Unsaved changes" hint: true from the first edit until a save. */
let whatIfsDirty = false;
/* The control to put the caret back in after the next repaint, {id,start,end}.
   Nothing restored focus in V1, so a text field lost focus after a single
   character: the input being typed into no longer existed by the time the
   next keystroke landed. Set at edit time, not render time — see keepFocus. */
let pendingFocus = null;

/* 14px trash outline, stroked in currentColor so it follows --c-danger.
   createElementNS, not innerHTML — SVG children need the SVG namespace. */
function trashIcon(doc) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = doc.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('width', '14'); svg.setAttribute('height', '14');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '2');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.setAttribute('aria-hidden', 'true');
  svg.style.flex = 'none';
  for (const d of ['M3 6h18', 'M8 6V4h8v2', 'M6 6l1 14h10l1-14', 'M10 11v5', 'M14 11v5']) {
    const p = doc.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    svg.appendChild(p);
  }
  return svg;
}

function renderWhatIfs(doc, host, { rules, onChange, win, state, onSaveWhatIfs }) {
  host.innerHTML = '';
  let current = JSON.parse(JSON.stringify(rules || []));

  // Ensure one empty block on first load
  if (!current.length) {
    current = [{ id: newId(), name: '', event: '', conditions: [], actions: [{ type: '', params: {} }], source: 'custom' }];
  }

  const emit = () => { whatIfsDirty = true; onChange(JSON.parse(JSON.stringify(current))); };

  /* Call this on the control being typed into, immediately before emit().
     It cannot be done at the top of this function: renderEditor() wipes
     #policy-form BEFORE it calls renderWhatIfs, so by then the focused input
     is already detached and doc.activeElement is <body> — the capture has to
     happen while the element is still live. */
  const keepFocus = el => {
    const textish = el.tagName === 'INPUT' && /^(text|search|tel|url)$/.test(el.type);
    pendingFocus = {
      id: el.id,
      start: textish ? el.selectionStart : null,
      end: textish ? el.selectionEnd : null
    };
  };
  const repaint = () => renderWhatIfs(doc, host, { rules: current, onChange, win, state, onSaveWhatIfs });

  const getSaved = () => (state && state.savedWhatIfs) || [];
  const persistSaved = list => { if (onSaveWhatIfs) onSaveWhatIfs(list); };

  // ── Segmented toggle: New / Saved ────────────────────────────
  let wiMode = 'new';
  const seg = doc.createElement('div');
  seg.className = 'cf-wi-seg';
  const btnNew = doc.createElement('button');
  btnNew.type = 'button'; btnNew.className = 'cf-wi-seg-btn is-active'; btnNew.textContent = 'New';
  const btnSaved = doc.createElement('button');
  btnSaved.type = 'button'; btnSaved.className = 'cf-wi-seg-btn'; btnSaved.textContent = 'Saved';
  seg.appendChild(btnNew); seg.appendChild(btnSaved);
  host.appendChild(seg);

  // ── Name-a-set modal ─────────────────────────────────────────
  function openNameModal(onConfirm) {
    const overlay = doc.createElement('div');
    overlay.className = 'cf-modal-overlay';
    const box = doc.createElement('div');
    box.className = 'cf-modal';
    const h2 = doc.createElement('h2'); h2.textContent = 'Name this rule set';
    box.appendChild(h2);
    const inp = doc.createElement('input');
    inp.type = 'text'; inp.className = 'cf-modal-input cf-form-control';
    inp.placeholder = 'e.g. Standard no-show flow';
    box.appendChild(inp);
    const footer = doc.createElement('div');
    footer.style.cssText = 'display:flex;justify-content:flex-end;gap:8px';
    const cancel = doc.createElement('button');
    cancel.type = 'button'; cancel.className = 'cf-btn-quiet'; cancel.textContent = 'Cancel';
    const save = doc.createElement('button');
    save.type = 'button'; save.className = 'cf-cond-save-btn'; save.textContent = 'Save';
    footer.appendChild(cancel); footer.appendChild(save);
    box.appendChild(footer); overlay.appendChild(box);
    doc.body.appendChild(overlay);
    inp.focus();
    const close = () => overlay.remove();
    cancel.addEventListener('click', close);
    overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
    save.addEventListener('click', () => {
      const name = inp.value.trim();
      if (!name) { inp.style.borderColor = 'var(--c-danger)'; inp.focus(); return; }
      close();
      onConfirm(name);
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') save.click(); if (e.key === 'Escape') close(); });
  }

  // ── New mode: rule list ───────────────────────────────────────
  const newPanel = doc.createElement('div');
  host.appendChild(newPanel);

  // ── Saved mode: saved rule sets ───────────────────────────────
  const savedPanel = doc.createElement('div');
  savedPanel.style.display = 'none';
  host.appendChild(savedPanel);

  function renderSavedPanel() {
    savedPanel.innerHTML = '';
    const all = getSaved();
    if (!all.length) {
      const e = doc.createElement('p'); e.className = 'cf-hint';
      e.textContent = 'No saved rule sets yet. Configure rules and click Save.';
      savedPanel.appendChild(e); return;
    }
    all.forEach((set, si) => {
      const item = doc.createElement('div');
      item.className = 'cf-wi-saved-item' + (set.inactive ? ' inactive' : '');
      const nm = doc.createElement('span'); nm.className = 'cf-wi-saved-name'; nm.textContent = set.name;
      const meta = doc.createElement('span'); meta.className = 'cf-wi-saved-meta';
      meta.textContent = set.rules.length + ' rule' + (set.rules.length !== 1 ? 's' : '');
      const acts = doc.createElement('div'); acts.className = 'cf-wi-saved-actions';

      // Load
      const load = doc.createElement('button'); load.type = 'button';
      load.className = 'cf-wi-saved-action load'; load.textContent = 'Load';
      load.disabled = !!set.inactive;
      load.addEventListener('click', () => {
        /* Clear dirty AFTER emit — emit() sets it. What's in the builder now
           matches what's in storage, so the "Unsaved changes" hint would lie. */
        const proceed = () => {
          current = JSON.parse(JSON.stringify(set.rules));
          emit(); whatIfsDirty = false; repaint();
        };
        if (current.some(r => r.event || (r.actions && r.actions[0] && r.actions[0].type))) {
          openConfirm(doc, {
            title: 'Replace current rules?',
            body: `Loading "${set.name}" discards the rules you have open. This cannot be undone.`,
            confirmLabel: 'Replace', danger: true, onConfirm: proceed
          });
          return;
        }
        proceed();
      });

      // Edit (pencil) — reload into builder
      const edit = doc.createElement('button'); edit.type = 'button';
      edit.className = 'cf-wi-saved-action edit'; edit.title = 'Edit';
      edit.innerHTML = '✏ Edit';
      edit.addEventListener('click', () => {
        current = JSON.parse(JSON.stringify(set.rules));
        emit(); whatIfsDirty = false;
        wiMode = 'new'; renderPanels(); renderNewPanel();
      });

      // Inactive toggle
      const inact = doc.createElement('button'); inact.type = 'button';
      inact.className = 'cf-wi-saved-action edit';
      inact.textContent = set.inactive ? 'Activate' : 'Inactive';
      inact.addEventListener('click', () => {
        const updated = getSaved().map((s, i) => i === si ? { ...s, inactive: !s.inactive } : s);
        persistSaved(updated);
        renderSavedPanel();
      });

      // Delete
      const del = doc.createElement('button'); del.type = 'button';
      del.className = 'cf-wi-saved-action del'; del.textContent = 'Delete';
      del.addEventListener('click', () => {
        openConfirm(doc, {
          title: 'Delete this rule set?',
          body: `"${set.name}" (${(set.rules || []).length} rule${(set.rules || []).length === 1 ? '' : 's'}) will be removed permanently. Rules already open in the builder are not affected.`,
          confirmLabel: 'Delete', danger: true,
          onConfirm: () => {
            persistSaved(getSaved().filter((_, i) => i !== si));
            renderSavedPanel();
          }
        });
      });

      acts.appendChild(load); acts.appendChild(edit); acts.appendChild(inact); acts.appendChild(del);
      item.appendChild(nm); item.appendChild(meta); item.appendChild(acts);
      savedPanel.appendChild(item);
    });
  }

  function renderPanels() {
    const isNew = wiMode === 'new';
    btnNew.className = 'cf-wi-seg-btn' + (isNew ? ' is-active' : '');
    btnSaved.className = 'cf-wi-seg-btn' + (!isNew ? ' is-active' : '');
    newPanel.style.display = isNew ? '' : 'none';
    savedPanel.style.display = isNew ? 'none' : '';
    if (!isNew) renderSavedPanel();
  }

  btnNew.addEventListener('click', () => { wiMode = 'new'; renderPanels(); });
  btnSaved.addEventListener('click', () => { wiMode = 'saved'; renderPanels(); });

  // ── Render all rule blocks ─────────────────────────────────────
  const COND_FIELDS = [
    { value: 'attempts', label: 'Attempts' },
    { value: 'voicemailCount', label: 'Voicemail count' },
    { value: 'noShowCount', label: 'No-show count' },
    { value: 'channel', label: 'Channel' }
  ];
  const COND_OPS = [
    { value: 'gte', label: '>=' },
    { value: 'lte', label: '<=' },
    { value: 'eq',  label: '=' },
    { value: 'neq', label: '!=' }
  ];

  const eventOptions  = [{ value: '', label: 'Select an event', placeholder: true }].concat(Object.entries(EVENT_LABELS).map(([v, l]) => ({ value: v, label: l })));
  // Conflict map: selecting one auto-deselects the other
  const ACTION_CONFLICTS = {
    [ACTIONS.HALT_LADDER]: [ACTIONS.ESCALATE_CHANNEL],
    [ACTIONS.ESCALATE_CHANNEL]: [ACTIONS.HALT_LADDER]
  };
  // Actions that need param config + their param specs
  const ACTION_PARAMS = {
    [ACTIONS.NOTIFY_STAFF]: [
      { key: 'queue', label: 'Queue', type: 'select', options: ['front_office','care_coordinator','on_call','supervisor'] }
    ],
    [ACTIONS.CREATE_TASK]: [
      { key: 'title', label: 'Task title', type: 'text' }
    ],
    [ACTIONS.OFFER_WAITLIST]: [
      { key: 'window', label: 'Window', type: 'select', options: ['same_day','next_day','week'] }
    ],
    [ACTIONS.SUPPRESS_CHANNEL]: [
      { key: 'channel', label: 'Channel', type: 'select', options: ['sms','email','voice','all'] },
      { key: 'permanent', label: 'Permanent', type: 'checkbox' }
    ]
  };
  // Canonical execution order (halt-like last)
  const ACTION_ORDER = [
    ACTIONS.NOTIFY_STAFF, ACTIONS.CREATE_TASK, ACTIONS.FLAG_CHART,
    ACTIONS.INCREMENT_NO_SHOW, ACTIONS.SET_FEE_FLAG, ACTIONS.RELEASE_SLOT,
    ACTIONS.OFFER_WAITLIST, ACTIONS.SEND_RESCHEDULE_LINK,
    ACTIONS.SUPPRESS_CHANNEL, ACTIONS.RESEED_LADDER,
    ACTIONS.ESCALATE_CHANNEL, ACTIONS.HALT_LADDER
  ];
  function sortActions(acts) {
    return [...acts].sort((a,b) => {
      const ai = ACTION_ORDER.indexOf(a.type), bi = ACTION_ORDER.indexOf(b.type);
      return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
    });
  }

  // Action options for the picker DD (no blank — it's a picker not a form field)
  const actionPickerOpts = Object.entries(ACTION_LABELS).map(([v,l]) => ({ value: v, label: l }));

  function renderActionArea(rule, i, container) {
    container.innerHTML = '';
    const acts = (rule.actions || []).filter(a => a.type);

    // ── chips row ──
    const chipsRow = doc.createElement('div'); chipsRow.className = 'cf-action-chips';
    container.appendChild(chipsRow);

    // ── param panels container ──
    const paramsHost = doc.createElement('div');
    container.appendChild(paramsHost);

    /* ── "+ Add action" ──
       V1 put a bare picker select in the row and hung a "No actions selected"
       placeholder off it. Now a button opens the picker, and the empty state is
       the button standing alone plus the header badge. The select is still here
       and still mountSelect-driven — see the trigger wiring below. */
    const addWrap = doc.createElement('div'); addWrap.className = 'cf-action-add-wrap';
    const addBtn = doc.createElement('button'); addBtn.type = 'button';
    addBtn.className = 'cf-rule-add'; addBtn.textContent = '+ Add action';
    addWrap.appendChild(addBtn);
    const pickerSel = doc.createElement('select');
    pickerSel.id = 'rule-' + rule.id + '-action-picker';
    pickerSel.name = pickerSel.id;
    pickerSel.setAttribute('aria-label', 'Add an action');
    addWrap.appendChild(pickerSel);
    container.appendChild(addWrap);

    function renderChips() {
      chipsRow.innerHTML = ''; paramsHost.innerHTML = '';
      acts.forEach(a => {
        const chip = doc.createElement('div'); chip.className = 'cf-action-chip';
        chip.dataset.actionType = a.type;
        const lbl = doc.createElement('span'); lbl.textContent = ACTION_LABELS[a.type] || a.type;
        chip.appendChild(lbl);
        // gear if has params
        const paramKey = rule.id + '|' + a.type;
        if (ACTION_PARAMS[a.type]) {
          const gear = doc.createElement('button'); gear.type='button';
          gear.className='cf-action-chip-gear'; gear.textContent='⚙';
          gear.setAttribute('aria-label','Configure');
          gear.addEventListener('click', () => {
            const wasOpen = openParamKey === paramKey;
            paramsHost.innerHTML = '';
            openParamKey = wasOpen ? null : paramKey;
            if (!wasOpen) renderParamPanel(a, i);
          });
          chip.appendChild(gear);
          /* Re-open across a repaint. openParamKey names the chip, not just the
             rule, so editing a param no longer closes the panel under the user. */
          if (openParamKey === paramKey) renderParamPanel(a, i);
        }
        const rm = doc.createElement('button'); rm.type='button';
        rm.className='cf-action-chip-rm'; rm.textContent='×';
        rm.setAttribute('aria-label','Remove');
        rm.addEventListener('click', () => {
          current[i].actions = current[i].actions.filter(x => x.type !== a.type);
          if (openParamKey === paramKey) { paramsHost.innerHTML=''; openParamKey=null; }
          emit(); renderActionArea(current[i], i, container);
        });
        chip.appendChild(rm);
        chipsRow.appendChild(chip);
      });
    }

    function renderParamPanel(a, ri) {
      const specs = ACTION_PARAMS[a.type] || [];
      const panel = doc.createElement('div'); panel.className='cf-action-params';
      panel.dataset.paramFor = a.type;
      const ptitle = doc.createElement('div');
      ptitle.style.cssText='font-size:11px;font-weight:700;color:var(--c-muted-2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.8px';
      ptitle.textContent = (ACTION_LABELS[a.type]||a.type) + ' — settings';
      panel.appendChild(ptitle);
      specs.forEach(spec => {
        /* htmlFor was missing on the select and text branches — only the
           checkbox bound its label — so the gate's label/control assertion
           failed on pp-<ruleId>-<key>. Set below, once the id exists. */
        const lbl = doc.createElement('label'); lbl.textContent = spec.label;
        lbl.htmlFor = 'pp-' + rule.id + '-' + spec.key;
        if (spec.type === 'select') {
          const sel = doc.createElement('select'); sel.id='pp-'+rule.id+'-'+spec.key; sel.name=sel.id;
          const cur = (a.params && a.params[spec.key]) || spec.options[0];
          spec.options.forEach(o => { const opt=doc.createElement('option'); opt.value=o; opt.textContent=o.replace(/_/g,' '); if(o===cur) opt.selected=true; sel.appendChild(opt); });
          sel.addEventListener('change', () => { a.params[spec.key]=sel.value; emit(); });
          panel.appendChild(lbl); panel.appendChild(sel);
        } else if (spec.type === 'text') {
          const inp2 = doc.createElement('input'); inp2.type='text'; inp2.id='pp-'+rule.id+'-'+spec.key; inp2.name=inp2.id;
          inp2.value = (a.params && a.params[spec.key]) || '';
          inp2.placeholder = spec.label;
          inp2.addEventListener('input', () => { a.params[spec.key]=inp2.value; keepFocus(inp2); emit(); });
          panel.appendChild(lbl); panel.appendChild(inp2);
        } else if (spec.type === 'checkbox') {
          const row2 = doc.createElement('div'); row2.className='cf-action-params-row';
          const cb = doc.createElement('input'); cb.type='checkbox'; cb.id='pp-'+rule.id+'-'+spec.key; cb.name=cb.id;
          cb.checked = !!(a.params && a.params[spec.key]);
          cb.addEventListener('change', () => { a.params[spec.key]=cb.checked; emit(); });
          const cl = doc.createElement('label'); cl.htmlFor=cb.id; cl.textContent=spec.label; cl.style.fontWeight='500';
          row2.appendChild(cb); row2.appendChild(cl); panel.appendChild(row2);
        }
      });
      paramsHost.appendChild(panel);
    }

    renderChips();

    // mount picker — always shows all options; selecting adds to set
    mountSelect(pickerSel, {
      /* Same treatment: now that the button opens this list, "+ Add action…"
         inside it was a dead item — onChange returns early on the empty value. */
      options: [{ value:'', label:'+ Add action…', placeholder: true }].concat(actionPickerOpts),
      value: '', win,
      onChange: v => {
        if (!v) return;
        // auto-deselect conflicting actions
        const conflicts = ACTION_CONFLICTS[v] || [];
        current[i].actions = (current[i].actions || []).filter(a => !conflicts.includes(a.type));
        // don't double-add
        if (!current[i].actions.find(a => a.type === v)) {
          const defaultParams = {};
          (ACTION_PARAMS[v] || []).forEach(s => { if(s.type==='select') defaultParams[s.key]=s.options[0]; });
          current[i].actions.push({ type: v, params: defaultParams });
          current[i].actions = sortActions(current[i].actions);
        }
        emit();
        renderActionArea(current[i], i, container);
        // reset DD to placeholder
        const ddEl = doc.getElementById('rule-'+rule.id+'-action-picker');
        if (ddEl) { ddEl.value=''; if(ddEl._cfCustomSel) ddEl._cfCustomSel.setValue(''); }
      }
    });

    /* mountSelect renders its own trigger inside a .cf-select wrapper. Hide
       that trigger (CSS) and drive it from "+ Add action" — stopPropagation is
       required because mountSelect closes the list on any document click
       outside its wrapper, and the button is outside it.
       On touch mountSelect returns the native select and no trigger at all, so
       fall back to showing that select and dropping the button. */
    const trig = addWrap.querySelector('.cf-select-trigger');
    if (trig) {
      addBtn.addEventListener('click', ev => { ev.stopPropagation(); trig.click(); });
    } else {
      addBtn.remove();
      pickerSel.style.minWidth = '210px';
    }
  }

  function renderNewPanel() {
    newPanel.innerHTML = '';
    const list = doc.createElement('div');
    newPanel.appendChild(list);

    current.forEach((rule, i) => {
      const block = doc.createElement('div');
      block.className = 'cf-rule-block';
      block.dataset.ruleId = rule.id;

      /* Shared by the footer button and the ⋯ menu — one delete flow, two
         entry points. */
      const deleteRule = () => {
        const drop = () => {
          current = current.filter(r => r.id !== rule.id);
          if (!current.length) current = [{ id: newId(), name: '', event: '', conditions: [], actions: [{ type: '', params: {} }], source: 'custom' }];
          emit(); repaint();
        };
        /* An untouched blank block has nothing to lose — confirming there is
           just friction. Anything with an event, an action or a condition asks. */
        const hasContent = !!rule.event
          || (rule.actions || []).some(a => a && a.type)
          || (rule.conditions || []).length > 0;
        if (!hasContent) { drop(); return; }
        const evName = EVENT_LABELS[rule.event];
        const nAct = (rule.actions || []).filter(a => a && a.type).length;
        const nCond = (rule.conditions || []).length;
        const parts = [];
        if (nAct) parts.push(`${nAct} action${nAct === 1 ? '' : 's'}`);
        if (nCond) parts.push(`${nCond} condition${nCond === 1 ? '' : 's'}`);
        openConfirm(doc, {
          title: 'Delete this What-If?',
          body: (evName ? `The "${evName}" rule` : 'This rule')
            + (parts.length ? ` and its ${parts.join(' and ')}` : '')
            + ' will be removed. This cannot be undone.',
          confirmLabel: 'Delete', danger: true, onConfirm: drop
        });
      };

      // ── Header: drag handle, name, status badge, ⋯ ──
      const head = doc.createElement('div'); head.className = 'cf-rule-head';

      const drag = doc.createElement('span'); drag.className = 'cf-rule-drag';
      drag.textContent = '⠿'; drag.setAttribute('aria-hidden', 'true');
      head.appendChild(drag);

      const nameIn = doc.createElement('input');
      nameIn.type = 'text'; nameIn.className = 'cf-rule-name';
      nameIn.id = 'rule-' + rule.id + '-name'; nameIn.name = nameIn.id;
      nameIn.placeholder = 'Untitled rule';
      nameIn.setAttribute('aria-label', 'Rule name');
      nameIn.value = rule.name || '';
      nameIn.addEventListener('input', () => {
        current[i].name = nameIn.value; keepFocus(nameIn); emit();
      });
      head.appendChild(nameIn);

      /* The card dropped V1's "No actions selected" placeholder, so the
         incomplete state is announced here instead — and it now also catches a
         rule with no trigger, which nothing flagged before. */
      const nActs = (rule.actions || []).filter(a => a && a.type).length;
      const badgeTxt = !rule.event ? 'Needs a trigger' : (nActs ? '' : 'Needs an action');
      if (badgeTxt) {
        const badge = doc.createElement('span');
        badge.className = 'cf-rule-badge';
        badge.textContent = badgeTxt;
        head.appendChild(badge);
      }

      /* The handoff specifies this control but no behaviour for it, so it gets
         the one operation that already exists at card level rather than a new
         one. Delete stays in the footer too — an overflow menu duplicating a
         visible action is normal for a card. */
      const moreWrap = doc.createElement('div'); moreWrap.className = 'cf-rule-more-wrap';
      const more = doc.createElement('button'); more.type = 'button';
      more.className = 'cf-rule-more'; more.textContent = '⋯';
      more.setAttribute('aria-label', 'Rule options');
      more.setAttribute('aria-haspopup', 'menu');
      more.setAttribute('aria-expanded', 'false');
      const menu = doc.createElement('div'); menu.className = 'cf-rule-menu';
      menu.setAttribute('role', 'menu'); menu.hidden = true;
      const mDel = doc.createElement('button'); mDel.type = 'button';
      mDel.className = 'cf-rule-menu-item'; mDel.setAttribute('role', 'menuitem');
      mDel.textContent = 'Delete rule';
      mDel.addEventListener('click', () => { menu.hidden = true; deleteRule(); });
      menu.appendChild(mDel);
      more.addEventListener('click', ev => {
        ev.stopPropagation();
        menu.hidden = !menu.hidden;
        more.setAttribute('aria-expanded', String(!menu.hidden));
      });
      doc.addEventListener('click', ev => { if (!moreWrap.contains(ev.target)) menu.hidden = true; });
      moreWrap.appendChild(more); moreWrap.appendChild(menu);
      head.appendChild(moreWrap);
      block.appendChild(head);

      // ── When ──
      const whenSec = doc.createElement('div');
      whenSec.className = 'cf-rule-sec cf-rule-sec-when';
      const evSel = doc.createElement('select');
      evSel.id = 'rule-' + rule.id + '-event'; evSel.name = evSel.id;
      /* A real <label for>, not V1's bare "IF" keyword span — the gate asserts
         label/control association and the event select had none. */
      const whenLbl = doc.createElement('label');
      whenLbl.className = 'cf-sec-label'; whenLbl.htmlFor = evSel.id;
      whenLbl.textContent = 'When';
      whenSec.appendChild(whenLbl);

      const whenRow = doc.createElement('div'); whenRow.className = 'cf-when-row';
      const evCell = doc.createElement('div'); evCell.className = 'cf-when-event';
      evCell.appendChild(evSel);
      whenRow.appendChild(evCell);

      /* "No confirmation after N attempts" is the only event carrying an N and
         there was nowhere to set it. This input OWNS the rule's first
         `attempts >= N` condition rather than adding a parallel field: evaluate()
         already tests conditions against context.attempts, so the number drives
         the simulator with no model or engine change. The row it owns is hidden
         from the Conditions list below so one number isn't editable in two
         places — recomputed per paint, never cached, because a splice below
         shifts indices. Change the event away and the condition simply reappears
         as an ordinary row; nothing is lost. */
      const ownedCondIdx = () => rule.event === EVENTS.NO_CONFIRMATION
        ? (current[i].conditions || []).findIndex(c => c.field === 'attempts' && c.op === 'gte')
        : -1;

      if (rule.event === EVENTS.NO_CONFIRMATION) {
        const aWrap = doc.createElement('div'); aWrap.className = 'cf-when-attempts';
        const aIn = doc.createElement('input');
        aIn.type = 'text'; aIn.inputMode = 'numeric';   // not type=number: selectionStart throws on it, and keepFocus needs the caret
        aIn.id = 'rule-' + rule.id + '-attempts'; aIn.name = aIn.id;
        aIn.placeholder = 'e.g. 3';
        const owned = ownedCondIdx();
        aIn.value = owned >= 0 ? String(current[i].conditions[owned].value) : '';
        const aLbl = doc.createElement('label');
        aLbl.className = 'cf-cond-val-label'; aLbl.htmlFor = aIn.id;
        aLbl.textContent = 'Attempts threshold';
        aIn.addEventListener('input', () => {
          const raw = aIn.value.trim();
          if (!current[i].conditions) current[i].conditions = [];
          const at = current[i].conditions.findIndex(c => c.field === 'attempts' && c.op === 'gte');
          if (raw === '') {
            if (at >= 0) current[i].conditions.splice(at, 1);   // cleared means no threshold, not "0"
          } else {
            const n = Number(raw);
            const value = isNaN(n) ? raw : n;
            if (at >= 0) current[i].conditions[at].value = value;
            else current[i].conditions.push({ field: 'attempts', op: 'gte', value });
          }
          keepFocus(aIn); emit();
        });
        aWrap.appendChild(aLbl); aWrap.appendChild(aIn);
        whenRow.appendChild(aWrap);
      }

      whenSec.appendChild(whenRow);
      block.appendChild(whenSec);

      // ── Conditions (always expanded; V1's collapsible strip is gone) ──
      const condSec = doc.createElement('div');
      condSec.className = 'cf-rule-sec cf-rule-sec-cond';

      const condLblRow = doc.createElement('div'); condLblRow.className = 'cf-sec-labelrow';
      const lbl = doc.createElement('span'); lbl.className = 'cf-sec-label';
      /* Conditions are always ANDed. If OR is ever supported this has to become
         a control, not a label. */
      lbl.textContent = 'And all of these are true';
      const cnt = doc.createElement('span'); cnt.className = 'cf-cond-count';
      condLblRow.appendChild(lbl); condLblRow.appendChild(cnt);
      condSec.appendChild(condLblRow);

      const body = doc.createElement('div');
      condSec.appendChild(body);

      const updateCount = () => {
        /* Counts VISIBLE rows: the attempts condition owned by the When input
           has no row here, so including it would show "1" over an empty list. */
        const n = (current[i].conditions || []).length - (ownedCondIdx() >= 0 ? 1 : 0);
        cnt.textContent = n ? String(n) : '';
        cnt.hidden = !n;   // a "(0)" badge is noise
      };

      function paintConditions() {
        body.innerHTML = '';
        updateCount();
        const owned = ownedCondIdx();
        (current[i].conditions || []).forEach((cond, ci) => {
          if (ci === owned) return;   // edited via the When section's Attempts threshold
          const cr = doc.createElement('div'); cr.className = 'cf-condition-row';
          const fSel = doc.createElement('select'); fSel.id = 'rule-' + rule.id + '-cond-' + ci + '-field'; fSel.name = fSel.id;
          fSel.setAttribute('aria-label', 'Condition field');
          const oSel = doc.createElement('select'); oSel.id = 'rule-' + rule.id + '-cond-' + ci + '-op'; oSel.name = oSel.id;
          oSel.setAttribute('aria-label', 'Condition operator');
          const vIn = input(doc, { id: 'rule-' + rule.id + '-cond-' + ci + '-val', type: 'text', value: String(cond.value || '') });
          vIn.addEventListener('input', () => {
            const raw = vIn.value;
            current[i].conditions[ci].value = isNaN(Number(raw)) ? raw : Number(raw);
            keepFocus(vIn); emit();
          });
          /* A real 28px button in its own fixed grid column, so rows stay
             aligned as they stack. V1's bare "x" .cf-btn-quiet had no label. */
          const delC = doc.createElement('button'); delC.type = 'button';
          delC.className = 'cf-cond-rm'; delC.textContent = '×';
          delC.setAttribute('aria-label', 'Remove condition');
          delC.addEventListener('click', () => {
            current[i].conditions.splice(ci, 1);
            emit(); paintConditions();
          });
          /* The value box was an unlabelled number floating after two selects.
             Label it from the chosen field: numeric fields read as a threshold,
             Channel is an equality match, so it just reads "Channel". */
          const NUMERIC_FIELDS = ['attempts', 'voicemailCount', 'noShowCount'];
          const vLbl = doc.createElement('label');
          vLbl.className = 'cf-cond-val-label';
          vLbl.htmlFor = vIn.id;
          const paintValLabel = f => {
            const spec = COND_FIELDS.find(x => x.value === f) || COND_FIELDS[0];
            vLbl.textContent = NUMERIC_FIELDS.includes(spec.value)
              ? spec.label + ' threshold'
              : spec.label;
          };
          paintValLabel(cond.field || 'attempts');

          const vWrap = doc.createElement('div');
          vWrap.className = 'cf-cond-val';
          vWrap.appendChild(vLbl);
          vWrap.appendChild(vIn);

          cr.appendChild(fSel); cr.appendChild(oSel); cr.appendChild(vWrap); cr.appendChild(delC);
          body.appendChild(cr);

          /* The dropdown spec flags "!=" as a footgun: "Attempts != 3" fires on
             every attempt EXCEPT the third, which is almost never what someone
             building an escalation rule means. Surface it inline rather than
             leaving it to be discovered in production. */
          const neqHint = doc.createElement('p');
          neqHint.className = 'cf-cond-neq-hint';
          neqHint.id = 'rule-' + rule.id + '-cond-' + ci + '-neq-hint';
          const paintHint = op => {
            const on = op === 'neq';
            neqHint.hidden = !on;
            if (on) {
              const f = (COND_FIELDS.find(x => x.value === (current[i].conditions[ci].field || 'attempts')) || {}).label || 'This field';
              const v = current[i].conditions[ci].value;
              neqHint.textContent = `⚠ "${f} != ${v}" matches every value except ${v} — it will fire repeatedly. Use >= or = if you meant a threshold.`;
            }
          };
          body.appendChild(neqHint);

          mountSelect(fSel, { options: COND_FIELDS, value: cond.field || 'attempts', win, onChange: v => { current[i].conditions[ci].field = v; emit(); paintValLabel(v); paintHint(current[i].conditions[ci].op); } });
          mountSelect(oSel, { options: COND_OPS, value: cond.op || 'gte', win, onChange: v => { current[i].conditions[ci].op = v; emit(); paintHint(v); } });
          vIn.addEventListener('input', () => paintHint(current[i].conditions[ci].op));
          paintHint(cond.op || 'gte');
        });
      }
      paintConditions();

      /* Lives in the section, not in `body` — paintConditions() clears body on
         every repaint and this button must outlive that. */
      const addC = doc.createElement('button'); addC.type = 'button';
      addC.className = 'cf-rule-add'; addC.textContent = '+ Add condition';
      addC.addEventListener('click', () => {
        if (!current[i].conditions) current[i].conditions = [];
        current[i].conditions.push({ field: 'attempts', op: 'gte', value: 1 });
        emit(); paintConditions();
      });
      condSec.appendChild(addC);
      block.appendChild(condSec);

      // ── Then do ──
      const thenSec = doc.createElement('div');
      thenSec.className = 'cf-rule-sec cf-rule-sec-then';
      const thenLbl = doc.createElement('span');
      thenLbl.className = 'cf-sec-label'; thenLbl.textContent = 'Then do';
      thenSec.appendChild(thenLbl);
      const thenWrap = doc.createElement('div'); thenWrap.className = 'cf-then-wrap';
      renderActionArea(rule, i, thenWrap);
      thenSec.appendChild(thenWrap);
      block.appendChild(thenSec);

      /* ── Footer ──
         "Delete rule" alone. V1's "+ New condition" added a *rule*, not a
         condition, and rendered on every block with Save additionally on the
         last; both now live once in .cf-rule-listbar below the list. */
      const footer = doc.createElement('div'); footer.className = 'cf-rule-footer';
      const del = doc.createElement('button'); del.type = 'button';
      del.className = 'cf-rule-del';
      /* An inline SVG, not a glyph: U+1F5D1 has no text presentation, so it
         rendered as a fallback box (and as a colour emoji where it did resolve,
         ignoring --c-danger). currentColor keeps it on the token. */
      del.appendChild(trashIcon(doc));
      const delTxt = doc.createElement('span'); delTxt.textContent = 'Delete rule';
      del.appendChild(delTxt);
      del.addEventListener('click', deleteRule);
      footer.appendChild(del);
      block.appendChild(footer);

      list.appendChild(block);

      // Mount dropdowns
      mountSelect(evSel, { options: eventOptions, value: rule.event || '', win, onChange: v => { current[i].event = v; emit(); } });
    });

    /* ── List-level actions ──
       One "Add rule" and one Save for the whole list. Save writes the entire
       set, so a copy per card would be N buttons doing one thing. */
    const bar = doc.createElement('div'); bar.className = 'cf-rule-listbar';

    const addRule = doc.createElement('button'); addRule.type = 'button';
    addRule.className = 'cf-rule-add'; addRule.id = 'wi-add-rule'; addRule.textContent = '+ Add rule';
    addRule.addEventListener('click', () => {
      current.push({ id: newId(), name: '', event: '', conditions: [], actions: [{ type: '', params: {} }], source: 'custom' });
      emit(); repaint();
    });
    bar.appendChild(addRule);

    const dirty = doc.createElement('span');
    dirty.className = 'cf-rule-dirty'; dirty.textContent = 'Unsaved changes';
    dirty.hidden = !whatIfsDirty;
    bar.appendChild(dirty);

    const saveBtn = doc.createElement('button'); saveBtn.type = 'button';
    saveBtn.className = 'cf-rule-save'; saveBtn.id = 'wi-save'; saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => {
      openNameModal(name => {
        const set = { id: 'wi_' + Date.now().toString(36), name, rules: JSON.parse(JSON.stringify(current)), inactive: false };
        const existing = getSaved();
        const dupeIdx = existing.findIndex(s => s.name === name);
        const commitSave = updated => {
          persistSaved(updated);
          whatIfsDirty = false; dirty.hidden = true;
          saveBtn.textContent = 'Saved ✓'; saveBtn.disabled = true;
          setTimeout(() => { saveBtn.textContent = 'Save'; saveBtn.disabled = false; }, 1500);
        };
        if (dupeIdx >= 0) {
          openConfirm(doc, {
            title: 'Overwrite this rule set?',
            body: (() => {
              const n = (existing[dupeIdx].rules || []).length;
              return `"${name}" already exists. Saving replaces its ${n} stored rule${n === 1 ? '' : 's'}.`;
            })(),
            confirmLabel: 'Overwrite', danger: true,
            onConfirm: () => commitSave(existing.map((s, si) => si === dupeIdx ? set : s))
          });
          return;
        }
        commitSave(existing.concat([set]));
      });
    });
    bar.appendChild(saveBtn);

    newPanel.appendChild(bar);
  }

  renderNewPanel();
  renderPanels();

  if (pendingFocus) {
    const want = pendingFocus;
    pendingFocus = null;
    const el = doc.getElementById(want.id);
    if (el && typeof el.focus === 'function') {
      el.focus();
      if (want.start !== null && el.setSelectionRange) {
        try { el.setSelectionRange(want.start, want.end); } catch (_) { /* not a caret control */ }
      }
    }
  }
}

// Templates tab: per-channel message bodies with merge tokens, a live
// PHI-safe warning, and a preview rendered against a real seed client.

const TOKENS = Object.freeze([
  { token: '{{client_first}}', label: 'Client first name', phi: false },
  { token: '{{client_last}}', label: 'Client last name', phi: false },
  { token: '{{appt_date}}', label: 'Appointment date', phi: false },
  { token: '{{appt_time}}', label: 'Appointment time', phi: false },
  { token: '{{appt_datetime}}', label: 'Appointment date and time', phi: false },
  { token: '{{provider}}', label: 'Provider name', phi: true },
  { token: '{{appt_type}}', label: 'Appointment type', phi: true },
  { token: '{{location}}', label: 'Location', phi: true },
  { token: '{{confirm_link}}', label: 'Confirm link', phi: false },
  { token: '{{reschedule_link}}', label: 'Reschedule link', phi: false }
]);

function renderTemplate(text, ctx) {
  let out = String(text === undefined || text === null ? '' : text);
  for (const t of TOKENS) {
    const key = t.token.slice(2, -2);
    if (!(key in ctx)) continue;
    out = out.split(t.token).join(String(ctx[key]));
  }
  return out;
}

function phiViolations(text, phiSafe) {
  if (!phiSafe) return [];
  const s = String(text === undefined || text === null ? '' : text);
  return TOKENS.filter(t => t.phi && s.includes(t.token)).map(t => t.token);
}

function editor(doc, { id, path, label, value, rows, phiSafe, previewClient, onInput }) {
  const wrap = doc.createElement('section');
  wrap.className = 'cf-template-block';

  const lab = doc.createElement('label');
  lab.setAttribute('for', id);
  lab.textContent = label;
  wrap.appendChild(lab);

  const el = doc.createElement(rows ? 'textarea' : 'input');
  if (rows) el.rows = rows;
  else el.type = 'text';
  el.id = id;
  el.name = id;
  el.dataset.policyPath = path;
  el.value = value === undefined || value === null ? '' : value;
  wrap.appendChild(el);

  const warn = doc.createElement('p');
  warn.className = 'cf-warn';
  warn.id = `${id}-warn`;
  warn.hidden = true;
  wrap.appendChild(warn);

  const previewLabel = doc.createElement('div');
  previewLabel.className = 'cf-preview-label';
  previewLabel.textContent = 'Preview';
  wrap.appendChild(previewLabel);

  const preview = doc.createElement('pre');
  preview.className = 'cf-template-preview';
  preview.id = `${id}-preview`;
  wrap.appendChild(preview);

  const paint = () => {
    const bad = phiViolations(el.value, phiSafe);
    warn.hidden = bad.length === 0;
    warn.textContent = bad.length
      ? `PHI-safe mode is on. Remove ${bad.join(', ')} from this message.`
      : '';
    preview.textContent = renderTemplate(el.value, previewClient);
  };

  el.addEventListener('input', () => { paint(); onInput(el.value); });
  paint();
  return wrap;
}

function getStarterTemplate(triggerType, channel) {
  const t = STARTER_TEMPLATES[triggerType];
  if (!t) return channel === 'email' ? { subject: '', body: '' } : '';
  return channel === 'email' ? (t.email || { subject: '', body: '' }) : (t[channel] || '');
}

function renderTemplates(doc, host, { resolved, sources, previewClient, onChange, onSaveTemplates, win, state }) {
  host.innerHTML = '';
  const phiSafe = !!(resolved.compliance && resolved.compliance.phiSafe);

  /* Token legend removed per Jay: it was a passive read-only row printing raw
     {{snake_case}} at the top of the tab and did nothing when clicked.
     TOKENS itself stays — renderTemplate() substitutes from it and
     phiViolations() flags the three PHI tokens against it, so the merge and the
     PHI warning are untouched. KNOWN CONSEQUENCE: five tokens
     ({{client_last}}, {{appt_time}}, {{provider}}, {{appt_type}},
     {{location}}) appear in no starter template, so this row was the only place
     in the UI they were discoverable. They still work if typed; there is now
     nothing that tells an author they exist. A click-to-insert control on each
     message field is the fix if that becomes a problem. */

  // ---- Language bar ----
  const langBar = doc.createElement('div');
  langBar.className = 'cf-lang-bar';
  host.appendChild(langBar);

  let activeLang = 'en';
  const renderLangBar = () => {
    langBar.innerHTML = '';
    for (const lang of SUPPORTED_LANGS) {
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'cf-lang-btn' + (lang.value === activeLang ? ' is-active' : '');
      btn.textContent = lang.label;
      btn.addEventListener('click', () => { activeLang = lang.value; renderLangBar(); renderBody(); });
      langBar.appendChild(btn);
    }
  };

  // ---- Trigger picker ----
  const trigBar = doc.createElement('div');
  trigBar.className = 'cf-tmpl-trig-bar';
  const trigLab = doc.createElement('label');
  trigLab.textContent = 'Trigger type';
  trigBar.appendChild(trigLab);
  /* Split layout, matching the Schedule card: the category bar renders here as
     a segmented control and the value select sits below it with its own full
     border, instead of the two being welded into one boxy unit. */
  const trigCatHost = doc.createElement('div');
  trigCatHost.className = 'cf-tmpl-trig-cats';
  trigBar.appendChild(trigCatHost);
  const trigSel = doc.createElement('select');
  trigSel.id = 'tmpl-trigger-sel';
  trigSel.name = trigSel.id;
  trigLab.htmlFor = trigSel.id;
  trigBar.appendChild(trigSel);
  // Toggle bar (channel + New/Saved) sits ABOVE the trigger picker so the
  // downward-opening trigger dropdown can never cover it.
  const toggleHost = doc.createElement('div');
  host.appendChild(toggleHost);

  host.appendChild(trigBar);

  // Populate trigger select from the full trigger catalog (all tabs), not just
  // conditions on the Schedule tab. A template can be written for any trigger
  // regardless of whether it's currently scheduled.
  const allTriggers = COND_TRIGGERS;
  let activeTrigger = 'appt_before';

  mountTabbedSelect(trigSel, {
    tabs: COND_TRIGGER_TABS,
    value: activeTrigger,
    win,
    tabsHost: trigCatHost,
    onChange: v => { activeTrigger = v; renderBody(); }
  });

  // ---- Channel + New/Saved state ----
  let activeChannel = 'sms';
  let channelMode = { sms: 'new', email: 'new', voice: 'new' };
  let savedSearch = { sms: '', email: '', voice: '' };

  // Tab-driven New/Saved labels: the toggle names follow whichever trigger tab
  // the active trigger belongs to (Appointment / Clinical / Admin / Other).
  const tabForTrigger = (trig) =>
    COND_TRIGGER_TABS.find(t => t.options.some(o => o.value === trig)) || COND_TRIGGER_TABS[0];
  const MODE_LABELS = {
    appointment: { new: 'New Appointment', saved: 'Saved Appointments' },
    clinical:    { new: 'New Clinical',    saved: 'Saved Clinical' },
    admin:       { new: 'New Admin / Other', saved: 'Saved Admin / Other' }
  };
  const modeLabels = () => {
    const tab = tabForTrigger(activeTrigger);
    return MODE_LABELS[tab.id] || { new: 'New', saved: 'Saved' };
  };

  // conditionTemplates: state.conditionTemplates[triggerType+lang][channel] = { draft, saved[] }
  if (!state.conditionTemplates) state.conditionTemplates = {};

  const storeKey = () => `${activeTrigger}_${activeLang}`;
  const getStore = (ch) => {
    const k = storeKey();
    if (!state.conditionTemplates[k]) state.conditionTemplates[k] = {};
    if (!state.conditionTemplates[k][ch]) {
      const starter = getStarterTemplate(activeTrigger, ch);
      state.conditionTemplates[k][ch] = {
        draft: ch === 'email' ? '' : '',
        saved: []
      };
    }
    return state.conditionTemplates[k][ch];
  };

  // conditionTemplates is state-root data, not a policy field.
  // Use onSaveTemplates to bypass submitPolicy and write directly to state + localStorage.
  const saveStore = () => {
    if (onSaveTemplates) {
      onSaveTemplates(state.conditionTemplates);
    } else {
      onChange({ conditionTemplates: state.conditionTemplates });
    }
  };

  // ---- Body container ----
  const bodyHost = doc.createElement('div');
  host.appendChild(bodyHost);

  const renderBody = () => {
    toggleHost.innerHTML = '';
    bodyHost.innerHTML = '';

    // Channel toggle row
    const chanRow = doc.createElement('div');
    chanRow.className = 'cf-tmpl-chan-row';
    const channels = [
      { value: 'sms', label: 'SMS' },
      { value: 'email', label: 'Email' },
      { value: 'voice', label: 'AI Phone Call' }
    ];
    channels.forEach(ch => {
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'cf-tmpl-chan-btn' + (ch.value === activeChannel ? ' is-active' : '');
      btn.textContent = ch.label;
      btn.addEventListener('click', () => { activeChannel = ch.value; renderBody(); });
      chanRow.appendChild(btn);
    });
    toggleHost.appendChild(chanRow);

    // New / Saved mode toggle — labels follow the active trigger's tab
    const modeRow = doc.createElement('div');
    modeRow.className = 'cf-tmpl-mode-row';
    const lbls = modeLabels();
    const newBtn = doc.createElement('button');
    newBtn.type = 'button';
    newBtn.textContent = lbls.new;
    newBtn.className = 'cf-tmpl-mode-btn' + (channelMode[activeChannel] === 'new' ? ' is-new is-active' : '');
    newBtn.addEventListener('click', () => { channelMode[activeChannel] = 'new'; renderBody(); });
    const savedBtn = doc.createElement('button');
    savedBtn.type = 'button';
    savedBtn.textContent = lbls.saved;
    savedBtn.className = 'cf-tmpl-mode-btn is-saved' + (channelMode[activeChannel] === 'saved' ? ' is-active' : '');
    savedBtn.addEventListener('click', () => { channelMode[activeChannel] = 'saved'; renderBody(); });
    modeRow.appendChild(newBtn);
    modeRow.appendChild(savedBtn);
    toggleHost.appendChild(modeRow);

    const store = getStore(activeChannel);

    if (channelMode[activeChannel] === 'new') {
      // Pre-fill draft with starter if empty
      const starter = getStarterTemplate(activeTrigger, activeChannel);
      if (activeChannel === 'email') {
        if (!store.draft) store.draft = '';
        if (!store.draftSubject) store.draftSubject = '';
        // Show starter as placeholder if no draft yet
        const subjectVal = store.draftSubject || (starter.subject || '');
        const bodyVal = store.draft || (starter.body || '');

        const subBlock = editor(doc, {
          id: `tmpl-${activeTrigger}-${activeLang}-email-subject`,
          path: `conditionTemplates.${storeKey()}.email.draftSubject`,
          label: 'Email subject',
          value: subjectVal, rows: 0, phiSafe, previewClient,
          onInput: v => { store.draftSubject = v; saveStore(); }
        });
        bodyHost.appendChild(subBlock);

        const bodyBlock = editor(doc, {
          id: `tmpl-${activeTrigger}-${activeLang}-email-body`,
          path: `conditionTemplates.${storeKey()}.email.draft`,
          label: 'Email body',
          value: bodyVal, rows: 8, phiSafe, previewClient,
          onInput: v => { store.draft = v; saveStore(); }
        });
        bodyHost.appendChild(bodyBlock);
      } else {
        const val = store.draft || (typeof starter === 'string' ? starter : '');
        const block = editor(doc, {
          id: `tmpl-${activeTrigger}-${activeLang}-${activeChannel}`,
          path: `conditionTemplates.${storeKey()}.${activeChannel}.draft`,
          label: activeChannel === 'sms' ? 'SMS message' : 'AI Phone Call script',
          value: val, rows: activeChannel === 'voice' ? 4 : 3, phiSafe, previewClient,
          onInput: v => { store.draft = v; saveStore(); }
        });
        bodyHost.appendChild(block);
      }

      // Save button
      const saveBtn = doc.createElement('button');
      saveBtn.type = 'button';
      saveBtn.className = 'cf-tmpl-save-btn';
      saveBtn.textContent = 'Save';
      saveBtn.addEventListener('click', () => {
        const trig = allTriggers.find(t => t.value === activeTrigger) || { label: activeTrigger };
        const count = store.saved.length + 1;
        const name = `${trig.label} — ${activeChannel.toUpperCase()} #${count}`;
        const entry = {
          id: 'tpl_' + Date.now().toString(36),
          name,
          active: store.saved.length === 0, // first save auto-activates
          createdAt: new Date().toISOString()
        };
        if (activeChannel === 'email') {
          const starter2 = getStarterTemplate(activeTrigger, 'email');
          entry.subject = store.draftSubject || starter2.subject || '';
          entry.body = store.draft || starter2.body || '';
        } else {
          const starter2 = getStarterTemplate(activeTrigger, activeChannel);
          entry.body = store.draft || (typeof starter2 === 'string' ? starter2 : '');
        }
        store.saved.push(entry);
        saveStore();
        channelMode[activeChannel] = 'saved';
        renderBody();
      });
      bodyHost.appendChild(saveBtn);

    } else {
      // Saved mode — search + list of saved templates (current channel only)
      if (!store.saved.length) {
        const empty = doc.createElement('p');
        empty.className = 'cf-tmpl-empty';
        empty.textContent = 'No saved templates yet. Switch to New to create one.';
        bodyHost.appendChild(empty);
        return;
      }

      // Search box — filters by name + body (+ subject for email)
      const searchWrap = doc.createElement('div');
      searchWrap.className = 'cf-tmpl-search';
      const searchInput = doc.createElement('input');
      searchInput.type = 'text';
      searchInput.id = `tmpl-saved-search-${activeChannel}`;
      searchInput.name = searchInput.id;
      searchInput.className = 'cf-tmpl-search-input';
      searchInput.placeholder = 'Search saved templates…';
      searchInput.value = savedSearch[activeChannel] || '';
      searchWrap.appendChild(searchInput);
      bodyHost.appendChild(searchWrap);

      // Cards container — re-rendered on its own so the search box keeps focus
      const cardsHost = doc.createElement('div');
      bodyHost.appendChild(cardsHost);

      const matchesQuery = (tpl, q) => {
        if (!q) return true;
        const hay = [tpl.name, tpl.body, tpl.subject].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(q);
      };

      const renderCards = () => {
        cardsHost.innerHTML = '';
        const q = (savedSearch[activeChannel] || '').trim().toLowerCase();
        let shown = 0;

        store.saved.forEach((tpl, idx) => {
          if (!matchesQuery(tpl, q)) return;
          shown++;
          const card = doc.createElement('div');
          card.className = 'cf-tmpl-card';

          // Card head: name + active pill
          const head = doc.createElement('div');
          head.className = 'cf-tmpl-card-head';
          const nameEl = doc.createElement('span');
          nameEl.className = 'cf-tmpl-card-name';
          nameEl.textContent = tpl.name;
          head.appendChild(nameEl);
          card.appendChild(head);

          // Preview
          const preview = doc.createElement('div');
          preview.className = 'cf-tmpl-card-body';
          const displayText = activeChannel === 'email'
            ? `Subject: ${tpl.subject || ''}\n\n${tpl.body || ''}`
            : (tpl.body || '');
          preview.textContent = displayText.length > 200 ? displayText.slice(0, 200) + '…' : displayText;
          card.appendChild(preview);

          // Action row
          const actions = doc.createElement('div');
          actions.className = 'cf-tmpl-card-actions';

          // Active toggle
          const activePill = doc.createElement('button');
          activePill.type = 'button';
          activePill.className = 'cf-tmpl-active-pill' + (tpl.active ? ' on' : '');
          activePill.textContent = tpl.active ? 'Active' : 'Inactive';
          activePill.addEventListener('click', () => {
            // Only one active per channel
            store.saved.forEach(t => { t.active = false; });
            tpl.active = !tpl.active;
            saveStore();
            renderCards();
          });
          actions.appendChild(activePill);

          // Edit button
          const editBtn = doc.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'cf-tmpl-action-btn';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', () => {
            // Load into draft and switch to New
            if (activeChannel === 'email') {
              store.draftSubject = tpl.subject || '';
              store.draft = tpl.body || '';
            } else {
              store.draft = tpl.body || '';
            }
            // Remove from saved, edit as new, re-save will add back
            store.saved.splice(idx, 1);
            saveStore();
            channelMode[activeChannel] = 'new';
            renderBody();
          });
          actions.appendChild(editBtn);

          // Delete button
          const delBtn = doc.createElement('button');
          delBtn.type = 'button';
          delBtn.className = 'cf-tmpl-action-btn danger';
          delBtn.textContent = 'Delete';
          delBtn.addEventListener('click', () => {
            /* Was win.confirm — unstyled OS chrome that announced the file
               origin ("This page says") rather than the product, and could not
               mark the action as destructive. Body names the channel and whether
               the template is live, because "Delete X?" alone does not tell you
               what stops happening. */
            const chLabel = CHANNEL_LABELS[activeChannel] || activeChannel;
            openConfirm(doc, {
              title: 'Delete this template?',
              body: `"${tpl.name}" (${chLabel}${tpl.active ? ', currently active' : ''}) `
                + 'will be removed permanently. Messages already sent are not affected.',
              confirmLabel: 'Delete', danger: true,
              onConfirm: () => {
                store.saved.splice(idx, 1);
                saveStore();
                renderCards();
              }
            });
          });
          actions.appendChild(delBtn);

          card.appendChild(actions);
          cardsHost.appendChild(card);
        });

        if (!shown) {
          const none = doc.createElement('p');
          none.className = 'cf-tmpl-empty';
          /* One message used to cover both cases, so deleting your last template
             claimed it did not "match your search" when there was no search. */
          none.textContent = q
            ? 'No saved templates match your search.'
            : 'No saved templates yet. Switch to New to create one.';
          cardsHost.appendChild(none);
        }
      };

      searchInput.addEventListener('input', () => {
        savedSearch[activeChannel] = searchInput.value;
        renderCards();
      });

      renderCards();
    }
  };

  renderLangBar();
  renderBody();
}

/* src/app/pane-simulator.js */
// Right pane: pick an appointment, pick what the client does, run it, and
// read the deterministic log. Nothing here sends anything.



const OUTCOME_LABELS = {
  [OUTCOMES.NONE]: 'Does nothing',
  [OUTCOMES.CONFIRMS]: 'Confirms',
  [OUTCOMES.CANCELS]: 'Cancels',
  [OUTCOMES.RESCHEDULES]: 'Reschedules',
  [OUTCOMES.NO_SHOW]: 'No-shows',
  [OUTCOMES.STOP]: 'Replies STOP',
  [OUTCOMES.BAD_NUMBER]: 'Bad number',
  [OUTCOMES.VOICEMAIL]: 'Reaches voicemail'
};

const KIND_LABELS = {
  send: 'Sent',
  suppressed: 'Blocked',
  inbound: 'Client',
  rule: 'Rule',
  final: 'Result'
};

const REASON_LABELS = {
  no_consent: 'no consent on file',
  // was 'opted_out' — the raw key leaked to the UI; the Activity log shows these.
  opted_out: 'opted out',
  bad_contact: 'no contact value',
  channel_disabled: 'channel disabled',
  suppressed_by_rule: 'suppressed by a rule',
  holiday: 'holiday — sending off for this channel',
  past: 'in the past'
};

function logRows(log, uptoISO) {
  const upto = Date.parse(uptoISO);
  return log.filter(e => Date.parse(e.atISO) <= upto);
}

function fmt(iso, tz) {
  return new Intl.DateTimeFormat('en-US', {
    timeZone: tz, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
  }).format(new Date(iso));
}

function renderSimulator(doc, host, { policy, appointment, rules, tz, win, label, onPickAppointment, appointments, langLabel, esFallbackChannels, onLogUpdate }) {
  host.innerHTML = '';
  const start = Date.parse(appointment.startISO);
  const min = start - 14 * 86400000;
  const max = start + 3 * 86400000;

  /* V33: docked rail — sticky header, scrolling body. */
  const head = doc.createElement('div');
  head.className = 'cf-sim-head';
  head.innerHTML = '<span class="cf-sim-title">Simulator</span>' +
    '<span class="cf-sim-live"><i></i>Live</span>';
  host.appendChild(head);

  const body = doc.createElement('div');
  body.className = 'cf-sim-body';
  host.appendChild(body);
  host = body; // everything below paints into the scrolling body

  const sub = doc.createElement('p');
  sub.className = 'cf-sim-tz';
  sub.textContent = label || '';
  host.appendChild(sub);

  if (appointments && appointments.length) {
    const apptSel = doc.createElement('select');
    apptSel.id = 'sim-appointment';
    apptSel.name = 'sim-appointment';
    host.appendChild(field(doc, 'Appointment', apptSel));
    mountSelect(apptSel, {
      options: appointments.map(a => ({ value: a.id, label: a.label })),
      value: appointment.id, win,
      onChange: v => onPickAppointment(v)
    });
  }

  const outcomeSel = doc.createElement('select');
  outcomeSel.id = 'sim-outcome';
  outcomeSel.name = 'sim-outcome';
  host.appendChild(field(doc, 'Client does', outcomeSel));

  let outcomeType = OUTCOMES.NONE;
  mountSelect(outcomeSel, {
    options: Object.entries(OUTCOME_LABELS).map(([value, l]) => ({ value, label: l })),
    value: outcomeType, win,
    onChange: v => { outcomeType = v; }
  });

  // Gap 1: channel selector for the inbound event
  const channelSel = doc.createElement('select');
  channelSel.id = 'sim-channel';
  channelSel.name = 'sim-channel';
  const channelField = field(doc, 'Via channel', channelSel);
  host.appendChild(channelField);
  let inboundChannel = 'sms';
  mountSelect(channelSel, {
    options: [
      { value: 'sms', label: 'SMS' },
      { value: 'voice', label: 'AI Phone Call' },
      { value: 'email', label: 'Email' }
    ],
    value: inboundChannel, win,
    onChange: v => { inboundChannel = v; }
  });

  const scrubber = doc.createElement('input');
  scrubber.type = 'range';
  scrubber.id = 'sim-scrubber';
  scrubber.name = 'sim-scrubber';
  scrubber.min = String(min);
  scrubber.max = String(max);
  scrubber.step = String(15 * 60000);
  scrubber.value = String(max);
  host.appendChild(field(doc, 'Time', scrubber));

  const stamp = doc.createElement('div');
  stamp.className = 'cf-sim-stamp';
  stamp.id = 'sim-stamp';
  host.appendChild(stamp);

  const runBtn = doc.createElement('button');
  runBtn.type = 'button';
  runBtn.id = 'sim-run';
  runBtn.className = 'cf-btn-primary';
  runBtn.textContent = 'Run scenario';
  host.appendChild(runBtn);

  const logHost = doc.createElement('div');
  logHost.className = 'cf-log';
  logHost.id = 'sim-log';
  host.appendChild(logHost);

  let log = [];

  function detailText(e) {
    if (e.kind === 'suppressed') {
      return `Suppressed: ${REASON_LABELS[e.detail.reason] || e.detail.reason}`;
    }
    if (e.kind === 'send') {
      // V2: annotate with language used and fallback note
      const fallback = (esFallbackChannels || []).includes(e.channel);
      const langNote = langLabel && langLabel !== 'EN'
        ? (fallback ? ` [${e.channel.toUpperCase()} fallback to EN]` : ` [${langLabel}]`)
        : '';
      return e.detail.shiftedFromISO
        ? `Sent (moved out of quiet hours, was ${fmt(e.detail.shiftedFromISO, tz)})${langNote}`
        : `Sent - ${e.detail.stepId}${langNote}`;
    }
    if (e.kind === 'rule') {
      const acts = e.actions.map(a => a.type).join(', ');
      return `${e.detail.event}: ${acts || 'no actions'}`;
    }
    if (e.kind === 'inbound') return `Client: ${e.detail.event}`;
    if (e.kind === 'final') {
      return `${e.detail.state} after ${e.detail.attempts} attempt${e.detail.attempts === 1 ? '' : 's'}`;
    }
    return e.kind;
  }

  function paint() {
    const uptoISO = new Date(Number(scrubber.value)).toISOString();
    stamp.textContent = fmt(uptoISO, tz);
    logHost.innerHTML = '';

    const rows = logRows(log, uptoISO);
    if (!rows.length) {
      const empty = doc.createElement('p');
      empty.className = 'cf-hint';
      empty.id = 'sim-log-empty';
      empty.textContent = log.length
        ? 'Nothing has happened by this point on the timeline.'
        : 'Pick an outcome and run the scenario.';
      logHost.appendChild(empty);
      return;
    }

    for (const e of rows) {
      const row = doc.createElement('div');
      row.className = 'cf-log-row';
      row.dataset.kind = e.kind;

      const when = doc.createElement('span');
      when.className = 'cf-log-when';
      when.textContent = fmt(e.atISO, tz);
      row.appendChild(when);

      const chan = doc.createElement('span');
      chan.className = 'cf-log-chan';
      chan.textContent = e.channel || KIND_LABELS[e.kind] || '';
      row.appendChild(chan);

      const detail = doc.createElement('span');
      detail.className = 'cf-log-detail';
      detail.textContent = detailText(e);
      row.appendChild(detail);

      logHost.appendChild(row);
    }
  }

  function resolveChannel(type, currentLog, fallback) {
    // Gap 6: for reschedule, resolve from last send event in the log
    if (type === OUTCOMES.RESCHEDULES) {
      for (let i = currentLog.length - 1; i >= 0; i--) {
        if (currentLog[i].kind === 'send') return currentLog[i].channel || fallback;
      }
      return fallback;
    }
    return fallback;
  }

  function run() {
    // Run a preliminary pass (NONE outcome) to get send sequence for channel resolution
    const preLog = runScenario({ policy, appointment, rules, tz, outcome: { type: OUTCOMES.NONE, atISO: new Date(Number(scrubber.value)).toISOString(), channel: 'sms', newStartISO: null } });
    const resolvedCh = outcomeType === OUTCOMES.VOICEMAIL ? 'voice'
      : resolveChannel(outcomeType, preLog, inboundChannel);
    log = runScenario({
      policy, appointment, rules, tz,
      outcome: {
        type: outcomeType,
        atISO: new Date(Number(scrubber.value)).toISOString(),
        channel: resolvedCh,
        newStartISO: new Date(start + 7 * 86400000).toISOString()
      }
    });
    paint();
    if (onLogUpdate) onLogUpdate(log);
  }

  runBtn.addEventListener('click', run);
  scrubber.addEventListener('input', paint);
  paint();

  return { run, setScrubber: ms => { scrubber.value = String(ms); paint(); } };
}
