// Compliance tab: opt-out roster with search.
// Sim log and PHI-safe table removed.

const OPTOUT_CHANNELS = [
  { key: 'sms', label: 'SMS' },
  { key: 'email', label: 'Email' },
  { key: 'voice', label: 'AI Phone Call' }
];

/* A checkbox in a table cell, wrapped in a <label> that fills the cell.
   The box itself stays 18px — a 26px checkbox looks wrong in a dense grid — but
   the LABEL is the hit target, which is what the 26px-minimum gate measures and
   what a finger actually lands on. An implicit label (input inside, no text)
   toggles natively and does not override the input's aria-label. */
function checkboxCell(doc, { id, checked, ariaLabel, onChange }) {
  const td = doc.createElement('td');
  td.className = 'cf-optout-cell';
  const lab = doc.createElement('label');
  lab.className = 'cf-optout-hit';
  const cb = doc.createElement('input');
  cb.type = 'checkbox';
  cb.id = id;
  cb.name = id;
  cb.checked = checked;
  cb.setAttribute('aria-label', ariaLabel);
  cb.addEventListener('change', () => onChange(cb.checked));
  lab.appendChild(cb);
  td.appendChild(lab);
  return td;
}

function renderComplianceTab(doc, host, { state, scopeLabel, lastSimLog, win, resolved, onChange, onOptOutChange }) {
  host.innerHTML = '';

  // ── Opt-out roster ───────────────────────────────────────────────────────
  const optCard = doc.createElement('section');
  optCard.className = 'cf-channel-card';
  optCard.id = 'compliance-optout-card';
  const optH = doc.createElement('h3');
  optH.textContent = 'Opt-out roster';
  optCard.appendChild(optH);

  const optHint = doc.createElement('p');
  optHint.className = 'cf-hint';
  optHint.textContent = 'Search a client or provider to opt them out of a channel. '
    + 'Opting a provider out applies to every appointment they run. These are set by hand '
    + 'here for now; the chart will sync them automatically.';
  optCard.appendChild(optHint);

  /* Everyone searchable, both directories. V2 searched only clients, and only
     those who ALREADY had an opt-out — so there was no way to reach a person in
     order to opt them out in the first place. */
  const people = [
    ...state.clients.map(c => ({
      kind: 'client', id: c.id, name: `${c.firstName} ${c.lastName}`,
      terms: `${c.firstName} ${c.lastName} ${c.email || ''} ${c.phone || ''}`.toLowerCase()
    })),
    ...state.providers.map(p => ({
      kind: 'provider', id: p.id, name: p.name, meta: p.role,
      terms: `${p.name} ${p.role || ''}`.toLowerCase()
    }))
  ];

  /* What the chart/appointment records already say, shown read-only beside the
     manual toggles so a hand-set opt-out is never confused with a synced one. */
  const fromChart = person => {
    if (person.kind !== 'client') return '—';
    const appt = state.appointments.find(a => a.clientId === person.id);
    if (!appt) return '—';
    const label = ch => (OPTOUT_CHANNELS.find(c => c.key === ch) || { label: ch }).label;
    const parts = [];
    const opted = Object.entries(appt.optOut || {}).filter(([, v]) => v).map(([ch]) => label(ch));
    const noCons = Object.entries(appt.consent || {}).filter(([, v]) => v === false).map(([ch]) => label(ch));
    if (opted.length) parts.push('opted out: ' + opted.join(', '));
    if (noCons.length) parts.push('no consent: ' + noCons.join(', '));
    return parts.join(' · ') || '—';
  };

  const hasAnyFlag = person =>
    OPTOUT_CHANNELS.some(c => optOutFor(state, person.kind, person.id)[c.key])
    || fromChart(person) !== '—';

  // Search box
  const sw = doc.createElement('div');
  sw.className = 'cf-tmpl-search';
  sw.style.marginBottom = '12px';
  const si = doc.createElement('input');
  si.type = 'text';
  si.id = 'optout-search';
  si.name = 'optout-search';
  si.className = 'cf-tmpl-search-input';
  si.placeholder = 'Search clients and providers…';
  si.setAttribute('aria-label', 'Search clients and providers');
  sw.appendChild(si);
  optCard.appendChild(sw);

  const tblWrap = doc.createElement('div');
  optCard.appendChild(tblWrap);

  /* Writes go through onOptOutChange, which saves and refreshes the simulator
     but deliberately does NOT renderAll: a full render would rebuild this tab
     and wipe the search box the user is working in. Same reasoning as
     onSaveWhatIfs. The roster repaints itself with the query intact instead. */
  const setOptOut = (person, channel, on) => {
    const next = JSON.parse(JSON.stringify(state.optOuts || {}));
    const key = optOutKey(person.kind, person.id);
    next[key] = { ...optOutFor(state, person.kind, person.id), [channel]: on };
    if (!OPTOUT_CHANNELS.some(c => next[key][c.key])) delete next[key];  // don't keep all-false rows
    state.optOuts = next;
    if (onOptOutChange) onOptOutChange(next);
  };

  const renderRoster = q => {
    tblWrap.innerHTML = '';
    /* No query: only people who already carry a flag, so the tab still opens as
       a roster rather than a dump of the whole directory. */
    const rows = q ? people.filter(p => p.terms.includes(q)) : people.filter(hasAnyFlag);

    if (!rows.length) {
      const none = doc.createElement('p');
      none.className = 'cf-hint';
      none.textContent = q
        ? 'No clients or providers match your search.'
        : 'No opt-outs on record. Search above to opt someone out.';
      tblWrap.appendChild(none);
      return;
    }

    const tbl = doc.createElement('table');
    tbl.className = 'cf-compliance-table cf-optout-table';
    tbl.id = 'compliance-optout-table';
    const thead = doc.createElement('thead');
    const hrow = doc.createElement('tr');
    for (const h of ['Name', 'Type', ...OPTOUT_CHANNELS.map(c => c.label), 'From chart']) {
      const th = doc.createElement('th'); th.textContent = h; hrow.appendChild(th);
    }
    thead.appendChild(hrow);
    tbl.appendChild(thead);

    const tbody = doc.createElement('tbody');
    for (const person of rows) {
      const tr = doc.createElement('tr');
      tr.id = `compliance-optout-${person.id}`;

      const nameTd = doc.createElement('td');
      nameTd.textContent = person.name;
      tr.appendChild(nameTd);

      const kindTd = doc.createElement('td');
      kindTd.className = 'cf-optout-kind';
      kindTd.textContent = person.kind === 'client' ? 'Client' : (person.meta || 'Provider');
      tr.appendChild(kindTd);

      const current = optOutFor(state, person.kind, person.id);
      for (const c of OPTOUT_CHANNELS) {
        // No visible label in a table cell — name the column for screen readers.
        tr.appendChild(checkboxCell(doc, {
          id: `optout-${person.kind}-${person.id}-${c.key}`,
          checked: current[c.key],
          ariaLabel: `${person.name} — opt out of ${c.label}`,
          onChange: on => {
            setOptOut(person, c.key, on);
            renderRoster(si.value.trim().toLowerCase());
          }
        }));
      }

      const chartTd = doc.createElement('td');
      chartTd.className = 'cf-optout-chart';
      chartTd.textContent = fromChart(person);
      tr.appendChild(chartTd);

      tbody.appendChild(tr);
    }
    tbl.appendChild(tbody);
    tblWrap.appendChild(tbl);
  };

  si.addEventListener('input', () => renderRoster(si.value.trim().toLowerCase()));
  renderRoster('');
  host.appendChild(optCard);

  // ── Holiday sending ──────────────────────────────────────────────────────
  const holCard = doc.createElement('section');
  holCard.className = 'cf-channel-card';
  holCard.id = 'compliance-holidays-card';
  const holH = doc.createElement('h3');
  holH.textContent = 'Holiday sending';
  holCard.appendChild(holH);

  const year = new Date().getFullYear();
  const holHint = doc.createElement('p');
  holHint.className = 'cf-hint';
  holHint.textContent = `Checked means this channel may send on that day. Texts and AI calls are `
    + `off by default; email stays on so holiday messages still go out on the providers' behalf. `
    + `Dates shown for ${year} and recomputed each year.`;
  holCard.appendChild(holHint);

  const compliance = (resolved && resolved.compliance) || {};

  const observed = resolvedHolidays(compliance, year);
  const removed = hiddenHolidays(compliance, year);
  const fmtMonthDay = (m, d) => new Intl.DateTimeFormat('en-US', {
    // Date.UTC as a civil-calendar formatter only; no instant is implied.
    timeZone: 'UTC', weekday: 'short', month: 'short', day: 'numeric'
  }).format(new Date(Date.UTC(year, m - 1, d)));

  const holTbl = doc.createElement('table');
  holTbl.className = 'cf-compliance-table cf-holiday-table';
  holTbl.id = 'compliance-holiday-table';
  const hThead = doc.createElement('thead');
  const hHrow = doc.createElement('tr');
  for (const h of ['Holiday', 'Date', ...OPTOUT_CHANNELS.map(c => c.label), '']) {
    const th = doc.createElement('th'); th.textContent = h; hHrow.appendChild(th);
  }
  hThead.appendChild(hHrow);
  holTbl.appendChild(hThead);

  const hTbody = doc.createElement('tbody');
  if (!observed.length) {
    const tr = doc.createElement('tr');
    const td = doc.createElement('td');
    td.colSpan = 3 + OPTOUT_CHANNELS.length;
    td.className = 'cf-hint';
    td.textContent = 'No holidays observed. Every channel sends normally all year.';
    tr.appendChild(td); hTbody.appendChild(tr);
  }
  for (const h of observed) {
    const tr = doc.createElement('tr');
    tr.id = `compliance-holiday-${h.id}`;

    const nameTd = doc.createElement('td');
    nameTd.textContent = h.label;
    if (h.custom) {
      const tag = doc.createElement('span');
      tag.className = 'cf-holiday-custom-tag';
      tag.textContent = 'Custom';
      nameTd.appendChild(tag);
    }
    tr.appendChild(nameTd);

    const dateTd = doc.createElement('td');
    dateTd.className = 'cf-holiday-date';
    dateTd.textContent = fmtMonthDay(h.month, h.day);
    tr.appendChild(dateTd);

    const pref = holidaySendPref(compliance, h.id);
    for (const c of OPTOUT_CHANNELS) {
      tr.appendChild(checkboxCell(doc, {
        id: `holiday-${h.id}-${c.key}`,
        checked: pref[c.key],
        ariaLabel: `${h.label} — send ${c.label}`,
        // One leaf path per checkbox: flatten/unflatten handles the nesting, and
        // an untouched channel is never restated at this scope.
        onChange: on => {
          if (onChange) onChange({ [`compliance.holidays.${h.id}.${c.key}`]: on });
        }
      }));
    }

    const rmTd = doc.createElement('td');
    rmTd.className = 'cf-optout-cell';
    const rm = doc.createElement('button');
    rm.type = 'button';
    rm.className = 'cf-cond-rm';
    rm.id = `holiday-${h.id}-remove`;
    rm.textContent = '×';
    rm.setAttribute('aria-label', `Remove ${h.label}`);
    // hidden:true, not a delete — see resolvedHolidays for why, and Restore below.
    rm.addEventListener('click', () => {
      if (onChange) onChange({ [`compliance.holidays.${h.id}.hidden`]: true });
    });
    rmTd.appendChild(rm);
    tr.appendChild(rmTd);

    hTbody.appendChild(tr);
  }
  holTbl.appendChild(hTbody);
  holCard.appendChild(holTbl);

  /* ── Restore ──
     Without this, removing a built-in would be irreversible short of clearing
     storage: US_HOLIDAYS is a constant with no "add Christmas back" path. */
  if (removed.length) {
    const restoreRow = doc.createElement('div');
    restoreRow.className = 'cf-holiday-restore';
    const txt = doc.createElement('span');
    txt.textContent = `${removed.length} removed: ${removed.map(h => h.label).join(', ')}`;
    restoreRow.appendChild(txt);
    const btn = doc.createElement('button');
    btn.type = 'button';
    btn.className = 'cf-rule-add';
    btn.id = 'holiday-restore-all';
    btn.textContent = 'Restore all';
    btn.addEventListener('click', () => {
      const patch = {};
      for (const h of removed) patch[`compliance.holidays.${h.id}.hidden`] = false;
      if (onChange) onChange(patch);
    });
    restoreRow.appendChild(btn);
    holCard.appendChild(restoreRow);
  }

  // ── Add a holiday ────────────────────────────────────────────────────────
  const addRow = doc.createElement('div');
  addRow.className = 'cf-holiday-add';

  const nameWrap = doc.createElement('div');
  nameWrap.className = 'cf-holiday-add-name';
  const nameIn = doc.createElement('input');
  nameIn.type = 'text';
  nameIn.id = 'holiday-new-name'; nameIn.name = nameIn.id;
  nameIn.placeholder = 'e.g. Founders Day';
  const nameLbl = doc.createElement('label');
  nameLbl.className = 'cf-cond-val-label'; nameLbl.htmlFor = nameIn.id;
  nameLbl.textContent = 'Holiday name';
  nameWrap.appendChild(nameLbl); nameWrap.appendChild(nameIn);
  addRow.appendChild(nameWrap);

  const monWrap = doc.createElement('div');
  monWrap.className = 'cf-holiday-add-month';
  const monSel = doc.createElement('select');
  monSel.id = 'holiday-new-month'; monSel.name = monSel.id;
  const monLbl = doc.createElement('label');
  monLbl.className = 'cf-cond-val-label'; monLbl.htmlFor = monSel.id;
  monLbl.textContent = 'Month';
  monWrap.appendChild(monLbl); monWrap.appendChild(monSel);
  addRow.appendChild(monWrap);

  const dayWrap = doc.createElement('div');
  dayWrap.className = 'cf-holiday-add-day';
  const dayIn = doc.createElement('input');
  dayIn.type = 'text'; dayIn.inputMode = 'numeric';
  dayIn.id = 'holiday-new-day'; dayIn.name = dayIn.id;
  dayIn.placeholder = '1';
  const dayLbl = doc.createElement('label');
  dayLbl.className = 'cf-cond-val-label'; dayLbl.htmlFor = dayIn.id;
  dayLbl.textContent = 'Day';
  dayWrap.appendChild(dayLbl); dayWrap.appendChild(dayIn);
  addRow.appendChild(dayWrap);

  const addBtn = doc.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'cf-rule-add';
  addBtn.id = 'holiday-add';
  addBtn.textContent = '+ Add holiday';
  addRow.appendChild(addBtn);

  const addErr = doc.createElement('p');
  addErr.className = 'cf-holiday-add-err';
  addErr.hidden = true;
  addRow.appendChild(addErr);

  holCard.appendChild(addRow);
  host.appendChild(holCard);

  let newMonth = 1;
  mountSelect(monSel, {
    options: MONTH_NAMES.map((m, i) => ({ value: String(i + 1), label: m })),
    value: '1', win,
    onChange: v => { newMonth = parseInt(v, 10) || 1; }
  });

  addBtn.addEventListener('click', () => {
    const label = nameIn.value.trim();
    const day = parseInt(dayIn.value, 10);
    const max = daysInMonth(year, newMonth);
    const fail = msg => { addErr.textContent = msg; addErr.hidden = false; };
    addErr.hidden = true;
    if (!label) return fail('Give the holiday a name.');
    // Validated against the real length of the chosen month, not a flat 31.
    if (!day || day < 1 || day > max) {
      return fail(`${MONTH_NAMES[newMonth - 1]} has ${max} days — pick a day between 1 and ${max}.`);
    }
    if (observed.some(h => h.month === newMonth && h.day === day)) {
      return fail(`${fmtMonthDay(newMonth, day)} is already observed as ${observed.find(h => h.month === newMonth && h.day === day).label}.`);
    }
    const id = 'cust_' + Date.now().toString(36) + (customSeq++).toString(36);
    /* Written as leaf paths in one patch, including the channel defaults —
       spelled out rather than left to fall through to HOLIDAY_SEND_DEFAULT so a
       custom holiday's config is self-describing in storage. */
    if (onChange) onChange({
      [`compliance.holidays.${id}.custom`]: true,
      [`compliance.holidays.${id}.label`]: label,
      [`compliance.holidays.${id}.month`]: newMonth,
      [`compliance.holidays.${id}.day`]: day,
      [`compliance.holidays.${id}.sms`]: HOLIDAY_SEND_DEFAULT.sms,
      [`compliance.holidays.${id}.email`]: HOLIDAY_SEND_DEFAULT.email,
      [`compliance.holidays.${id}.voice`]: HOLIDAY_SEND_DEFAULT.voice
    });
  });
}

/* Disambiguates two custom holidays added inside the same millisecond. */
let customSeq = 0;

/* src/app/tab-activity.js */
/* ── Reminder activity log ─────────────────────────────────────────────────
   There was nowhere to see what had actually gone out: the simulator projects
   ONE appointment and throws the result away. This runs the real scheduler over
   every appointment and flattens the result into one table.

   Derived, not stored. buildSchedule() is the same function the simulator and
   the engine use, so every row here honours that appointment's own resolved
   policy chain, the manual opt-out roster, quiet-hours shifting and the holiday
   rules. Nothing is faked and nothing can drift from the engine.
   INTEGRATION POINT: when real delivery receipts exist, replace buildRows()
   with a fetch of the send log and keep everything below. */

const ACTIVITY_PAGE_SIZE = 15;

const ACTIVITY_FILTERS = [
  { id: 'all', label: 'All' },
  { id: 'sent', label: 'Sent' },
  { id: 'upcoming', label: 'Upcoming' },
  { id: 'suppressed', label: 'Suppressed' }
];

/* Offset of a send relative to its appointment, which is what a human actually
   wants to know — the raw step id ("st1") means nothing here. */
function relativeTiming(atISO, startISO) {
  const mins = Math.round((Date.parse(startISO) - Date.parse(atISO)) / 60000);
  if (mins === 0) return 'at appointment';
  const abs = Math.abs(mins);
  const unit = abs >= 1440 ? Math.round(abs / 1440) + 'd'
    : abs >= 60 ? Math.round(abs / 60) + 'h'
    : abs + 'm';
  return unit + (mins < 0 ? ' after' : ' before');
}

function buildActivityRows(state, nowMs) {
  const rows = [];
  for (const appt of state.appointments) {
    const policy = valuesOf(resolvePolicy(chainForAppointment(state, appt)));
    const client = state.clients.find(c => c.id === appt.clientId);
    const provider = state.providers.find(p => p.id === appt.providerId);
    if (!client) continue;
    const events = buildSchedule({
      policy,
      appointment: withManualOptOuts(state, appt),
      tz: client.timezone
    });
    for (const e of events) {
      const status = e.status === 'suppressed'
        ? 'suppressed'
        : (Date.parse(e.atISO) <= nowMs ? 'sent' : 'upcoming');
      rows.push({
        atISO: e.atISO,
        tz: client.timezone,
        clientName: `${client.firstName} ${client.lastName}`,
        providerName: provider ? provider.name : '—',
        channel: e.channel,
        timing: relativeTiming(e.atISO, appt.startISO),
        shifted: e.status === 'shifted',
        status,
        reason: e.reason || null,
        holiday: e.holiday || null,
        apptId: appt.id
      });
    }
  }
  // Newest first: a log is read from the most recent thing backwards.
  return rows.sort((a, b) => Date.parse(b.atISO) - Date.parse(a.atISO));
}

function renderActivityTab(doc, host, { state, win }) {
  host.innerHTML = '';

  const card = doc.createElement('section');
  card.className = 'cf-channel-card';
  card.id = 'activity-card';
  const h = doc.createElement('h3');
  h.textContent = 'Reminder activity';
  card.appendChild(h);

  const hint = doc.createElement('p');
  hint.className = 'cf-hint';
  hint.textContent = 'Every send the engine has produced across all appointments, newest first. '
    + '"Sent" has already gone out; "Upcoming" is scheduled; "Suppressed" was held back and says why.';
  card.appendChild(hint);

  const nowMs = Date.now();
  const allRows = buildActivityRows(state, nowMs);

  let filter = 'all';
  let page = 0;

  // ---- filter bar ----
  const bar = doc.createElement('div');
  bar.className = 'cf-activity-filters';
  const counts = {
    all: allRows.length,
    sent: allRows.filter(r => r.status === 'sent').length,
    upcoming: allRows.filter(r => r.status === 'upcoming').length,
    suppressed: allRows.filter(r => r.status === 'suppressed').length
  };
  const filterBtns = {};
  for (const f of ACTIVITY_FILTERS) {
    const b = doc.createElement('button');
    b.type = 'button';
    b.className = 'cf-chanchip' + (f.id === filter ? ' is-on' : '');
    b.id = `activity-filter-${f.id}`;
    b.textContent = `${f.label} (${counts[f.id]})`;
    b.addEventListener('click', () => {
      filter = f.id;
      page = 0;   // a filter change invalidates the page number
      for (const [id, btn] of Object.entries(filterBtns)) {
        btn.className = 'cf-chanchip' + (id === filter ? ' is-on' : '');
      }
      paint();
    });
    filterBtns[f.id] = b;
    bar.appendChild(b);
  }
  card.appendChild(bar);

  const tblWrap = doc.createElement('div');
  tblWrap.className = 'cf-activity-tablewrap';
  card.appendChild(tblWrap);

  const pager = doc.createElement('div');
  pager.className = 'cf-pager';
  card.appendChild(pager);

  const CHANNEL_LABEL = { sms: 'SMS', email: 'Email', voice: 'AI Phone Call' };
  const STATUS_LABEL = { sent: 'Sent', upcoming: 'Upcoming', suppressed: 'Suppressed' };

  function paint() {
    const rows = filter === 'all' ? allRows : allRows.filter(r => r.status === filter);
    const pages = Math.max(1, Math.ceil(rows.length / ACTIVITY_PAGE_SIZE));
    // Clamp: a filter can shrink the list under the current page.
    if (page > pages - 1) page = pages - 1;
    const start = page * ACTIVITY_PAGE_SIZE;
    const slice = rows.slice(start, start + ACTIVITY_PAGE_SIZE);

    tblWrap.innerHTML = '';
    if (!rows.length) {
      const none = doc.createElement('p');
      none.className = 'cf-hint';
      none.textContent = 'Nothing here yet.';
      tblWrap.appendChild(none);
    } else {
      const tbl = doc.createElement('table');
      tbl.className = 'cf-compliance-table cf-activity-table';
      tbl.id = 'activity-table';
      const thead = doc.createElement('thead');
      const hrow = doc.createElement('tr');
      for (const t of ['When', 'Client', 'Channel', 'Timing', 'Status']) {
        const th = doc.createElement('th'); th.textContent = t; hrow.appendChild(th);
      }
      thead.appendChild(hrow);
      tbl.appendChild(thead);

      const tbody = doc.createElement('tbody');
      for (const r of slice) {
        const tr = doc.createElement('tr');
        tr.dataset.status = r.status;

        const whenTd = doc.createElement('td');
        whenTd.className = 'cf-activity-when';
        whenTd.textContent = fmt(r.atISO, r.tz);
        if (r.shifted) {
          const s = doc.createElement('span');
          s.className = 'cf-activity-note';
          s.textContent = 'quiet hours';
          whenTd.appendChild(s);
        }
        tr.appendChild(whenTd);

        const who = doc.createElement('td');
        who.textContent = r.clientName;
        const prov = doc.createElement('span');
        prov.className = 'cf-activity-sub';
        prov.textContent = r.providerName;
        who.appendChild(prov);
        tr.appendChild(who);

        const ch = doc.createElement('td');
        ch.textContent = CHANNEL_LABEL[r.channel] || r.channel;
        tr.appendChild(ch);

        const tm = doc.createElement('td');
        tm.className = 'cf-activity-timing';
        tm.textContent = r.timing;
        tr.appendChild(tm);

        const st = doc.createElement('td');
        const badge = doc.createElement('span');
        badge.className = 'cf-activity-badge is-' + r.status;
        badge.textContent = STATUS_LABEL[r.status];
        st.appendChild(badge);
        if (r.status === 'suppressed') {
          const why = doc.createElement('span');
          why.className = 'cf-activity-sub';
          why.textContent = r.holiday
            ? `${r.holiday} — sending off`
            : (REASON_LABELS[r.reason] || r.reason || '');
          st.appendChild(why);
        }
        tr.appendChild(st);

        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      tblWrap.appendChild(tbl);
    }

    // ---- pager ----
    pager.innerHTML = '';
    if (!rows.length) return;
    const info = doc.createElement('span');
    info.className = 'cf-pager-info';
    info.id = 'activity-pager-info';
    const from = start + 1, to = Math.min(start + ACTIVITY_PAGE_SIZE, rows.length);
    info.textContent = `${from}–${to} of ${rows.length}`;
    pager.appendChild(info);

    const mk = (label, id, delta, disabled) => {
      const b = doc.createElement('button');
      b.type = 'button';
      b.className = 'cf-rule-add';
      b.id = id;
      b.textContent = label;
      b.disabled = disabled;
      b.addEventListener('click', () => { page += delta; paint(); });
      return b;
    };
    pager.appendChild(mk('‹ Prev', 'activity-prev', -1, page === 0));
    const pg = doc.createElement('span');
    pg.className = 'cf-pager-page';
    pg.id = 'activity-pager-page';
    pg.textContent = `Page ${page + 1} of ${pages}`;
    pager.appendChild(pg);
    pager.appendChild(mk('Next ›', 'activity-next', 1, page >= pages - 1));
  }

  paint();
  host.appendChild(card);
}

// App container. Holds state, routes tabs, and paints the three panes.

const TABS = [
  { id: 'schedule',   label: 'Schedule',   icon: 'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01' },
  { id: 'templates', label: 'Templates',  icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8 M10 9H8' },
  { id: 'channels',  label: 'Channels',   icon: 'M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.14 9.81a19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 3.05 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.09 8.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z' },
  { id: 'whatifs',   label: 'What-Ifs',   icon: 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z' },
  { id: 'compliance',label: 'Compliance', icon: 'M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11' },
  { id: 'activity',  label: 'Activity',   icon: 'M22 12h-4l-3 9L9 3l-3 9H2' }
];

/* V33: EHR host-rail items. Purely presentational — this module owns none of
   them. When Reminders is mounted inside the real EHR shell, delete the
   <nav class="ehr-rail"> block and this constant along with it. */
const HOST_NAV = [
  { id: 'dashboard', label: 'Dashboard', icon: 'M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z' },
  { id: 'schedule',  label: 'Schedule',  icon: 'M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18' },
  { id: 'contacts',  label: 'Contacts',  icon: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8' },
  { id: 'forms',     label: 'Forms Hub', icon: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M16 13H8 M16 17H8' },
  { id: 'tasks',     label: 'Tasks',     icon: 'M9 11l3 3L22 4 M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11' },
  { id: 'messages',  label: 'Messages',  icon: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' },
  { id: 'reminders', label: 'Reminders', icon: 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9 M13.73 21a2 2 0 0 1-3.46 0', active: true },
  { id: 'billing',   label: 'Billing',   icon: 'M1 4h22v16H1z M1 10h22' },
  { id: 'reports',   label: 'Reports',   icon: 'M18 20V10 M12 20V4 M6 20v-6' }
];

/* Paints the host rail once at boot. Not part of renderAll() — nothing in it
   depends on module state, so re-painting it on every tab switch is waste. */
function renderHostRail(doc) {
  const host = doc.getElementById('ehr-rail-scroll');
  if (!host) return;
  host.innerHTML = '';
  for (const item of HOST_NAV) {
    const b = doc.createElement('button');
    b.type = 'button';
    b.className = 'ehr-rail-item' + (item.active ? ' is-active' : '');
    b.dataset.hostNav = item.id;
    b.innerHTML = navIcon(item.icon, 15) + '<span>' + item.label + '</span>';
    host.appendChild(b);
  }
  const lbl = doc.createElement('div');
  lbl.className = 'ehr-rail-label';
  lbl.textContent = 'Account';
  host.appendChild(lbl);
  const settings = doc.createElement('button');
  settings.type = 'button';
  settings.className = 'ehr-rail-item';
  settings.dataset.hostNav = 'settings';
  settings.innerHTML = navIcon('M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6 M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z', 15) + '<span>Settings</span>';
  host.appendChild(settings);
}

/* Inline SVG helper for nav icons (path-only, single or multi) */
function navIcon(d, size) {
  size = size || 15;
  var paths = d.split(' M ').map(function(p, i) { return '<path d="' + (i ? 'M ' + p : p) + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'; }).join('');
  return '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0">'+paths+'</svg>';
}

function createApp(win, storage) {
  const doc = win.document;
  let state = loadState(storage);
  /* scope.targets (V33.5) is the multi-select list: [{level, ref}, ...].
     level/ref stay the PRIMARY target so every existing reader — chainFor,
     renderEditor, revertScope, the inheritance badges — keeps working unchanged
     and previews the first selection. Only commit() looks at targets. */
  let scope = { level: 'agency', ref: null, targets: null };
  const scopeTargets = () =>
    (scope.targets && scope.targets.length)
      ? scope.targets
      : [{ level: scope.level, ref: scope.ref }];
  let activeTab = 'schedule';
  let simApptId = state.appointments[0].id;
  let pending = Promise.resolve();

  let lastSimLog = null; // Gap 5: persists last run log for Compliance tab

  const chain = () => chainFor(state, scope.level, scope.ref);
  const getSources = () => resolvePolicy(chain());
  const getResolved = () => valuesOf(getSources());

  function scopeLabel() {
    if (scope.level === 'agency') return 'Agency Default';
    const extra = scopeTargets().length - 1;
    if (extra > 0) return `${scopeLabelFor(scope.level, scope.ref)} +${extra} more`;
    return scopeLabelFor(scope.level, scope.ref);
  }

  function scopeLabelFor(level, ref) {
    if (level === 'agency') return 'Agency Default';
    if (level === 'apptType') {
      const t = state.apptTypes.find(x => x.id === ref);
      return t ? t.label : ref;
    }
    if (level === 'provider') {
      const p = state.providers.find(x => x.id === ref);
      return p ? p.name : ref;
    }
    const c = state.clients.find(x => x.id === ref);
    return c ? `${c.firstName} ${c.lastName}` : ref;
  }

  function apptLabel(a) {
    const c = state.clients.find(x => x.id === a.clientId);
    const t = state.apptTypes.find(x => x.id === a.apptTypeId);
    const when = new Intl.DateTimeFormat('en-US', {
      timeZone: c.timezone, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    }).format(new Date(a.startISO));
    return `${c.firstName} ${c.lastName} - ${t.label} - ${when}`;
  }

  function previewContext(appt) {
    const client = state.clients.find(c => c.id === appt.clientId);
    const provider = state.providers.find(p => p.id === appt.providerId);
    const type = state.apptTypes.find(t => t.id === appt.apptTypeId);
    const date = new Intl.DateTimeFormat('en-US', {
      timeZone: client.timezone, month: 'short', day: 'numeric'
    }).format(new Date(appt.startISO));
    const time = new Intl.DateTimeFormat('en-US', {
      timeZone: client.timezone, hour: 'numeric', minute: '2-digit'
    }).format(new Date(appt.startISO));
    return {
      client_first: client.firstName,
      client_last: client.lastName,
      appt_date: date,
      appt_time: time,
      appt_datetime: `${date} at ${time}`,
      provider: provider.name,
      appt_type: type.label,
      location: 'Main clinic',
      confirm_link: 'https://portal.example/confirm',
      reschedule_link: 'https://portal.example/reschedule'
    };
  }

  /* Writes fan out to every selected target, threaded so each submitPolicy sees
     the previous one's result — passing the stale `state` to all of them would
     make the last write win and silently drop the rest. */
  function commit(patch) {
    const targets = scopeTargets();
    pending = pending
      .then(() => targets.reduce(
        (p, t) => p.then(next => submitPolicy(next, t.level, t.ref, patch)),
        Promise.resolve(state)
      ))
      .then(next => {
        state = next;
        saveState(storage, state);
        renderAll();
      });
    return pending;
  }

  // V6: revert a scope back to Agency Default. Deletes the policy row only;
  // per-instance series exceptions belong to the recurrence engine and stay.
  function revertScope(level, ref, label) {
    const ok = win.confirm(`Remove custom reminders for ${label}? They'll follow the Agency Default.`);
    if (!ok) return;
    state = { ...state, policies: state.policies.filter(p => !(p.scopeLevel === level && p.scopeRef === ref)) };
    if (scope.level === level && scope.ref === ref) scope = { level: 'agency', ref: null, targets: null };
    saveState(storage, state);
    renderAll();
  }

  /* V33: module chrome. The five sections render as a horizontal underlined
     tab row in .mod-head; the scope selector replaces the old sidebar's dead
     Clients / Providers / + Customize block. Nothing here touches the host rail. */
  function tabCount(id, resolved) {
    if (id === 'schedule') {
      const conds = (resolved.schedule || {}).conditions;
      return conds && conds.length ? conds.length : DEFAULT_CONDITIONS.length;
    }
    if (id === 'whatifs') return (resolved.rules || []).length;
    if (id === 'templates') {
      const t = state.conditionTemplates;
      if (Array.isArray(t)) return t.length;
      if (t && typeof t === 'object') return Object.keys(t).length;
      return 0;
    }
    return 0;
  }

  function renderChrome() {
    const resolved = getResolved();

    /* --- section tabs --- */
    const tabHost = doc.getElementById('mod-tabs');
    if (tabHost) {
      tabHost.innerHTML = '';
      for (const t of TABS) {
        const b = doc.createElement('button');
        b.type = 'button';
        b.className = 'mod-tab' + (t.id === activeTab ? ' is-active' : '');
        b.id = `tab-${t.id}`;
        b.dataset.tab = t.id;
        b.setAttribute('aria-selected', String(t.id === activeTab));
        const n = tabCount(t.id, resolved);
        b.innerHTML = '<span>' + t.label + '</span>' +
          (n ? '<span class="mod-tab-cnt">' + n + '</span>' : '');
        b.addEventListener('click', () => { activeTab = t.id; renderAll(); });
        tabHost.appendChild(b);
      }
    }

    /* --- scope selector + header actions --- */
    const actHost = doc.getElementById('mod-actions');
    if (!actHost) return;
    actHost.innerHTML = '';

    const scopeBtn = doc.createElement('button');
    scopeBtn.type = 'button';
    scopeBtn.id = 'scope-select';
    scopeBtn.className = 'mod-scope';
    scopeBtn.title = 'Choose which client, provider, or appointment type to edit';
    scopeBtn.innerHTML =
      '<span class="mod-scope-k">Editing</span>' +
      '<span class="mod-scope-v" id="scope-select-label"></span>' +
      '<span class="mod-scope-cv">&#9660;</span>';
    scopeBtn.querySelector('#scope-select-label').textContent = scopeLabel();
    scopeBtn.addEventListener('click', () => openCustomizePicker(doc, {
      state, win,
      onPick: targets => {
        const [first] = targets;
        scope = { level: first.level, ref: first.ref, targets };
        renderAll();
      }
    }));
    actHost.appendChild(scopeBtn);

    /* Only offered off the default scope — there is nothing to go back to at agency level. */
    if (scope.level !== 'agency') {
      const back = doc.createElement('button');
      back.type = 'button';
      back.id = 'scope-reset';
      back.className = 'mod-scope-reset';
      back.textContent = 'Back to Agency Default';
      back.addEventListener('click', () => { scope = { level: 'agency', ref: null, targets: null }; renderAll(); });
      actHost.appendChild(back);
    }

    /* Preview all — jumps to Templates, which is where every rendered message
       for this scope already lives. No second preview surface to maintain. */
    const preview = doc.createElement('button');
    preview.type = 'button';
    preview.id = 'preview-all';
    preview.className = 'mod-btn';
    preview.textContent = 'Preview all';
    preview.addEventListener('click', () => { activeTab = 'templates'; renderAll(); });
    actHost.appendChild(preview);

    /* Save changes — every edit already commits through commit()/saveState() as
       it happens, so this flushes the pending write queue and confirms. It is
       here because users expect it, not because state would otherwise be lost. */
    const save = doc.createElement('button');
    save.type = 'button';
    save.id = 'save-changes';
    save.className = 'mod-btn mod-btn-primary';
    save.textContent = 'Save changes';
    save.addEventListener('click', () => {
      save.disabled = true;
      pending.then(() => {
        saveState(storage, state);
        save.textContent = 'Saved ✓';
        win.setTimeout(() => {
          save.textContent = 'Save changes';
          save.disabled = false;
        }, 1500);
      });
    });
    actHost.appendChild(save);
  }

  function renderEditor() {
    // V6: scope strip above the tabs
    let strip = doc.getElementById('scope-strip');
    if (!strip) {
      strip = doc.createElement('div');
      strip.id = 'scope-strip';
      strip.className = 'cf-scope-strip';
      const pane = doc.getElementById('pane-editor');
      pane.insertBefore(strip, pane.firstChild);
    }
    strip.innerHTML = '';
    if (scope.level === 'agency') {
      strip.style.display = 'none';
    } else {
      /* V33: the scope name and the way back both live in .mod-head now, so the
         strip is a plain override notice \u2014 no duplicated label or back button. */
      strip.style.display = '';
      const levelName = scope.level === 'client' ? 'client' : scope.level === 'provider' ? 'provider' : 'appointment type';
      const txt = doc.createElement('span');
      txt.textContent = `These settings override the Agency Default for this ${levelName}.`;
      strip.appendChild(txt);
    }

    const form = doc.getElementById('policy-form');

    /* Every tab's onChange runs commit() -> renderAll() -> here, and this wipe
       destroys the control the user is typing in — so a text field lost focus
       after ONE character on Channels, Templates and Schedule alike, not just
       What-Ifs. Capture id + caret while the element is still live and restore
       after the tab has rebuilt; ids are stable across repaints. Only restores
       when focus was inside this form, so clicking a tab or the rail is
       unaffected. (What-Ifs additionally has its own pendingFocus, which sets
       the same target — the two are idempotent, not competing.) */
    const active = doc.activeElement;
    const refocus = (active && active.id && form.contains(active))
      ? {
          id: active.id,
          start: /^(text|search|tel|url|password)$/.test(active.type || '') ? active.selectionStart : null,
          end: /^(text|search|tel|url|password)$/.test(active.type || '') ? active.selectionEnd : null
        }
      : null;

    form.innerHTML = '';
    const resolved = getResolved();
    const sources = getSources();

    if (activeTab === 'schedule') {
      renderSchedule(doc, form, {
        resolved, sources, onChange: commit, win, state,
        onSaveConditions: (savedConditions) => {
          state = { ...state, savedConditions };
          saveState(storage, state);
          renderAll();
        },
        onScopeEdit: (sId, scopeChoice, patch) => {
          const next = applyScopeEditToState(state, sId, new Date().toISOString(), scopeChoice, patch);
          state = next;
          saveState(storage, state);
          renderAll();
        }
      });
    } else if (activeTab === 'channels') {
      renderChannels(doc, form, { resolved, sources, onChange: commit, win });

      // V2: language selector at bottom of channels tab
      const langCard = doc.createElement('section');
      langCard.className = 'cf-channel-card';
      const langH = doc.createElement('h3');
      langH.textContent = 'Language';
      langCard.appendChild(langH);
      const langHint = doc.createElement('p');
      langHint.className = 'cf-hint';
      langHint.textContent = 'Set the preferred language for client-facing messages at this scope level. Overridable per client.';
      langCard.appendChild(langHint);
      const langSel = doc.createElement('select');
      langSel.id = 'policy-language';
      langSel.name = 'policy-language';
      langCard.appendChild(langSel);
      form.appendChild(langCard);

      const currentLang = resolved.language || 'en';
      mountSelect(langSel, {
        options: SUPPORTED_LANGS,
        value: currentLang,
        win,
        onChange: v => commit({ language: v })
      });
    } else if (activeTab === 'whatifs') {
      renderWhatIfs(doc, form, {
        rules: resolved.rules || [],
        onChange: rules => commit({ rules }),
        win,
        state,
        // Mutated in place on purpose — the mounted renderWhatIfs closure
        // repaints its own Saved panel. A full renderAll() would rebuild the
        // pane and snap the New/Saved toggle back to New, bouncing the user
        // out of Saved mode mid-action (Inactive, Delete). This is deliberately
        // the OPPOSITE of the Schedule tab's onSaveConditions, which needs
        // renderAll() — do not unify them.
        onSaveWhatIfs: (savedWhatIfs) => {
          state.savedWhatIfs = savedWhatIfs;
          saveState(storage, state);
        }
      });
    } else if (activeTab === 'activity') {
      renderActivityTab(doc, form, { state, win });
    } else if (activeTab === 'compliance') {
      renderComplianceTab(doc, form, {
        state, scopeLabel: scopeLabel(), lastSimLog, win,
        resolved,
        // Holiday prefs are real policy, so they go through commit() like any field.
        onChange: commit,
        /* Opt-outs are directory-ish state, not policy — mutated in place, saved,
           and followed by renderSim() ONLY. A renderAll() here would rebuild the
           Compliance tab and wipe the search box mid-use, so the roster repaints
           itself. Same deliberate exception as onSaveWhatIfs. */
        onOptOutChange: (optOuts) => {
          state.optOuts = optOuts;
          saveState(storage, state);
          renderSim();
        }
      });
    } else {
      const appt = state.appointments.find(a => a.id === simApptId) || state.appointments[0];
      renderTemplates(doc, form, {
        resolved,
        sources,
        previewClient: previewContext(appt),
        onChange: commit,
        onSaveTemplates: (conditionTemplates) => {
          // conditionTemplates lives on state root, not inside any policy row.
          // Bypass submitPolicy/commit so the data actually persists.
          state = { ...state, conditionTemplates };
          saveState(storage, state);
        },
        win,
        state
      });
    }

    if (refocus) {
      const el = doc.getElementById(refocus.id);
      if (el && typeof el.focus === 'function' && !el.disabled) {
        el.focus();
        if (refocus.start !== null && el.setSelectionRange) {
          try { el.setSelectionRange(refocus.start, refocus.end); } catch (_) { /* not a caret control */ }
        }
      }
    }
  }

  function renderSim() {
    const rawAppt = state.appointments.find(a => a.id === simApptId) || state.appointments[0];
    /* Fold the manual opt-out roster in here, at the one place an appointment is
       handed to the engine. suppressionFor() reads appointment.optOut and knows
       nothing about the roster, so this keeps the engine unchanged while making
       a hand-set opt-out actually suppress sends. */
    const appt = withManualOptOuts(state, rawAppt);
    const client = state.clients.find(c => c.id === appt.clientId);
    const resolvedSources = resolvePolicy(chainForAppointment(state, appt));
    const resolved = valuesOf(resolvedSources);
    // V2: determine effective language and whether it falls back
    const effectiveLang = resolveLanguage(resolvedSources);
    const allT = resolved.templates || {};
    const tByLang = (allT.en || allT.es) ? allT : { en: { sms: allT.sms, email: allT.email, voice: allT.voice }, es: {} };
    const langLabel = effectiveLang === 'es' ? 'ES' : 'EN';
    const esTmpl = tByLang.es || {};
    renderSimulator(doc, doc.getElementById('pane-simulator'), {
      policy: resolved,
      appointment: appt,
      rules: resolved.rules || [],
      tz: client.timezone,
      win,
      label: `Times in ${client.timezone}. Messages in ${langLabel}.`,
      langLabel,
      esFallbackChannels: effectiveLang === 'es'
        ? ['sms','email','voice'].filter(ch => !esTmpl[ch] && (tByLang.en || {})[ch])
        : [],
      appointments: state.appointments.map(a => ({ id: a.id, label: apptLabel(a) })),
      onPickAppointment: id => { simApptId = id; renderAll(); },
      onLogUpdate: log => {
        // Gap 5: persist last run log so Compliance tab can display it
        lastSimLog = log;
        if (activeTab === 'compliance') renderEditor();
      }
    });
  }

  function renderAll() {
    /* V33: pane-scope stays hidden; module nav + scope selector live in
       .mod-head via renderChrome(). renderScopeSidebar remains available for
       the customize picker's internal use. */
    renderChrome();
    renderEditor();
    renderSim();
  }

  /* V33: the old version read the media query once at boot, so a window that
     started wide and later narrowed kept the toggle hidden while the simulator
     sheet — now position:fixed at the bottom — covered the editor with no way
     to dismiss it. Bind the listener once and re-evaluate on every change. */
  function wireMobileSheet() {
    const toggle = doc.getElementById('sim-toggle');
    if (!toggle) return;
    const mq = win.matchMedia && win.matchMedia('(max-width: 900px)');

    toggle.addEventListener('click', () => {
      doc.body.classList.toggle('cf-sim-collapsed');
    });

    const apply = () => {
      const mobile = isTouch(win) || (mq && mq.matches);
      toggle.hidden = !mobile;
      doc.body.classList.toggle('cf-sim-collapsed', !!mobile);
    };

    if (mq) {
      if (mq.addEventListener) mq.addEventListener('change', apply);
      else if (mq.addListener) mq.addListener(apply); // older WebKit
    }
    apply();
  }

  return {
    get state() { return state; },
    get scope() { return scope; },
    setTab(t) { activeTab = t; renderAll(); },
    flush() { return pending; },
    getResolved,
    getSources,
    refresh: renderAll,
    wireMobileSheet
  };
}

if (typeof window !== 'undefined' && window.document && window.document.getElementById('pane-scope')) {
  const app = createApp(window, window.localStorage);
  window.__cfApp = app;
  renderHostRail(window.document); // host chrome: painted once, never re-rendered
  mountTip(window.document, window);
  api('GET', '/directory'); // V6 audit trail for the future directory fetch
  app.refresh();
  app.wireMobileSheet();
}

</script>
