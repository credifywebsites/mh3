<button type="button" class="cf-sim-toggle" id="sim-toggle" hidden>Simulator</button>

<script>
/* src/modules/policy.js */
// Four-level policy resolution. Nothing here persists a resolved value:
// every field comes back paired with the level that supplied it, so the
// inheritance badges and the send logic read from one source of truth.

const LEVELS = ['agency', 'apptType', 'provider', 'client'];
const META = ['id', 'scopeLevel', 'scopeRef'];

function flatten(obj, prefix = '') {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) {
    if (!prefix && META.includes(k)) continue;
    const path = prefix ? `${prefix}.${k}` : k;
    if (v && typeof v === 'object' && !Array.isArray(v)) Object.assign(out, flatten(v, path));
    else out[path] = v;
  }
  return out;
}

function unflatten(map) {
  const out = {};
  for (const [path, value] of Object.entries(map)) {
    const keys = path.split('.');
    let node = out;
    for (let i = 0; i < keys.length - 1; i++) {
      if (!node[keys[i]] || typeof node[keys[i]] !== 'object') node[keys[i]] = {};
      node = node[keys[i]];
    }
    node[keys[keys.length - 1]] = value;
  }
  return out;
}

// chain is ascending precedence: [agency, apptType, provider, client]
function resolvePolicy(chain) {
  const resolved = {};
  for (const policy of chain) {
    if (!policy) continue;
    for (const [path, value] of Object.entries(flatten(policy))) {
      if (value === undefined) continue;
      resolved[path] = { value, sourceLevel: policy.scopeLevel };
    }
  }
  return resolved;
}

function valuesOf(resolved) {
  const map = {};
  for (const [path, entry] of Object.entries(resolved)) map[path] = entry.value;
  return unflatten(map);
}

function withMeta(policy, rebuilt) {
  const meta = {};
  for (const k of META) if (k in policy) meta[k] = policy[k];
  return { ...meta, ...rebuilt };
}

function setOverride(policy, path, value) {
  const flat = flatten(policy);
  flat[path] = value;
  return withMeta(policy, unflatten(flat));
}

function clearOverride(policy, path) {
  const flat = flatten(policy);
  delete flat[path];
  return withMeta(policy, unflatten(flat));
}

function overrideCount(policy) {
  return Object.keys(flatten(policy)).length;
}

// V2: supported languages
const SUPPORTED_LANGS = [
  { value: 'en', label: 'English' },
  { value: 'es', label: 'Spanish' }
];
if (typeof window !== 'undefined') window.SUPPORTED_LANGS = SUPPORTED_LANGS;

// Resolve the effective language for a policy chain.
// Returns 'en' or 'es'. Defaults to 'en'.
function resolveLanguage(resolved) {
  const v = resolved['language'] && resolved['language'].value;
  return v === 'es' ? 'es' : 'en';
}

/* src/modules/recurrence.js */
// Recurrence expansion and scoped series edits.
// Pure: no DOM, no storage, no ambient clock. All zone math is explicit.

const WD = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
const MAX_ITER = 2000;

function partsIn(iso, tz) {
  const fmt = new Intl.DateTimeFormat('en-US', {
    timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false, weekday: 'short'
  });
  const p = {};
  for (const part of fmt.formatToParts(new Date(iso))) p[part.type] = part.value;
  return {
    year: Number(p.year), month: Number(p.month), day: Number(p.day),
    hour: p.hour === '24' ? 0 : Number(p.hour),
    minute: Number(p.minute), second: Number(p.second),
    weekday: WD[p.weekday]
  };
}

function instantFrom(parts, tz) {
  const target = Date.UTC(parts.year, parts.month - 1, parts.day,
    parts.hour, parts.minute, parts.second || 0);
  let guess = target;
  for (let i = 0; i < 3; i++) {
    const got = partsIn(new Date(guess).toISOString(), tz);
    const gotUTC = Date.UTC(got.year, got.month - 1, got.day, got.hour, got.minute, got.second);
    const delta = target - gotUTC;
    if (delta === 0) break;
    guess += delta;
  }
  return new Date(guess).toISOString();
}

function shiftLocal(iso, tz, { days = 0, months = 0 }) {
  const p = partsIn(iso, tz);
  const moved = new Date(Date.UTC(p.year, p.month - 1 + months, p.day + days));
  return instantFrom({
    year: moved.getUTCFullYear(), month: moved.getUTCMonth() + 1, day: moved.getUTCDate(),
    hour: p.hour, minute: p.minute, second: p.second
  }, tz);
}

function endBoundary(end, startISO, tz) {
  if (!end || end.type !== 'onDate') return Infinity;
  const [year, month, day] = end.value.split('-').map(Number);
  return Date.parse(instantFrom({ year, month, day, hour: 23, minute: 59, second: 59 }, tz));
}

function expandSeries(recurrence, startISO, windowStartISO, windowEndISO, tz) {
  const out = [];
  const winStart = Date.parse(windowStartISO);
  const winEnd = Date.parse(windowEndISO);
  const startMs = Date.parse(startISO);
  const interval = Math.max(1, recurrence.interval || 1);
  const end = recurrence.end || { type: 'never' };
  const limit = endBoundary(end, startISO, tz);
  let count = 0;

  const take = iso => {
    const t = Date.parse(iso);
    if (t < startMs) return 'skip';
    if (t > limit) return 'stop';
    if (end.type === 'afterCount' && count >= end.value) return 'stop';
    count++;
    if (t >= winStart && t < winEnd) out.push(iso);
    if (t >= winEnd && end.type !== 'afterCount') return 'stop';
    return 'ok';
  };

  if (recurrence.freq === 'weekly' && (recurrence.byWeekday || []).length) {
    const days = [...recurrence.byWeekday].sort((a, b) => a - b);
    let weekStart = shiftLocal(startISO, tz, { days: -partsIn(startISO, tz).weekday });
    for (let w = 0; w < MAX_ITER; w++) {
      for (const d of days) {
        if (take(shiftLocal(weekStart, tz, { days: d })) === 'stop') return out;
      }
      weekStart = shiftLocal(weekStart, tz, { days: 7 * interval });
      if (Date.parse(weekStart) > winEnd && end.type !== 'afterCount') return out;
    }
    return out;
  }

  let cursor = startISO;
  for (let i = 0; i < MAX_ITER; i++) {
    if (take(cursor) === 'stop') break;
    cursor = recurrence.freq === 'monthly'
      ? shiftLocal(cursor, tz, { months: interval })
      : shiftLocal(cursor, tz, { days: interval });
  }
  return out;
}

function splitSeries(series, atInstanceISO, tz = 'America/Los_Angeles') {
  const p = partsIn(shiftLocal(atInstanceISO, tz, { days: -1 }), tz);
  const pad = n => String(n).padStart(2, '0');
  return {
    before: {
      ...series,
      recurrence: {
        ...series.recurrence,
        end: { type: 'onDate', value: `${p.year}-${pad(p.month)}-${pad(p.day)}` }
      }
    },
    after: {
      ...series,
      id: `${series.id}-b${Date.parse(atInstanceISO)}`,
      startISO: atInstanceISO,
      recurrence: { ...series.recurrence }
    }
  };
}

function applyScopeEdit(series, exceptions, instanceISO, scope, patch, tz = 'America/Los_Angeles') {
  const key = `${series.id}|${instanceISO}`;
  if (scope === 'this') {
    return { series, exceptions: { ...exceptions, [key]: { ...(exceptions[key] || {}), ...patch } } };
  }
  if (scope === 'following') {
    const { before, after } = splitSeries(series, instanceISO, tz);
    after.policyPatch = { ...(series.policyPatch || {}), ...patch };
    return { series: before, followingSeries: after, exceptions };
  }
  return { series: { ...series, policyPatch: { ...(series.policyPatch || {}), ...patch } }, exceptions };
}

// Apply a scoped recurrence edit to full app state (series array + exceptions map).
// Returns a new state object. Used by main.js when the scope modal resolves.
function applyScopeEditToState(state, seriesId, instanceISO, scope, patch) {
  const exceptions = state.seriesExceptions || {};
  const idx = state.series.findIndex(s => s.id === seriesId);
  if (idx === -1) return state;
  const series = state.series[idx];
  const tz = 'America/Los_Angeles';
  const result = applyScopeEdit(series, exceptions, instanceISO, scope, patch, tz);
  const nextSeries = [...state.series];
  nextSeries[idx] = result.series;
  if (result.followingSeries) nextSeries.push(result.followingSeries);
  return { ...state, series: nextSeries, seriesExceptions: result.exceptions };
}

// Human-readable description of what an exception changes.
function describeException(exc) {
  const parts = [];
  if (exc['schedule.seriesRecurrence']) parts.push('recurrence changed');
  if (exc['schedule.steps']) parts.push('ladder steps changed');
  if (exc['channels.sms.enabled'] !== undefined || exc['channels.voice.enabled'] !== undefined) parts.push('channels changed');
  return parts.length ? parts.join(', ') : 'policy override';
}
if (typeof window !== 'undefined') {
  window.applyScopeEditToState = applyScopeEditToState;
  window.describeException = describeException;
}

/* src/modules/ladder.js */
// Turns a resolved policy plus an appointment into an ordered send schedule.
// The wait between channels comes from the step chain hop, never from the
// channel config -- channel-level waitAfterMin is only the default used when
// a new hop is created in the editor.


const SUPPRESS_REASONS = {
  NO_CONSENT: 'no_consent',
  OPTED_OUT: 'opted_out',
  BAD_CONTACT: 'bad_contact',
  CHANNEL_DISABLED: 'channel_disabled',
  HOLIDAY: 'holiday',
  PAST: 'past'
};

/* ── US holiday calendar ───────────────────────────────────────────────────
   Computed per year, never hardcoded: half of these float. A holiday is a
   CALENDAR DATE, not an instant, so it is always compared against the send's
   date in the client's own timezone — comparing against UTC would move
   Christmas for every client west of London.

   All arithmetic below uses Date.UTC purely as a civil-calendar calculator
   (day-of-week, days-in-month). No instant is derived from it, so there is no
   timezone bug hiding in that choice. Month is 1-12 throughout; weekday is
   0=Sunday. */
const nthWeekdayOfMonth = (year, month, weekday, n) => {
  const firstDow = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
  return { month, day: 1 + ((weekday - firstDow + 7) % 7) + (n - 1) * 7 };
};
const lastWeekdayOfMonth = (year, month, weekday) => {
  const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
  const lastDow = new Date(Date.UTC(year, month - 1, lastDay)).getUTCDay();
  return { month, day: lastDay - ((lastDow - weekday + 7) % 7) };
};
/* Anonymous Gregorian computus. Easter is the one date here that cannot be
   expressed as "nth weekday of month" — it is the Sunday after the first
   ecclesiastical full moon on or after March 21, which needs the real algorithm.
   Returns a March (3) or April (4) date. */
function easterSunday(year) {
  const a = year % 19;
  const b = Math.floor(year / 100), c = year % 100;
  const d = Math.floor(b / 4), e = b % 4;
  const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4;
  const l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const total = h + l - 7 * m + 114;
  return { month: Math.floor(total / 31), day: (total % 31) + 1 };
}

const US_HOLIDAYS = [
  { id: 'new_years_day',    label: "New Year's Day",  date: () => ({ month: 1, day: 1 }) },
  { id: 'easter',           label: 'Easter Sunday',   date: y => easterSunday(y) },
  { id: 'mothers_day',      label: "Mother's Day",    date: y => nthWeekdayOfMonth(y, 5, 0, 2) },
  { id: 'memorial_day',     label: 'Memorial Day',    date: y => lastWeekdayOfMonth(y, 5, 1) },
  { id: 'fathers_day',      label: "Father's Day",    date: y => nthWeekdayOfMonth(y, 6, 0, 3) },
  { id: 'independence_day', label: 'Fourth of July',  date: () => ({ month: 7, day: 4 }) },
  { id: 'labor_day',        label: 'Labor Day',       date: y => nthWeekdayOfMonth(y, 9, 1, 1) },
  { id: 'thanksgiving',     label: 'Thanksgiving',    date: y => nthWeekdayOfMonth(y, 11, 4, 4) },
  { id: 'christmas',        label: 'Christmas Day',   date: () => ({ month: 12, day: 25 }) },
  { id: 'new_years_eve',    label: "New Year's Eve",  date: () => ({ month: 12, day: 31 }) }
];

/* Off on every channel EXCEPT email: no texts and no AI calls land on a
   holiday, but holiday greetings still go out on the providers' behalf.
   Stored prefs are per-leaf policy paths (compliance.holidays.<id>.<channel>),
   so a practice can override one channel of one holiday at one scope without
   restating the rest — and anything unset falls back here rather than to a
   copy written into the seed. That is why there is no storage migration. */
const HOLIDAY_SEND_DEFAULT = Object.freeze({ sms: false, email: true, voice: false });

function holidaySendPref(compliance, holidayId) {
  const stored = ((compliance || {}).holidays || {})[holidayId] || {};
  const pick = ch => (stored[ch] === undefined ? HOLIDAY_SEND_DEFAULT[ch] : !!stored[ch]);
  return { sms: pick('sms'), email: pick('email'), voice: pick('voice') };
}

/* ── The holiday list a practice actually observes ────────────────────────
   `compliance.holidays` is ONE map keyed by holiday id carrying three kinds of
   thing, so all of it rides the same per-leaf policy paths and inherits the
   scope system for free:
     built-in pref  christmas:   { email: false }
     built-in hidden memorial_day: { hidden: true }
     custom holiday  cust_x:     { custom: true, label, month, day, sms, ... }

   Removal is `hidden: true`, never a delete, for two reasons: submitPolicy's
   patch deletes an exact flattened path and would leave a custom holiday's
   label/month/day leaves orphaned behind it, and hiding is reversible — see the
   Restore control in the UI, without which removing Christmas would be a
   one-way door.

   Custom holidays are a FIXED month/day, repeating annually. Floating rules
   ("third Monday in X") are built-in only; adding a UI for them means exposing
   nth-weekday arithmetic and was not worth it. */
function resolvedHolidays(compliance, year) {
  const cfg = (compliance || {}).holidays || {};
  const out = [];
  for (const h of US_HOLIDAYS) {
    if ((cfg[h.id] || {}).hidden) continue;
    const d = h.date(year);
    out.push({ id: h.id, label: h.label, month: d.month, day: d.day, custom: false });
  }
  for (const [id, c] of Object.entries(cfg)) {
    if (!c || !c.custom || c.hidden) continue;
    const month = Number(c.month), day = Number(c.day);
    if (!month || !day) continue;   // half-written entry: skip rather than render junk
    out.push({ id, label: c.label || 'Untitled holiday', month, day, custom: true });
  }
  return out.sort((a, b) => a.month - b.month || a.day - b.day || a.label.localeCompare(b.label));
}

// Built-ins and customs the practice has removed, for the Restore control.
function hiddenHolidays(compliance, year) {
  const cfg = (compliance || {}).holidays || {};
  const out = [];
  for (const h of US_HOLIDAYS) {
    if (!(cfg[h.id] || {}).hidden) continue;
    const d = h.date(year);
    out.push({ id: h.id, label: h.label, month: d.month, day: d.day, custom: false });
  }
  for (const [id, c] of Object.entries(cfg)) {
    if (!c || !c.custom || !c.hidden) continue;
    out.push({ id, label: c.label || 'Untitled holiday', month: Number(c.month), day: Number(c.day), custom: true });
  }
  return out;
}

// Which observed holiday, if any, falls on a given local calendar date.
function holidayForDate(compliance, year, month, day) {
  return resolvedHolidays(compliance, year).find(h => h.month === month && h.day === day) || null;
}

const daysInMonth = (year, month) => new Date(Date.UTC(year, month, 0)).getUTCDate();
const MONTH_NAMES = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];

const toMin = hhmm => {
  const [h, m] = String(hhmm).split(':').map(Number);
  return h * 60 + m;
};

function inQuiet(minuteOfDay, startMin, endMin) {
  return startMin > endMin
    ? (minuteOfDay >= startMin || minuteOfDay < endMin)
    : (minuteOfDay >= startMin && minuteOfDay < endMin);
}

function shiftForQuietHours(iso, quietStart, quietEnd, tz) {
  const startMin = toMin(quietStart);
  const endMin = toMin(quietEnd);
  const p = partsIn(iso, tz);
  const mod = p.hour * 60 + p.minute;
  if (!inQuiet(mod, startMin, endMin)) return { iso, shifted: false, fromISO: iso };

  const rollToNextDay = startMin > endMin && mod >= startMin;
  const norm = new Date(Date.UTC(p.year, p.month - 1, p.day + (rollToNextDay ? 1 : 0)));
  const opened = instantFrom({
    year: norm.getUTCFullYear(), month: norm.getUTCMonth() + 1, day: norm.getUTCDate(),
    hour: Math.floor(endMin / 60), minute: endMin % 60, second: 0
  }, tz);
  return { iso: opened, shifted: true, fromISO: iso };
}

function suppressionFor(channel, policy, appointment) {
  if (!policy.channels || !policy.channels[channel] || !policy.channels[channel].enabled) {
    return SUPPRESS_REASONS.CHANNEL_DISABLED;
  }
  if (appointment.optOut && appointment.optOut[channel]) return SUPPRESS_REASONS.OPTED_OUT;
  if (!appointment.consent || !appointment.consent[channel]) return SUPPRESS_REASONS.NO_CONSENT;
  if (!appointment.contact || !appointment.contact[channel]) return SUPPRESS_REASONS.BAD_CONTACT;
  return null;
}

function buildSchedule({ policy, appointment, tz }) {
  const events = [];
  const startMs = Date.parse(appointment.startISO);
  const compliance = policy.compliance || {};
  const quietStart = compliance.quietStart || '21:00';
  const quietEnd = compliance.quietEnd || '08:00';
  const steps = (policy.schedule && policy.schedule.steps) || [];

  for (const step of steps) {
    const sends = step.repeat ? Math.max(1, step.repeat.maxSends) : 1;
    const every = step.repeat ? step.repeat.everyMinutes : 0;

    for (let sendIndex = 0; sendIndex < sends; sendIndex++) {
      let cursor = startMs + step.offsetMinutes * 60000 + sendIndex * every * 60000;

      for (const hop of step.chain) {
        const rawISO = new Date(cursor).toISOString();
        const reason = suppressionFor(hop.channel, policy, appointment);
        const id = `${step.id}:${sendIndex}:${hop.channel}`;

        if (reason) {
          events.push({ id, stepId: step.id, channel: hop.channel, atISO: rawISO,
            status: 'suppressed', reason, sendIndex, fromISO: rawISO });
        } else {
          const q = shiftForQuietHours(rawISO, quietStart, quietEnd, tz);
          /* Holiday check runs AFTER the quiet-hours shift, deliberately.
             Quiet hours roll a late send into the next morning, which is
             exactly how a 9pm Christmas Eve text becomes a Christmas Day one —
             testing the pre-shift time would let it through. Date is read in
             the client's tz, not UTC. */
          const p = partsIn(q.iso, tz);
          const hol = holidayForDate(compliance, p.year, p.month, p.day);
          if (hol && !holidaySendPref(compliance, hol.id)[hop.channel]) {
            events.push({ id, stepId: step.id, channel: hop.channel, atISO: q.iso,
              status: 'suppressed', reason: SUPPRESS_REASONS.HOLIDAY, holiday: hol.label,
              sendIndex, fromISO: rawISO });
          } else {
            events.push({ id, stepId: step.id, channel: hop.channel, atISO: q.iso,
              status: q.shifted ? 'shifted' : 'scheduled', reason: null, sendIndex, fromISO: q.fromISO });
          }
        }
        cursor += (hop.waitAfterMin || 0) * 60000;
      }
    }
  }

  return events.sort((a, b) => Date.parse(a.atISO) - Date.parse(b.atISO));
}

/* src/modules/rules.js */
// What-if rule engine. Rules evaluate in list order; a rule containing
// halt_ladder stops evaluation of later rules for that same event.

const EVENTS = Object.freeze({
  NO_CONFIRMATION: 'no_confirmation',
  CANCELLED: 'cancelled',
  RESCHEDULED: 'rescheduled',
  NO_SHOW: 'no_show',
  VOICEMAIL: 'voicemail',
  BAD_CONTACT: 'bad_contact',
  OPT_OUT: 'opt_out',
  CONFIRMED: 'confirmed'
});

const ACTIONS = Object.freeze({
  NOTIFY_STAFF: 'notify_staff',
  CREATE_TASK: 'create_task',
  RELEASE_SLOT: 'release_slot',
  OFFER_WAITLIST: 'offer_waitlist',
  SEND_RESCHEDULE_LINK: 'send_reschedule_link',
  FLAG_CHART: 'flag_chart',
  INCREMENT_NO_SHOW: 'increment_no_show',
  SET_FEE_FLAG: 'set_fee_flag',
  ESCALATE_CHANNEL: 'escalate_channel',
  SUPPRESS_CHANNEL: 'suppress_channel',
  RESEED_LADDER: 'reseed_ladder',
  HALT_LADDER: 'halt_ladder'
});

const OPS = {
  eq: (a, b) => a === b,
  neq: (a, b) => a !== b,
  gte: (a, b) => Number(a) >= Number(b),
  lte: (a, b) => Number(a) <= Number(b)
};

// Params may reference the event context with a "$field" string.
function resolveParams(params, context) {
  const out = {};
  for (const [k, v] of Object.entries(params || {})) {
    out[k] = (typeof v === 'string' && v.startsWith('$')) ? context[v.slice(1)] : v;
  }
  return out;
}

function evaluate(event, context, rules) {
  const actions = [];
  for (const rule of rules || []) {
    if (rule.event !== event) continue;
    const pass = (rule.conditions || []).every(c => {
      const fn = OPS[c.op];
      return fn ? fn(context[c.field], c.value) : false;
    });
    if (!pass) continue;
    let halted = false;
    for (const a of rule.actions || []) {
      actions.push({ type: a.type, params: resolveParams(a.params, context), ruleId: rule.id });
      if (a.type === ACTIONS.HALT_LADDER) halted = true;
    }
    if (halted) break;
  }
  return actions;
}

const A = (type, params) => ({ type, params: params || {} });

const PRESETS = Object.freeze([
  { id: 'standard-confirm-ladder', label: 'Standard Confirm Ladder',
    rules: [{ event: EVENTS.CONFIRMED, conditions: [], actions: [A(ACTIONS.HALT_LADDER)] }] },

  { id: 'no-confirm-escalation', label: 'No-Confirm Escalation',
    rules: [{ event: EVENTS.NO_CONFIRMATION,
      conditions: [{ field: 'attempts', op: 'gte', value: 3 }],
      actions: [A(ACTIONS.NOTIFY_STAFF, { queue: 'front_office' }),
                A(ACTIONS.CREATE_TASK, { title: 'Unconfirmed appointment' })] }] },

  { id: 'cancellation-recovery', label: 'Cancellation Recovery',
    rules: [{ event: EVENTS.CANCELLED, conditions: [],
      actions: [A(ACTIONS.RELEASE_SLOT), A(ACTIONS.OFFER_WAITLIST, { window: 'same_day' }),
                A(ACTIONS.HALT_LADDER)] }] },

  { id: 'reschedule-handoff', label: 'Reschedule Handoff',
    rules: [{ event: EVENTS.RESCHEDULED, conditions: [],
      actions: [A(ACTIONS.RESEED_LADDER, { startISO: '$newStartISO', carryConsent: true }),
                A(ACTIONS.HALT_LADDER)] }] },

  { id: 'no-show-follow-up', label: 'No-Show Follow-Up',
    rules: [{ event: EVENTS.NO_SHOW, conditions: [],
      actions: [A(ACTIONS.INCREMENT_NO_SHOW), A(ACTIONS.FLAG_CHART),
                A(ACTIONS.SEND_RESCHEDULE_LINK), A(ACTIONS.SET_FEE_FLAG)] }] },

  { id: 'unreachable', label: 'Unreachable',
    rules: [
      { event: EVENTS.BAD_CONTACT, conditions: [],
        actions: [A(ACTIONS.SUPPRESS_CHANNEL, { channel: '$channel' }),
                  A(ACTIONS.NOTIFY_STAFF, { queue: 'front_office' })] },
      { event: EVENTS.VOICEMAIL, conditions: [{ field: 'voicemailCount', op: 'gte', value: 2 }],
        actions: [A(ACTIONS.ESCALATE_CHANNEL, { to: 'sms' })] }
    ] },

  { id: 'opt-out-compliance', label: 'Opt-Out Compliance',
    rules: [{ event: EVENTS.OPT_OUT, conditions: [],
      actions: [A(ACTIONS.SUPPRESS_CHANNEL, { channel: '$channel', permanent: true }),
                A(ACTIONS.FLAG_CHART, { note: 'opt_out' })] }] }
]);

let seq = 0;
function instantiatePreset(presetId) {
  const preset = PRESETS.find(p => p.id === presetId);
  if (!preset) return [];
  return preset.rules.map(r => ({
    event: r.event,
    conditions: r.conditions.map(c => ({ ...c })),
    actions: r.actions.map(a => ({ type: a.type, params: { ...a.params } })),
    id: `r${Date.now().toString(36)}${(seq++).toString(36)}`,
    source: 'preset',
    presetId
  }));
}

/* src/modules/simulator.js */
// Deterministic scenario replay. Same policy + appointment + rules + outcome
// always produces an identical log -- no Date.now(), no random ids.



const OUTCOMES = Object.freeze({
  NONE: 'none',
  CONFIRMS: 'confirms',
  CANCELS: 'cancels',
  RESCHEDULES: 'reschedules',
  NO_SHOW: 'no_show',
  STOP: 'stop',
  BAD_NUMBER: 'bad_number',
  VOICEMAIL: 'voicemail'
});

const NO_SHOW_DELAY_MIN = 15;

const EVENT_FOR = {
  [OUTCOMES.CONFIRMS]: EVENTS.CONFIRMED,
  [OUTCOMES.CANCELS]: EVENTS.CANCELLED,
  [OUTCOMES.RESCHEDULES]: EVENTS.RESCHEDULED,
  [OUTCOMES.STOP]: EVENTS.OPT_OUT,
  [OUTCOMES.BAD_NUMBER]: EVENTS.BAD_CONTACT,
  [OUTCOMES.VOICEMAIL]: EVENTS.VOICEMAIL
};

function inboundFor(outcome, appointment) {
  if (!outcome || outcome.type === OUTCOMES.NONE) return null;
  if (outcome.type === OUTCOMES.NO_SHOW) {
    return {
      atISO: new Date(Date.parse(appointment.startISO) + NO_SHOW_DELAY_MIN * 60000).toISOString(),
      event: EVENTS.NO_SHOW, channel: null, newStartISO: null
    };
  }
  if (outcome.type === OUTCOMES.VOICEMAIL) {
    return {
      atISO: outcome.atISO || appointment.startISO,
      event: EVENTS.VOICEMAIL,
      channel: 'voice',
      newStartISO: null,
      voicemailCount: 1
    };
  }
  return {
    atISO: outcome.atISO || appointment.startISO,
    event: EVENT_FOR[outcome.type],
    channel: outcome.channel || null,
    newStartISO: outcome.newStartISO || null
  };
}

function runScenario({ policy, appointment, rules, outcome, tz }) {
  const schedule = buildSchedule({ policy, appointment, tz });
  const inbound = inboundFor(outcome, appointment);
  const log = [];

  let halted = false;
  let confirmed = false;
  let confirmedBy = null;
  let attempts = 0;
  const suppressedChannels = new Set();

  function emitInbound() {
    const context = {
      channel: inbound.channel,
      attempts,
      voicemailCount: (inbound.voicemailCount || 0) + (appointment.voicemailCount || 0),
      newStartISO: inbound.newStartISO
    };
    const actions = evaluate(inbound.event, context, rules);

    log.push({ atISO: inbound.atISO, kind: 'inbound', channel: inbound.channel,
      detail: { event: inbound.event }, actions: [] });
    log.push({ atISO: inbound.atISO, kind: 'rule', channel: inbound.channel,
      detail: { event: inbound.event }, actions });

    for (const a of actions) {
      if (a.type === ACTIONS.HALT_LADDER) halted = true;
      if (a.type === ACTIONS.SUPPRESS_CHANNEL && a.params.channel) suppressedChannels.add(a.params.channel);
    }
    if (inbound.event === EVENTS.CONFIRMED) {
      confirmed = true;
      confirmedBy = inbound.channel;
      halted = true;
    }
  }

  let inboundDone = !inbound;

  for (const ev of schedule) {
    if (!inboundDone && Date.parse(inbound.atISO) <= Date.parse(ev.atISO)) {
      emitInbound();
      inboundDone = true;
    }
    if (halted) continue;

    if (suppressedChannels.has(ev.channel)) {
      log.push({ atISO: ev.atISO, kind: 'suppressed', channel: ev.channel,
        detail: { reason: 'suppressed_by_rule', stepId: ev.stepId }, actions: [] });
      continue;
    }
    if (ev.status === 'suppressed') {
      log.push({ atISO: ev.atISO, kind: 'suppressed', channel: ev.channel,
        detail: { reason: ev.reason, stepId: ev.stepId }, actions: [] });
      continue;
    }

    attempts++;
    log.push({
      atISO: ev.atISO,
      kind: 'send',
      channel: ev.channel,
      detail: {
        stepId: ev.stepId,
        sendIndex: ev.sendIndex,
        shiftedFromISO: ev.status === 'shifted' ? ev.fromISO : null
      },
      actions: []
    });
  }

  if (!inboundDone) emitInbound();

  if (!confirmed && !halted && attempts > 0) {
    const actions = evaluate(EVENTS.NO_CONFIRMATION, { attempts }, rules);
    if (actions.length) {
      log.push({ atISO: appointment.startISO, kind: 'rule', channel: null,
        detail: { event: EVENTS.NO_CONFIRMATION, attempts }, actions });
    }
  }

  log.push({
    atISO: appointment.startISO,
    kind: 'final',
    channel: null,
    detail: {
      state: confirmed ? 'confirmed' : (halted ? 'halted' : 'unconfirmed'),
      confirmedBy,
      attempts,
      suppressedChannels: [...suppressedChannels].sort()
    },
    actions: []
  });

  return log;
}

// Single transport wrapper. Swap the body for a fetch() call when the
// Express backend lands -- no caller changes required.
async function api(method, path, body) {
  const entry = { method, path, body, atISO: new Date().toISOString() };
  if (typeof console !== 'undefined' && console.debug) console.debug('[api]', entry);
  return { ok: true, data: body === undefined ? null : body };
}

// Persistence layer. Pure modules never touch this file.




/* v3 → v4: the What-Ifs port blanks the agency `rules` seed so the tab opens
   with one empty block, but a persisted v3 state still carries the 5 old preset
   rules and silently shadows the new default — anyone with existing storage
   would never see the redesigned tab. Bumping the key purges it, the same fix
   V30 used for the multi-condition seed. */
const STORAGE_KEY = 'credify_reminders_v4';

function loadState(storage) {
  const raw = storage.getItem(STORAGE_KEY);
  if (raw) {
    try {
      const parsed = JSON.parse(raw);
      if (parsed && Array.isArray(parsed.clients) && parsed.clients.length) {
        // V2: ensure seriesExceptions key present in stored state
        if (!parsed.seriesExceptions) parsed.seriesExceptions = {};
        /* Manual opt-out roster. Absent in any state saved before this build,
           so backfill rather than bump the storage key — nothing else about the
           shape changed and a bump would throw away the user's policies. */
        if (!parsed.optOuts) parsed.optOuts = {};
        return parsed;
      }
    } catch (err) {
      // corrupt payload -- fall through to a fresh seed
    }
  }
  const fresh = seedState();
  saveState(storage, fresh);
  return fresh;
}

function saveState(storage, state) {
  storage.setItem(STORAGE_KEY, JSON.stringify(state));
}

/* ── Manual opt-out roster ────────────────────────────────────────────────
   INTEGRATION POINT. In production these come from the chart and sync in
   automatically; until then they are set by hand on the Compliance tab. Kept
   in `state.optOuts` keyed "client:<id>" / "provider:<id>" rather than written
   onto the client or provider record, because the directory above is read-only
   by contract — and rather than onto the appointment, because an opt-out
   belongs to a PERSON and has to apply to their future appointments too, not
   just the ones that exist now.

   A provider-level opt-out means "do not use this channel for this provider's
   appointments" (the recipient is still the client). Client and provider
   opt-outs are OR-ed: either one suppresses. */
const optOutKey = (kind, id) => `${kind}:${id}`;

function optOutFor(state, kind, id) {
  const stored = ((state && state.optOuts) || {})[optOutKey(kind, id)] || {};
  return { sms: !!stored.sms, email: !!stored.email, voice: !!stored.voice };
}

/* Folds the manual roster into an appointment's own optOut flags. The engine
   reads appointment.optOut and knows nothing about the roster, so this is
   applied where an appointment is handed to the engine. */
function withManualOptOuts(state, appt) {
  const merged = { ...(appt.optOut || {}) };
  for (const [kind, id] of [['client', appt.clientId], ['provider', appt.providerId]]) {
    const m = optOutFor(state, kind, id);
    for (const ch of ['sms', 'email', 'voice']) if (m[ch]) merged[ch] = true;
  }
  return { ...appt, optOut: merged };
}

// Read-only directory of entities this module can target. This module never
// creates or edits clients/providers/appointment types.
// INTEGRATION POINT: Calendar/EHR directory. Swap this body to the fetched
// directory cache when the module is wired in. Callers are read-only.
function getDirectory(state) {
  return {
    clients: state.clients,
    providers: state.providers,
    apptTypes: state.apptTypes
  };
}

function readControl(el) {
  if (el.type === 'checkbox') return el.checked;
  if (el.type === 'number') return el.value === '' ? null : Number(el.value);
  if (el.dataset.policyType === 'csv') {
    return el.value.split(',').map(s => s.trim()).filter(Boolean);
  }
  return el.value;
}

function collectPolicy(formEl) {
  const patch = {};
  for (const el of formEl.querySelectorAll('[data-policy-path]')) {
    if (el.dataset.inherited === 'true') continue;
    patch[el.dataset.policyPath] = readControl(el);
  }
  return patch;
}

async function submitPolicy(state, scopeLevel, scopeRef, patch) {
  const next = JSON.parse(JSON.stringify(state));
  let row = next.policies.find(p => p.scopeLevel === scopeLevel && p.scopeRef === scopeRef);
  if (!row) {
    row = { id: `pol-${scopeLevel}-${scopeRef === null ? 'root' : scopeRef}`, scopeLevel, scopeRef };
    next.policies.push(row);
  }

  const flat = flatten(row);
  for (const [path, value] of Object.entries(patch)) {
    if (value === null || value === undefined) delete flat[path];
    else flat[path] = value;
  }
  const rebuilt = unflatten(flat);
  for (const k of Object.keys(row)) {
    if (k !== 'id' && k !== 'scopeLevel' && k !== 'scopeRef') delete row[k];
  }
  Object.assign(row, rebuilt);

  await api('PUT', `/policies/${row.id}`, row);
  return next;
}

// Shared control primitives. mountSelect is the standing rule for every
// dropdown: custom-styled on desktop, native on mobile/touch.

const LEVEL_LABELS = {
  agency: 'Agency default',
  apptType: 'Appointment type',
  provider: 'Provider',
  client: 'Client'
};

function isTouch(win) {
  return !!(win && win.matchMedia && win.matchMedia('(pointer: coarse)').matches);
}

function mountSelect(el, { options, value, onChange, win, forceCustom }) {
  const doc = el.ownerDocument;

  el.innerHTML = '';
  for (const o of options) {
    const opt = doc.createElement('option');
    opt.value = o.value;
    opt.textContent = o.label;
    el.appendChild(opt);
  }
  el.value = value;

  if (!forceCustom && isTouch(win)) {
    el.hidden = false;
    el.addEventListener('change', () => onChange(el.value));
    return { setValue: v => { el.value = v; }, getValue: () => el.value, destroy() {} };
  }

  el.hidden = true;

  const wrap = doc.createElement('div');
  wrap.className = 'cf-select';

  const trigger = doc.createElement('button');
  trigger.type = 'button';
  trigger.className = 'cf-select-trigger';
  trigger.setAttribute('aria-haspopup', 'listbox');
  trigger.setAttribute('aria-expanded', 'false');

  const list = doc.createElement('div');
  list.className = 'cf-select-list';
  list.setAttribute('role', 'listbox');
  list.hidden = true;

  const optionFor = v => options.find(o => o.value === v) || options[0] || { label: '' };
  /* A placeholder option's text is not a value the user chose, so it must not
     be styled like one — .is-placeholder greys it to --c-muted-2. Set through
     this helper everywhere the trigger's text changes, or the empty state reads
     as a real selection. */
  const paintTrigger = v => {
    const o = optionFor(v);
    trigger.textContent = o.label;
    trigger.classList.toggle('is-placeholder', !!o.placeholder);
  };
  paintTrigger(value);

  const close = () => {
    list.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
    if (searchInput) { searchInput.value = ''; filterOptions(''); }
  };

  // Search input — only for large lists (> 8 options)
  let searchInput = null;
  let optionsWrap = null;
  if (options.length > 8) {
    searchInput = doc.createElement('input');
    searchInput.type = 'text';
    searchInput.className = 'cf-select-search';
    searchInput.placeholder = 'Search…';
    searchInput.setAttribute('aria-label', 'Search options');
    list.appendChild(searchInput);
  }

  optionsWrap = doc.createElement('div');
  optionsWrap.className = options.length > 8 ? 'cf-select-options' : '';
  list.appendChild(optionsWrap);

  const filterOptions = q => {
    const lower = q.toLowerCase();
    for (const item of optionsWrap.children) {
      item.hidden = !!q && !item.textContent.toLowerCase().includes(lower);
    }
  };

  if (searchInput) {
    searchInput.addEventListener('input', () => filterOptions(searchInput.value));
    searchInput.addEventListener('keydown', ev => { if (ev.key === 'Escape') close(); });
    // Prevent list from closing when clicking the search input
    searchInput.addEventListener('click', ev => ev.stopPropagation());
  }

  for (const o of options) {
    /* `placeholder: true` marks an option that labels the trigger in the empty
       state but is not itself a choice — "Select an event" was offered in the
       list, where picking it just cleared the field. The native <option> above
       is still created (the empty value has to exist, and touch uses it). */
    if (o.placeholder) continue;
    const item = doc.createElement('button');
    item.type = 'button';
    item.className = 'cf-select-option';
    item.dataset.value = o.value;
    item.setAttribute('role', 'option');
    item.textContent = o.label;
    item.addEventListener('click', () => {
      el.value = o.value;
      paintTrigger(o.value);
      close();
      onChange(o.value);
    });
    optionsWrap.appendChild(item);
  }

  trigger.addEventListener('click', () => {
    const opening = list.hidden;
    list.hidden = !opening;
    trigger.setAttribute('aria-expanded', String(opening));
    if (opening && searchInput) { searchInput.value = ''; filterOptions(''); searchInput.focus(); }
  });

  doc.addEventListener('click', ev => {
    if (!wrap.contains(ev.target)) close();
  });

  el.parentNode.insertBefore(wrap, el);
  wrap.appendChild(trigger);
  wrap.appendChild(list);
  wrap.appendChild(el);

  return {
    setValue: v => { el.value = v; paintTrigger(v); },
    getValue: () => el.value,
    destroy: () => { wrap.parentNode.insertBefore(el, wrap); el.hidden = false; wrap.remove(); }
  };
}

/* V9: tabbed trigger type selector — renders 3 tab groups instead of a flat scrolling list */
/* V33.2: `tabsHost` splits the control in two — the category tab bar renders
   into the caller's element while the value trigger stays where `el` is. That
   lets the Schedule card lay them out as two labelled fields side by side
   (Trigger category | Trigger) instead of one stacked composite. Omit it and
   the control behaves exactly as before. */
function mountTabbedSelect(el, { tabs, value, onChange, win, tabsHost }) {
  const doc = el.ownerDocument;
  /* The touch fallback collapses the categories into <optgroup>s, which would
     leave a caller-supplied tabsHost empty. When the caller has laid out a
     dedicated cell for the category bar, always take the custom path — it is
     button-driven and works fine under touch. */
  if (isTouch(win) && !tabsHost) {
    // On touch: fall back to native select with all options
    el.innerHTML = '';
    for (const tab of tabs) {
      const grp = doc.createElement('optgroup');
      grp.label = tab.label;
      for (const o of tab.options) {
        const opt = doc.createElement('option');
        opt.value = o.value; opt.textContent = o.label;
        grp.appendChild(opt);
      }
      el.appendChild(grp);
    }
    el.value = value;
    el.hidden = false;
    el.addEventListener('change', () => onChange(el.value));
    return { setValue: v => { el.value = v; }, destroy() {} };
  }
  el.hidden = true;

  const allOptions = tabs.flatMap(t => t.options);
  const labelFor = v => (allOptions.find(o => o.value === v) || allOptions[0] || { label: '' }).label;
  const tabFor = v => tabs.find(t => t.options.some(o => o.value === v)) || tabs[0];

  let current = value || allOptions[0].value;
  let activeTabId = tabFor(current).id;

  const wrap = doc.createElement('div');
  wrap.className = 'cf-tsel';

  // Tab bar — always visible above trigger
  const tabBar = doc.createElement('div');
  tabBar.className = 'cf-tsel-tabs';

  const trigger = doc.createElement('button');
  trigger.type = 'button';
  trigger.className = 'cf-tsel-trigger';
  trigger.setAttribute('aria-haspopup', 'listbox');
  trigger.setAttribute('aria-expanded', 'false');
  trigger.textContent = labelFor(current);

  // Panel = options list only (tabs are outside, always visible)
  const panel = doc.createElement('div');
  panel.className = 'cf-tsel-panel';
  panel.hidden = true;

  const optionsEl = doc.createElement('div');
  optionsEl.className = 'cf-tsel-options';
  panel.appendChild(optionsEl);

  const renderOptions = (tabId) => {
    optionsEl.innerHTML = '';
    const tab = tabs.find(t => t.id === tabId) || tabs[0];
    for (const o of tab.options) {
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'cf-tsel-option' + (o.value === current ? ' is-active' : '');
      btn.textContent = o.label;
      btn.addEventListener('click', () => {
        current = o.value;
        trigger.textContent = o.label;
        el.value = o.value;
        close();
        onChange(o.value);
      });
      optionsEl.appendChild(btn);
    }
  };

  const renderTabs = (activeId) => {
    tabBar.innerHTML = '';
    for (const tab of tabs) {
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'cf-tsel-tab' + (tab.id === activeId ? ' is-active' : '');
      btn.textContent = tab.label;
      btn.addEventListener('click', (ev) => {
        ev.stopPropagation();
        activeTabId = tab.id;
        renderTabs(activeTabId);
        renderOptions(activeTabId);
        if (panel.hidden) { panel.hidden = false; trigger.setAttribute('aria-expanded', 'true'); }
      });
      tabBar.appendChild(btn);
    }
  };

  const close = () => {
    panel.hidden = true;
    trigger.setAttribute('aria-expanded', 'false');
  };

  trigger.addEventListener('click', () => {
    const opening = panel.hidden;
    panel.hidden = !opening;
    trigger.setAttribute('aria-expanded', String(opening));
    if (opening) { activeTabId = tabFor(current).id; renderTabs(activeTabId); renderOptions(activeTabId); }
  });

  // Render tabs immediately — they're always visible
  renderTabs(activeTabId);

  doc.addEventListener('click', ev => {
    if (!wrap.contains(ev.target)) close();
  });

  el.parentNode.insertBefore(wrap, el);
  if (tabsHost) {
    wrap.classList.add('cf-tsel-split');
    /* The tab bar leaves the wrap, so it cannot be styled through a descendant
       selector on .cf-tsel-split — it carries its own class instead. This is
       what selects the segmented pill treatment over the V9 attached bar. */
    tabBar.classList.add('cf-tsel-tabs-seg');
    tabsHost.appendChild(tabBar);
    // The outside-click guard tests wrap only, so the detached tab bar needs
    // its own exemption or clicking a category would close the panel.
    tabBar.addEventListener('click', ev => ev.stopPropagation());
  } else {
    wrap.appendChild(tabBar);
  }
  wrap.appendChild(trigger);
  wrap.appendChild(panel);
  wrap.appendChild(el);

  return {
    setValue: v => {
      current = v;
      trigger.textContent = labelFor(v);
      el.value = v;
      activeTabId = tabFor(v).id;
      renderTabs(activeTabId);
    },
    destroy: () => { wrap.parentNode.insertBefore(el, wrap); el.hidden = false; wrap.remove(); }
  };
}

/* Credify-themed confirm, replacing win.confirm() — the native dialog is
   unstyled OS chrome, cannot mark a destructive action, and shows the page
   origin instead of the product.

   Hoisted out of renderWhatIfs to module scope (it was declared inside, so only
   the What-Ifs tab could reach it) and given `doc` as a parameter rather than
   closing over one. Same overlay/box primitives as openNameModal so the two
   read as one family. Ids cf-confirm-overlay / -cancel / -ok are asserted by
   tests — keep them. */
function openConfirm(doc, { title, body, confirmLabel, danger, onConfirm }) {
  const overlay = doc.createElement('div');
  overlay.className = 'cf-modal-overlay';
  overlay.id = 'cf-confirm-overlay';
  const box = doc.createElement('div');
  box.className = 'cf-modal';
  const h2 = doc.createElement('h2'); h2.textContent = title;
  box.appendChild(h2);
  if (body) {
    const p = doc.createElement('p');
    p.className = 'cf-modal-body';
    p.textContent = body;
    box.appendChild(p);
  }
  const footer = doc.createElement('div');
  footer.style.cssText = 'display:flex;justify-content:flex-end;gap:8px';
  const cancel = doc.createElement('button');
  cancel.type = 'button'; cancel.className = 'cf-btn-quiet';
  cancel.id = 'cf-confirm-cancel'; cancel.textContent = 'Cancel';
  const ok = doc.createElement('button');
  ok.type = 'button';
  ok.className = danger ? 'cf-btn-danger' : 'cf-cond-save-btn';
  ok.id = 'cf-confirm-ok';
  ok.textContent = confirmLabel || 'Confirm';
  footer.appendChild(cancel); footer.appendChild(ok);
  box.appendChild(footer); overlay.appendChild(box);
  doc.body.appendChild(overlay);
  ok.focus();
  const close = () => { overlay.remove(); doc.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  doc.addEventListener('keydown', onKey);
  cancel.addEventListener('click', close);
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  ok.addEventListener('click', () => { close(); onConfirm(); });
}

// #credify-tip singleton (V6): dark pill tooltip driven by data-tip. No-op on touch.
function mountTip(doc, win) {
  if (doc.getElementById('credify-tip') || (typeof isTouch === 'function' && isTouch(win))) return;
  const tip = doc.createElement('div');
  tip.id = 'credify-tip';
  doc.body.appendChild(tip);
  let raf = null;
  doc.addEventListener('mouseover', e => {
    const t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if (!t) { tip.classList.remove('is-on'); return; }
    tip.textContent = t.dataset.tip;
    const r = t.getBoundingClientRect();
    if (raf && win.cancelAnimationFrame) win.cancelAnimationFrame(raf);
    const place = () => {
      const th = tip.offsetHeight, tw = tip.offsetWidth;
      let top = r.top - th - 8;
      if (top < 4) top = r.bottom + 8;
      let left = Math.min(Math.max(4, r.left + r.width / 2 - tw / 2), win.innerWidth - tw - 4);
      tip.style.top = top + 'px';
      tip.style.left = left + 'px';
      tip.classList.add('is-on');
    };
    raf = win.requestAnimationFrame ? win.requestAnimationFrame(place) : (place(), null);
  });
  doc.addEventListener('mouseout', () => tip.classList.remove('is-on'));
}

/* src/app/pane-scope.js */
// Left pane: the scope tree. Selecting a node picks which level the editor
// writes to; the badge is how many overrides that level currently sets.


function countFor(state, level, ref) {
  const row = state.policies.find(p => p.scopeLevel === level && p.scopeRef === ref);
  return row ? overrideCount(row) : 0;
}

const SCOPE_GROUPS = [
  { key: 'client',   label: 'Clients',           listKey: 'clients',   labelOf: c => `${c.firstName} ${c.lastName}` },
  { key: 'provider', label: 'Providers',         listKey: 'providers', labelOf: p => p.name },
  { key: 'apptType', label: 'Appointment Types', listKey: 'apptTypes', labelOf: t => t.label }
];

// Exceptions-only sidebar model (V6): Agency Default plus ONLY entities that
// currently set at least one override. The active zero-override scope is
// injected as a provisional row so the user does not lose their place.
function buildScopeSidebar(state, activeScope) {
  const dir = getDirectory(state);
  const groups = [];
  for (const g of SCOPE_GROUPS) {
    const rows = [];
    for (const it of dir[g.listKey]) {
      const overrides = countFor(state, g.key, it.id);
      if (overrides > 0) {
        rows.push({ level: g.key, ref: it.id, label: g.labelOf(it), overrides, provisional: false });
      }
    }
    if (activeScope && activeScope.level === g.key) {
      const active = dir[g.listKey].find(it => it.id === activeScope.ref);
      if (active && !rows.some(r => r.ref === activeScope.ref)) {
        rows.push({ level: g.key, ref: active.id, label: g.labelOf(active), overrides: 0, provisional: true });
      }
    }
    if (rows.length) groups.push({ key: g.key, label: g.label, rows });
  }
  return {
    agency: { level: 'agency', ref: null, label: 'Agency Default', overrides: countFor(state, 'agency', null) },
    groups
  };
}

function renderScopeSidebar(doc, host, model, handlers, active, win) {
  host.innerHTML = '';
  const touch = typeof isTouch === 'function' && isTouch(win);
  const isActive = (l, r) => !!active && active.level === l && active.ref === r;

  const agency = doc.createElement('button');
  agency.type = 'button';
  agency.id = 'scope-agency-card';
  agency.className = 'cf-agency-card' + (isActive('agency', null) ? ' is-active' : '');
  const aName = doc.createElement('span');
  aName.textContent = model.agency.label;
  agency.appendChild(aName);
  const aBadge = doc.createElement('span');
  aBadge.className = 'cf-override-count';
  aBadge.textContent = String(model.agency.overrides);
  agency.appendChild(aBadge);
  agency.addEventListener('click', () => handlers.onSelect('agency', null));
  host.appendChild(agency);

  const title = doc.createElement('div');
  title.className = 'cf-pane-title';
  title.textContent = 'Custom Reminders';
  host.appendChild(title);

  if (!model.groups.length) {
    const empty = doc.createElement('p');
    empty.className = 'cf-empty-note';
    empty.textContent = 'Everyone follows the Agency Default.';
    host.appendChild(empty);
  }

  for (const group of model.groups) {
    const h = doc.createElement('div');
    h.className = 'cf-scope-group';
    h.textContent = group.label;
    host.appendChild(h);
    for (const row of group.rows) {
      const wrap = doc.createElement('div');
      wrap.className = 'cf-custom-row'
        + (isActive(row.level, row.ref) ? ' is-active' : '')
        + (row.provisional ? ' is-provisional' : '')
        + (touch ? ' cf-touch' : '');
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'cf-scope-btn';
      btn.dataset.scopeLevel = row.level;
      btn.dataset.scopeRef = row.ref;
      const name = doc.createElement('span');
      name.textContent = row.label;
      btn.appendChild(name);
      if (row.provisional) {
        const note = doc.createElement('span');
        note.className = 'cf-provisional-note';
        note.textContent = 'no overrides yet';
        btn.appendChild(note);
      } else {
        const b = doc.createElement('span');
        b.className = 'cf-override-count';
        b.textContent = String(row.overrides);
        btn.appendChild(b);
      }
      btn.addEventListener('click', () => handlers.onSelect(row.level, row.ref));
      wrap.appendChild(btn);
      if (!row.provisional) {
        const x = doc.createElement('button');
        x.type = 'button';
        x.className = 'cf-row-x';
        x.dataset.tip = 'Remove custom reminders';
        x.setAttribute('aria-label', 'Remove custom reminders for ' + row.label);
        x.textContent = '\u00d7';
        x.addEventListener('click', ev => { ev.stopPropagation(); handlers.onRevert(row.level, row.ref, row.label); });
        wrap.appendChild(x);
      }
      host.appendChild(wrap);
    }
  }

  const add = doc.createElement('button');
  add.type = 'button';
  add.id = 'scope-customize-btn';
  add.className = 'cf-customize-btn';
  add.textContent = '+ Customize...';
  add.addEventListener('click', () => handlers.onCustomize());
  host.appendChild(add);
}

// Editor scope: agency plus at most the one selected level.
function chainFor(state, level, ref) {
  const find = (l, r) => state.policies.find(p => p.scopeLevel === l && p.scopeRef === r);
  const chain = [find('agency', null)].filter(Boolean);
  if (level === 'agency') return chain;
  const row = find(level, ref);
  if (row) chain.push(row);
  return chain;
}

// Real appointment: the full four-level chain in precedence order.
function chainForAppointment(state, appointment) {
  const find = (l, r) => state.policies.find(p => p.scopeLevel === l && p.scopeRef === r);
  return [
    find('agency', null),
    find('apptType', appointment.apptTypeId),
    find('provider', appointment.providerId),
    find('client', appointment.clientId)
  ].filter(Boolean);
}

// Customize picker (V6): search the full read-only directory and jump to a scope.
/* ---- Credify-themed date picker (ported from EHR-7-25-V13 openDatePicker) ----
   Same shape as the EHR's: serif title, month/year selects, ‹ › month nav, a
   7-column day grid, and Clear / Cancel / Save. Kept dependency-free and
   built from this file's own primitives so it stays a single-file tool.
   ISO in, ISO out ('' when cleared) — never a Date object, so it round-trips
   through JSON and never drifts across timezones. */
const DP_MONTHS = ['January','February','March','April','May','June',
  'July','August','September','October','November','December'];
const DP_DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

// 'YYYY-MM-DD' -> 'Mon D, YYYY'. Parsed by parts, never through Date(string),
// which would shift the day for anyone behind UTC.
function fmtDateChip(iso) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso || '')) return iso || '';
  const [y, m, d] = iso.split('-').map(Number);
  return `${DP_MONTHS[m - 1].slice(0, 3)} ${d}, ${y}`;
}

function openDatePicker(doc, win, current, onSave) {
  let y, mo, sel = null;
  if (/^\d{4}-\d{2}-\d{2}$/.test(current || '')) {
    const p = current.split('-').map(Number);
    y = p[0]; mo = p[1] - 1; sel = current;
  } else {
    const now = new Date();
    y = now.getFullYear(); mo = now.getMonth();
  }

  const backdrop = doc.createElement('div');
  backdrop.className = 'cf-picker-backdrop cf-dp-backdrop';
  backdrop.id = 'date-picker-backdrop';

  const panel = doc.createElement('div');
  panel.className = 'cf-dp';
  backdrop.appendChild(panel);

  const close = () => {
    backdrop.remove();
    doc.removeEventListener('keydown', onKey);
  };
  const onKey = ev => { if (ev.key === 'Escape') close(); };

  const head = doc.createElement('div');
  head.className = 'cf-dp-head';
  head.textContent = 'Pick a date';
  panel.appendChild(head);

  const bodyEl = doc.createElement('div');
  bodyEl.className = 'cf-dp-body';
  panel.appendChild(bodyEl);

  const nav = doc.createElement('div');
  nav.className = 'cf-dp-nav';
  bodyEl.appendChild(nav);

  const mkNav = (glyph, delta, id) => {
    const b = doc.createElement('button');
    b.type = 'button'; b.className = 'cf-dp-nav-btn'; b.id = id;
    b.textContent = glyph;
    b.addEventListener('click', () => {
      mo += delta;
      if (mo < 0) { mo = 11; y--; }
      if (mo > 11) { mo = 0; y++; }
      paint();
    });
    return b;
  };

  const monthSel = doc.createElement('select');
  monthSel.id = 'dp-month'; monthSel.name = 'dp-month';
  const yearSel = doc.createElement('select');
  yearSel.id = 'dp-year'; yearSel.name = 'dp-year';
  const monthWrap = doc.createElement('div'); monthWrap.className = 'cf-dp-month';
  const yearWrap = doc.createElement('div'); yearWrap.className = 'cf-dp-year';
  monthWrap.appendChild(monthSel); yearWrap.appendChild(yearSel);

  nav.appendChild(mkNav('‹', -1, 'dp-prev'));
  nav.appendChild(monthWrap);
  nav.appendChild(yearWrap);
  nav.appendChild(mkNav('›', 1, 'dp-next'));

  const grid = doc.createElement('div');
  grid.className = 'cf-dp-grid';
  bodyEl.appendChild(grid);

  const foot = doc.createElement('div');
  foot.className = 'cf-dp-foot';
  const clearBtn = doc.createElement('button');
  clearBtn.type = 'button'; clearBtn.className = 'cf-btn-quiet cf-dp-clear';
  clearBtn.id = 'dp-clear'; clearBtn.textContent = 'Clear';
  clearBtn.addEventListener('click', () => { sel = null; paint(); });
  const rightWrap = doc.createElement('div');
  rightWrap.className = 'cf-dp-foot-right';
  const cancelBtn = doc.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'cf-btn-secondary';
  cancelBtn.id = 'dp-cancel'; cancelBtn.textContent = 'Cancel';
  cancelBtn.addEventListener('click', close);
  const saveBtn = doc.createElement('button');
  saveBtn.type = 'button'; saveBtn.className = 'cf-btn-primary';
  saveBtn.id = 'dp-save'; saveBtn.textContent = 'Save';
  saveBtn.addEventListener('click', () => { const v = sel || ''; close(); onSave(v); });
  rightWrap.appendChild(cancelBtn); rightWrap.appendChild(saveBtn);
  foot.appendChild(clearBtn); foot.appendChild(rightWrap);
  panel.appendChild(foot);

  const iso = (yy, mm, dd) =>
    `${yy}-${String(mm + 1).padStart(2, '0')}-${String(dd).padStart(2, '0')}`;

  const todayISO = (() => { const n = new Date(); return iso(n.getFullYear(), n.getMonth(), n.getDate()); })();

  let mounted = false;
  function paint() {
    grid.innerHTML = '';
    for (const d of DP_DOW) {
      const h = doc.createElement('div');
      h.className = 'cf-dp-dow'; h.textContent = d;
      grid.appendChild(h);
    }
    const firstDow = new Date(y, mo, 1).getDay();
    const dim = new Date(y, mo + 1, 0).getDate();
    for (let i = 0; i < firstDow; i++) grid.appendChild(doc.createElement('div'));
    for (let d = 1; d <= dim; d++) {
      const ds = iso(y, mo, d);
      const b = doc.createElement('button');
      b.type = 'button';
      b.className = 'cf-dp-day'
        + (ds === sel ? ' is-sel' : '')
        + (ds === todayISO ? ' is-today' : '');
      b.dataset.date = ds;
      b.textContent = String(d);
      b.addEventListener('click', () => { sel = ds; paint(); });
      grid.appendChild(b);
    }
    if (!mounted) {
      mounted = true;
      const years = [];
      for (let yy = new Date().getFullYear() - 5; yy <= new Date().getFullYear() + 10; yy++) {
        years.push({ value: String(yy), label: String(yy) });
      }
      mountSelect(monthSel, {
        options: DP_MONTHS.map((nm, i) => ({ value: String(i), label: nm })),
        value: String(mo), win, forceCustom: true,
        onChange: v => { mo = Number(v); paint(); }
      });
      mountSelect(yearSel, {
        options: years, value: String(y), win, forceCustom: true,
        onChange: v => { y = Number(v); paint(); }
      });
    }
  }

  paint();
  backdrop.addEventListener('click', ev => { if (ev.target === backdrop) close(); });
  doc.addEventListener('keydown', onKey);
  doc.body.appendChild(backdrop);
}

function openCustomizePicker(doc, { state, onPick, win }) {
  if (doc.getElementById('scope-picker')) return;
  const dir = getDirectory(state);
  const back = doc.createElement('div');
  back.className = 'cf-picker-backdrop';
  back.id = 'scope-picker';
  const panel = doc.createElement('div');
  panel.className = 'cf-picker';
  const head = doc.createElement('div');
  head.className = 'cf-picker-head';
  const hTitle = doc.createElement('span');
  hTitle.textContent = 'Customize reminders for...';
  head.appendChild(hTitle);
  const closeBtn = doc.createElement('button');
  closeBtn.type = 'button';
  closeBtn.className = 'cf-picker-close';
  closeBtn.setAttribute('aria-label', 'Close');
  closeBtn.textContent = '\u00d7';
  head.appendChild(closeBtn);
  panel.appendChild(head);
  const search = doc.createElement('input');
  search.type = 'search';
  search.id = 'scope-picker-search';
  search.name = 'scope-picker-search';
  search.placeholder = 'Search clients, providers, appointment types';
  search.autocomplete = 'off';
  panel.appendChild(search);
  const list = doc.createElement('div');
  list.className = 'cf-picker-list';
  panel.appendChild(list);

  /* V33.5: multi-select. Ticking several scopes edits them together — every
     commit() fans out to each selected (level, ref) pair, so one change to the
     Schedule/Channels/Templates form writes an override to all of them.
     Selecting exactly one behaves exactly as the old single-pick picker did. */
  const selected = new Map(); // "level:ref" -> { level, ref, label }
  const key = (level, ref) => level + ':' + ref;

  const foot = doc.createElement('div');
  foot.className = 'cf-picker-foot';
  const count = doc.createElement('span');
  count.className = 'cf-picker-count';
  count.id = 'scope-picker-count';
  const footRight = doc.createElement('div');
  footRight.className = 'cf-picker-foot-right';

  applyBtn.type = 'button';
  applyBtn.className = 'cf-btn-primary';

  footRight.appendChild(cancelBtn);
  footRight.appendChild(applyBtn);
  foot.appendChild(count);
  foot.appendChild(footRight);
  panel.appendChild(foot);

  back.appendChild(panel);
  doc.body.appendChild(back);

  const paintFoot = () => {
    const n = selected.size;
    count.textContent = n === 0 ? 'Nothing selected'
      : n === 1 ? '1 selected'
      : `${n} selected — edits apply to all`;
    applyBtn.textContent = n > 1 ? `Customize ${n}` : 'Customize';
    applyBtn.disabled = n === 0;
  };

  const close = () => { doc.removeEventListener('keydown', onKey); back.remove(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  doc.addEventListener('keydown', onKey);
  back.addEventListener('click', e => { if (e.target === back) close(); });
  closeBtn.addEventListener('click', close);

  const rowsByGroup = SCOPE_GROUPS.map(g => ({
    label: g.label,
    rows: dir[g.listKey].map(it => ({
      level: g.key, ref: it.id, label: g.labelOf(it),
      overrides: countFor(state, g.key, it.id)
    }))
  }));

  function paint(q) {
    list.innerHTML = '';
    const needle = (q || '').trim().toLowerCase();
    for (const g of rowsByGroup) {
      const hits = g.rows.filter(r => !needle || r.label.toLowerCase().includes(needle));
      if (!hits.length) continue;
      const gh = doc.createElement('div');
      gh.className = 'cf-scope-group';
      gh.textContent = g.label;
      list.appendChild(gh);
      for (const r of hits) {
        const k = key(r.level, r.ref);
        const b = doc.createElement('button');
        b.type = 'button';
        b.className = 'cf-picker-row' + (selected.has(k) ? ' is-selected' : '');
        b.dataset.scopeLevel = r.level;
        b.dataset.scopeRef = r.ref;
        b.setAttribute('aria-pressed', String(selected.has(k)));

        const tick = doc.createElement('span');
        tick.className = 'cf-picker-tick';
        tick.setAttribute('aria-hidden', 'true');
        b.appendChild(tick);

        const nm = doc.createElement('span');
        nm.className = 'cf-picker-name';
        nm.textContent = r.label;
        b.appendChild(nm);

        if (r.overrides > 0) {
          const badge = doc.createElement('span');
          badge.className = 'cf-override-count';
          badge.textContent = String(r.overrides);
          b.appendChild(badge);
        }
        b.addEventListener('click', () => {
          if (selected.has(k)) selected.delete(k);
          else selected.set(k, { level: r.level, ref: r.ref, label: r.label });
          // repaint in place so the tick and the footer stay in step
          b.classList.toggle('is-selected', selected.has(k));
          b.setAttribute('aria-pressed', String(selected.has(k)));
          paintFoot();
        });
        list.appendChild(b);
      }
    }
  }
  cancelBtn.addEventListener('click', close);
  applyBtn.addEventListener('click', () => {
    if (!selected.size) return;
    const targets = [...selected.values()];
    close();
    onPick(targets);
  });
  search.addEventListener('input', () => paint(search.value));
  paint('');
  paintFoot();
  if (typeof isTouch !== 'function' || !isTouch(win)) search.focus();
}

// Schedule tab: the ladder steps, the Google-style recurrence panel, and the
// This event / This and following / All events scope modal.


const CHANNELS = [
  { value: 'sms', label: 'SMS' },
  { value: 'voice', label: 'AI Phone Call' },
  { value: 'email', label: 'Email' }
];
const DAY_LABELS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
const DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

function humanOffset(minutes) {
  const abs = Math.abs(minutes);
  const days = Math.floor(abs / 1440);
  const hours = Math.floor((abs % 1440) / 60);
  const mins = abs % 60;
  const bits = [];
  if (days) bits.push(`${days}d`);
  if (hours) bits.push(`${hours}h`);
  if (mins) bits.push(`${mins}m`);
  const span = bits.length ? bits.join(' ') : '0m';
  return minutes < 0 ? `${span} before` : `${span} after`;
}

function renderRecurrencePanel(doc, host, { recurrence, onChange, win }) {
  host.innerHTML = '';
  const rec = JSON.parse(JSON.stringify(recurrence));
  const emit = () => onChange(rec);

  const title = doc.createElement('h3');
  title.textContent = 'Appointment series';

  const freqSel = doc.createElement('select');

  freqSel.name = 'rec-freq';
  host.appendChild(field(doc, 'Repeat', freqSel));

  const interval = input(doc, { id: 'rec-interval', type: 'number', value: rec.interval });
  interval.min = '1';
  interval.addEventListener('input', () => { rec.interval = Number(interval.value) || 1; emit(); });
  host.appendChild(field(doc, 'Every', interval));

  const dayRow = doc.createElement('div');
  dayRow.className = 'cf-weekday-row';
  host.appendChild(dayRow);

  const paintDays = () => {
    dayRow.innerHTML = '';
    if (rec.freq !== 'weekly') return;
    DAY_LABELS.forEach((d, i) => {
      const b = doc.createElement('button');
      b.type = 'button';
      b.className = 'cf-weekday';
      b.dataset.day = String(i);
      b.textContent = d;
      b.title = DAY_NAMES[i];
      b.setAttribute('aria-label', DAY_NAMES[i]);
      b.setAttribute('aria-pressed', String(rec.byWeekday.includes(i)));
      if (rec.byWeekday.includes(i)) b.classList.add('is-on');
      b.addEventListener('click', () => {
        rec.byWeekday = rec.byWeekday.includes(i)
          ? rec.byWeekday.filter(x => x !== i)
          : [...rec.byWeekday, i].sort((a, z) => a - z);
        paintDays();
        emit();
      });
      dayRow.appendChild(b);
    });
  };
  paintDays();

  mountSelect(freqSel, {
    options: [
      { value: 'daily', label: 'Daily' },
      { value: 'weekly', label: 'Weekly' },
      { value: 'monthly', label: 'Monthly' }
    ],
    value: rec.freq, win,
    onChange: v => { rec.freq = v; if (v !== 'weekly') rec.byWeekday = []; paintDays(); emit(); }
  });

  const endSel = doc.createElement('select');
  endSel.id = 'rec-end-type';
  endSel.name = 'rec-end-type';
  host.appendChild(field(doc, 'Ends', endSel));

  const endDate = input(doc, { id: 'rec-end-date', type: 'date',
    value: rec.end.type === 'onDate' ? rec.end.value : '' });
  endDate.hidden = rec.end.type !== 'onDate';
  endDate.addEventListener('input', () => { rec.end = { type: 'onDate', value: endDate.value }; emit(); });
  const endDateField = field(doc, 'End date', endDate);
  endDateField.hidden = rec.end.type !== 'onDate';
  host.appendChild(endDateField);

  const endCount = input(doc, { id: 'rec-end-count', type: 'number',
    value: rec.end.type === 'afterCount' ? rec.end.value : '' });
  endCount.min = '1';
  endCount.hidden = rec.end.type !== 'afterCount';
  endCount.addEventListener('input', () => {
    rec.end = { type: 'afterCount', value: Number(endCount.value) || 1 };
    emit();
  });
  const endCountField = field(doc, 'Occurrences', endCount);
  endCountField.hidden = rec.end.type !== 'afterCount';
  host.appendChild(endCountField);

  mountSelect(endSel, {
    options: [
      { value: 'never', label: 'Never' },
      { value: 'onDate', label: 'On date' },
      { value: 'afterCount', label: 'After' }
    ],
    value: rec.end.type, win,

      rec.end = v === 'never'
        ? { type: 'never' }

    }
  });

      }).format(new Date(instanceISO));
    } catch { dateSpan.textContent = instanceISO; }

    const descSpan = doc.createElement('span');
    descSpan.className = 'cf-exception-desc';
    descSpan.textContent = describeException(exc);

    editPanel.className = 'cf-exception-edit-panel';
    editPanel.hidden = true;
    editPanel.id = `exc-panel-${keySlug}`;

    const currentOffset = exc['schedule.steps'] && exc['schedule.steps'][0]
      ? exc['schedule.steps'][0].offsetMinutes

      id: `exc-offset-${keySlug}`, type: 'number',

    saveBtn.className = 'cf-btn-primary';
    saveBtn.textContent = 'Save';
    saveBtn.addEventListener('click', () => {
      const patch = { ...exc };
      if (patch['schedule.steps'] && patch['schedule.steps'].length) {
        patch['schedule.steps'] = patch['schedule.steps'].map((s, i) =>
          i === 0 ? { ...s, offsetMinutes: Number(offInput.value) } : s
        );
      } else {
        patch['schedule.steps'] = [{ id: 'exc-s1', offsetMinutes: Number(offInput.value), chain: [{ channel: 'sms', waitAfterMin: 0 }], repeat: null }];

  }

const DUR_DAYS = (() => { const a = []; for (let i = 0; i <= 30; i++) a.push({ value: String(i), label: i === 1 ? '1 Day' : i + ' Days' }); return a; })();
const DUR_HOURS = (() => { const a = []; for (let i = 0; i <= 23; i++) a.push({ value: String(i), label: String(i).padStart(2, '0') + ' hr' }); return a; })();

function durToMinutes(d, h, m) {
  return (Number(d) || 0) * 1440 + (Number(h) || 0) * 60 + (Number(m) || 0);
}

// Pure bridge: Forms Hub conditions + shared deadline -> internal ladder steps.
// No DOM / window / localStorage so it lifts cleanly into the backend.
function conditionsToSteps(conditions, deadline) {
  const list = Array.isArray(conditions) ? conditions : [];
  const dl = deadline || {};
  const withinMin = dl.withinEnabled ? durToMinutes(dl.wDays, dl.wHours, dl.wMins) : 1440;
  const remindMin = dl.remindEnabled ? Math.max(1, durToMinutes(dl.rDays, dl.rHours, dl.rMins)) : 0;
  const repeat = remindMin
    ? { everyMinutes: remindMin, maxSends: REMIND_MAX_SENDS, untilConfirmed: true }
    : null;
  const rows = list.length ? list : [{ id: 'c1', type: 'appt_before', apptType: 'every', channels: [] }];
  return rows.map((c, i) => {
    const after = /_after$/.test(c.type || '') || c.type === 'checkin' || c.type === 'no_show';
    let base = withinMin;
    if (COND_NEEDS_OFFSET.has(c.type) && typeof c.amount === 'number') {
      base = (c.amount || 0) * 1440 + (Number(c.minutes) || 0);
    }
    const offsetMinutes = after ? base : -base;
    const chans = Array.isArray(c.channels) ? c.channels : [];
    const step = {
      id: c.id || ('cst' + i),
      offsetMinutes,
      chain: chans.map(ch => ({ channel: ch, waitAfterMin: 0 })),
      repeat: repeat ? { everyMinutes: repeat.everyMinutes, maxSends: repeat.maxSends, untilConfirmed: true } : null
    };
    if (c.recurring && c.recObj) step.condRecurrence = Object.assign({}, c.recObj);
    return step;
  });
}
