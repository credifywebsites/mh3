/* ── Time formatting ────────────────────────────────────────── */
function timeAgo(iso) {
  const diff = (Date.now() - new Date(iso)) / 60000;
  if (diff < 1)    return 'just now';
  if (diff < 60)   return `${Math.floor(diff)}m ago`;
  if (diff < 1440) return `${Math.floor(diff/60)}h ago`;
  return `${Math.floor(diff/1440)}d ago`;
}

/* ── Priority tag html ──────────────────────────────────────── */
function priorityTag(p) {
  const map = { CRITICAL:'tag-crit', HIGH:'tag-high', NORMAL:'tag-normal', LOW:'tag-low' };
  return `<span class="tag ${map[p] || 'tag-low'}">${p}</span>`;
}

/* ── Stats ──────────────────────────────────────────────────────
   V12: the four counts render as one grouped meter in the hub header.
   Each segment is a filter toggle — the three priorities drive
   state.filterPriority, "Unread" drives state.filterUnreadOnly. */
function renderStats() {
  const roleAlerts = alertsForRole(state.role).filter(a => a.status === 'active');
  const counts = { CRITICAL:0, HIGH:0, NORMAL:0, LOW:0 };
  roleAlerts.forEach(a => { counts[a.priority] = (counts[a.priority]||0) + 1; });
  const unread = roleAlerts.filter(a => !a.read).length;
  const on = p => state.filterPriority.has(p) ? ' on' : '';

  document.getElementById('statsRow').innerHTML = `
    <button class="stat-card stat-crit${on('CRITICAL')}" data-stat="CRITICAL" data-tip="Filter to Critical">
      <div class="stat-label">Critical</div>
      <div class="stat-val">${counts.CRITICAL}</div>
    </button>
    <button class="stat-card stat-high${on('HIGH')}" data-stat="HIGH" data-tip="Filter to High">
      <div class="stat-label">High</div>
      <div class="stat-val">${counts.HIGH}</div>
    </button>
    <button class="stat-card stat-normal${on('NORMAL')}" data-stat="NORMAL" data-tip="Filter to Normal">
      <div class="stat-label">Normal</div>
      <div class="stat-val">${counts.NORMAL}</div>
    </button>
    <button class="stat-card stat-low${state.filterUnreadOnly ? ' on' : ''}" data-stat="UNREAD" data-tip="Show unread only">
      <div class="stat-label">Unread</div>
      <div class="stat-val">${unread}</div>
    </button>
  `;

  // Header subline: workload at a glance, overdue called out in red
  const sub = document.getElementById('hubSubline');
  if (sub) {
    const overdue = roleAlerts.filter(a => /_OVERDUE$/.test(a.type)).length;
    sub.innerHTML = `${roleAlerts.length} active` +
      (overdue ? ` &middot; <span class="hub-overdue">${overdue} overdue</span>` : '');
  }
}

/* ── V12: active-filter chips + Filters badge ────────────────────
   The chip row doubles as the result count, so a filtered list never
   silently hides work. Each chip clears just its own filter. */
function activeFilterChips() {
  const chips = [];
  [...state.filterClusters].forEach(id => {
    const c = ALERT_CLUSTERS.find(x => x.id === id);
    chips.push({ key: 'cluster:' + id, label: c ? c.label : id });
  });
  [...state.filterPriority].forEach(p => chips.push({
    key: 'priority:' + p,
    label: p.charAt(0) + p.slice(1).toLowerCase(),
    tone: p === 'CRITICAL' ? 'crit' : p === 'HIGH' ? 'high' : '',
  }));
  [...state.filterTypes].forEach(t =>
    chips.push({ key: 'type:' + t, label: typeDef(t).label || t }));
  [...state.filterUsers].forEach(id => {
    const p = PROVIDER_ROSTER.find(x => x.id === id);
    chips.push({ key: 'user:' + id, label: p ? p.name : id });
  });
  if (state.filterUnreadOnly) chips.push({ key:'unread', label:'Unread only' });
  if (state.mineOnly)         chips.push({ key:'mine',   label:'My submissions' });
  return chips;
}

function clearFilter(key) {
  const [kind, val] = [key.slice(0, key.indexOf(':')) || key, key.slice(key.indexOf(':') + 1)];
  if (kind === 'cluster')       state.filterClusters.delete(val);
  else if (kind === 'priority') state.filterPriority.delete(val);
  else if (kind === 'type')     { state.filterTypes.delete(val); if (state._typeFilterCDD) state._typeFilterCDD.refresh(); }
  else if (kind === 'user')     { state.filterUsers.delete(val); }
  else if (key === 'unread')    state.filterUnreadOnly = false;
  else if (key === 'mine')      state.mineOnly = false;
}

function clearAllFilters() {
  state.filterClusters.clear();
  state.filterPriority.clear();
  state.filterTypes.clear();
  state.filterUsers.clear();
  if (state._typeFilterCDD) state._typeFilterCDD.refresh();
  state.filterUnreadOnly = false;
  state.mineOnly = false;
  state.search = '';
  const si = document.getElementById('searchInput');
  if (si) si.value = '';
}

function renderFilterChips() {
  const chips = activeFilterChips();

  // Filters button badge
  const btn   = document.getElementById('filtersBtn');
  const badge = document.getElementById('filtersBadge');
  if (btn && badge) {
    btn.classList.toggle('has-filters', chips.length > 0);
    badge.classList.toggle('empty', chips.length === 0);  // keeps its width
    badge.textContent = chips.length;
  }

  // Result count + chips
  const row = document.getElementById('filterChips');
  if (!row) return;
  const shown = visibleAlerts().length;
  const total = state.activeTab === 'assigned-to-me'
    ? alertsForRole(state.role).filter(a => a.assignedTo === CURRENT_USER.providerId).length
    : alertsForRole(state.role).filter(a => a.status === state.activeTab).length;

  row.innerHTML =
    `<span class="hub-count">Showing ${shown} of ${total}</span>` +
    chips.map(c =>
      `<button class="fchip ${c.tone || ''}" data-clear="${c.key}" aria-label="Remove filter ${c.label}">${c.label}<span class="fchip-x">✕</span></button>`
    ).join('') +
    (chips.length ? `<button class="fchip-clear" data-clear="ALL">Clear all</button>` : '');
}

/* ── Tab counts ─────────────────────────────────────────────── */
function renderTabCounts() {
  const ra = alertsForRole(state.role);
  document.getElementById('countActive').textContent    = ra.filter(a => a.status === 'active').length;
  document.getElementById('countSnoozed').textContent   = ra.filter(a => a.status === 'snoozed').length;
  document.getElementById('countResolved').textContent  = ra.filter(a => a.status === 'resolved').length;
  document.getElementById('countDismissed').textContent = ra.filter(a => a.status === 'dismissed').length;

  // V7: Assigned-to-me tab — show only for Supervisor/Admin
  const isPriv = state.role === 'SUPERVISOR' || state.role === 'ADMIN';
  const atmTab = document.getElementById('tabAssignedToMe');
  if (atmTab) {
    atmTab.style.display = isPriv ? '' : 'none';
    const atmCount = ra.filter(a => a.assignedTo === CURRENT_USER.providerId).length;
    document.getElementById('countAssignedToMe').textContent = atmCount;
  }

  // V8: Escalation rules tab — Admin only; badge counts enabled rules
  const escTab = document.getElementById('tabEscalation');
  if (escTab) {
    const isAdmin = state.role === 'ADMIN';
    escTab.style.display = isAdmin ? '' : 'none';
    const enabled = Object.values((state.escRules && state.escRules.rules) || {}).filter(r => r.enabled).length;
    document.getElementById('countEscalation').textContent = enabled;
  }

  // V7: Browser tab unread count
  const unread = ra.filter(a => a.status === 'active' && !a.read).length;
  document.title = unread > 0 ? `(${unread}) Alerts Hub — Credify` : 'Alerts Hub — Credify';
}

/* ── Bell badge + dropdown ──────────────────────────────────── */
function renderBell() {
  const active = alertsForRole(state.role).filter(a => a.status === 'active' && !a.read);
  const badge  = document.getElementById('bellBadge');
  badge.textContent = active.length > 99 ? '99+' : active.length;
  badge.classList.toggle('hidden', active.length === 0);

  // dropdown — preview top 5 by priority then time
  const preview = [...alertsForRole(state.role)]
    .filter(a => a.status === 'active')
    .sort((a, b) => (PRIORITY_ORDER[a.priority] ?? 9) - (PRIORITY_ORDER[b.priority] ?? 9) || new Date(b.ts) - new Date(a.ts))
    .slice(0, BELL_PREVIEW);

  const priorityDot = { CRITICAL:'#c0392b', HIGH:'#d97706', NORMAL:'#1a8a66', LOW:'#8aaa9a' };
  const list = document.getElementById('bellDropList');

  if (!preview.length) {
    list.innerHTML = `<div class="bell-drop-empty"><span style="display:inline-flex;width:16px;height:16px;vertical-align:-3px;margin-right:6px;color:var(--primary)">${ICONS.SIGNOFF_DONE}</span>All caught up!</div>`;
    return;
  }

  list.innerHTML = preview.map(a => {
    const td = typeDef(a.type);
    return `
      <div class="bell-drop-item ${a.read ? '' : 'unread'}" data-id="${a.id}" role="button" tabindex="0">
        <div class="bell-dot" style="background:${priorityDot[a.priority]||'#8aaa9a'}"></div>
        <div class="bell-drop-body">
          <div class="bell-drop-title" style="display:flex;align-items:center;gap:6px">${icon(a.type,'14px')} ${a.clientName ? `<strong>${esc(a.clientName)}</strong> — ` : ''}${td.label}</div>
          <div class="bell-drop-sub">${esc(a.desc.length > 70 ? a.desc.slice(0,70)+'…' : a.desc)}</div>
          <div class="bell-drop-time">${timeAgo(a.ts)}</div>
        </div>
      </div>`;
  }).join('');

  // mark read on click
  list.querySelectorAll('.bell-drop-item').forEach(el => {
    el.addEventListener('click', () => {
      markRead(el.dataset.id);
      closeBell();
      render();
    });
  });
}

/* ── Type filter options ─────────────────────────────────────── */
function renderTypeFilter() {
  const types = [...new Set(alertsForRole(state.role).map(a => a.type))];
  const items = [{ value:'ALL', label:'All types', typeId: null }]
    .concat(types.map(t => ({ value: t, label: typeDef(t).label || t, typeId: t })));

  // Drop selections for types no longer present in this role's alerts
  const valid = new Set(types);
  [...state.filterTypes].forEach(t => { if (!valid.has(t)) state.filterTypes.delete(t); });

  // Update native select (used on mobile; multiple in multi-select mode)
  const sel = document.getElementById('typeFilter');
  sel.innerHTML = items.map(item => {
    const on = item.value === 'ALL' ? state.filterTypes.size === 0 : state.filterTypes.has(item.value);
    return `<option value="${item.value}" ${on ? 'selected' : ''}>${item.label}</option>`;
  }).join('');

  // Mount the custom CDD ONCE (trigger/menu are static nodes — remounting
  // per render stacks duplicate toggle listeners); afterwards just refresh
  // its items and current value.
  if (!state._typeFilterCDD) {
    state._typeFilterCDD = mountCDD({
      triggerId:     'typeFilterTrigger',
      menuId:        'typeFilterMenu',
      nativeId:      'typeFilter',
      triggerTextId: 'typeFilterText',
      triggerIconId: 'typeFilterIcon',
      items,
      multi:         true,
      selected:      state.filterTypes,
      multiNoun:     'types',
      onChange:      () => render(),
    });
  } else {
    state._typeFilterCDD.setItems(items);
    state._typeFilterCDD.refresh();
  }
}

/* ── Main alert list ────────────────────────────────────────── */
function renderAlertList() {
  const list = visibleAlerts();
  const container = document.getElementById('alertCards');
  const empty     = document.getElementById('emptyState');

  if (!list.length) {
    if (empty) empty.style.display = 'block';
    if (container) container.innerHTML = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  container.innerHTML = list.map(a => {
    const td = typeDef(a.type);
    const isActive = a.status === 'active';
    const linkable = canDeepLink(a) && buildHref(a);
    const href     = linkable ? buildHref(a) : null;
    const tgt      = messageTarget(a);
    const selected = state.selected.has(a.id);

    // Client name: deep-link if authorized, else plain text
    const clientHtml = a.clientName
      ? (linkable
          ? `<a class="client-name client-link" href="${href}" data-link="${a.id}" data-tip="Open ${esc(td.label)}">${esc(a.clientName)}<span class="link-ico">${ICONS.LINK_OUT}</span></a>`
          : `<span class="client-name">${esc(a.clientName)}</span>`)
      + ' — '
      : '';

    // Assigned badge
    const assignedBadge = a.assignedTo && a.providerName
      ? `<span class="tag tag-assigned">→ ${esc(a.providerName)}</span>` : '';
    const reassignedFromBadge = a.reassignedFrom
      ? `<span class="tag tag-reassigned-from">↩ was ${esc(a.reassignedFrom.name)}</span>` : '';
    const escalatedBadge = a.escalated
      ? `<span class="tag tag-escalated">↑ Escalated</span>` : '';
    const snoozeBadge = a.status === 'snoozed' && a.snoozeUntil
      ? `<span class="tag tag-snoozed">${icon('TASK_OVERDUE','11px')}&nbsp;${new Date(a.snoozeUntil).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>` : '';

    return `
    <div class="alert-card priority-${a.priority} ${a.read ? '' : 'unread'} ${a.status === 'resolved' ? 'resolved' : ''} ${selected ? 'selected' : ''}"
         data-id="${a.id}">
      ${isActive ? `<label class="alert-check" data-tip="Select">
        <input type="checkbox" data-select="${a.id}" ${selected ? 'checked' : ''} aria-label="Select alert">
      </label>` : ''}
      <div class="alert-icon">${icon(a.type,'18px')}</div>
      <div class="alert-body">
        <div class="alert-top">
          <div class="alert-title">
            ${clientHtml}${linkable && !a.clientName
              ? `<a class="title-link" href="${href}" data-link="${a.id}">${td.label}<span class="link-ico">${ICONS.LINK_OUT}</span></a>`
              : td.label}
          </div>
        </div>
        <div class="alert-meta">
          ${priorityTag(a.priority)}
          ${escalatedBadge}${assignedBadge}${reassignedFromBadge}${snoozeBadge}
          ${a.status === 'resolved' ? '<span class="tag tag-resolved">✓ Resolved</span>' : ''}
        </div>
        <div class="alert-desc">${esc(a.desc)}</div>
        <div class="alert-time">${timeAgo(a.ts)}</div>
      </div>
      <div class="alert-actions">
        ${tgt ? `<button class="icon-btn msg-btn" data-msg="${a.id}" data-tip="Message ${esc(tgt.name)} (${tgt.kind})" aria-label="Message ${tgt.kind}">${ICONS.MESSAGE_ACTION}</button>` : ''}
        <button class="icon-btn read-btn" data-read="${a.id}" data-tip="${a.read ? 'Mark unread' : 'Mark read'}" aria-label="Toggle read">${ICONS.READ_ACTION}</button>
        ${isActive ? `
          <div class="snooze-wrap">
            <button class="icon-btn snooze-btn" data-snooze="${a.id}" data-tip="Snooze" aria-label="Snooze">${ICONS.SNOOZE_ACTION}</button>
            <div class="snooze-menu" id="snoozeMenu-${a.id}">
              ${SNOOZE_OPTIONS.map(o => `<button class="snooze-opt" data-snooze-do="${a.id}" data-val="${o.value}">${o.label}</button>`).join('')}
              <button class="snooze-opt" data-snooze-custom="${a.id}">Custom…</button>
            </div>
          </div>` : ''}
        ${isActive && canAssign() ? `
          <div class="assign-wrap">
            <button class="icon-btn assign-btn" data-assign="${a.id}" data-tip="Assign to provider" aria-label="Assign">${ICONS.ASSIGN_ACTION}</button>
            <div class="assign-menu" id="assignMenu-${a.id}">
              ${PROVIDER_ROSTER.map(p => `<button class="assign-opt" data-assign-do="${a.id}" data-prov="${p.id}">${p.name}</button>`).join('')}
            </div>
          </div>` : ''}
        ${isActive ? `<button class="btn-resolve" data-action="resolve" data-id="${a.id}">✓ Resolve</button>` : ''}
        ${isActive ? `<button class="btn-dismiss" data-action="dismiss" data-id="${a.id}">Dismiss</button>` : ''}
      </div>
    </div>`;
  }).join('');

  wireCardEvents(container);
}

function wireCardEvents(container) {
  // Deep-links (client name or title)
  container.querySelectorAll('[data-link]').forEach(el => {
    el.addEventListener('click', e => {
      const a = state.alerts.find(x => x.id === el.dataset.link);
      openDeepLink(a, e);
    });
  });

  // Message icon
  container.querySelectorAll('[data-msg]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      openMessageComposer(state.alerts.find(x => x.id === btn.dataset.msg), e);
    });
  });

  // Read toggle
  container.querySelectorAll('[data-read]').forEach(btn => {
    btn.addEventListener('click', e => { e.stopPropagation(); toggleRead(btn.dataset.read); });
  });

  // Snooze menu open + option pick
  container.querySelectorAll('[data-snooze]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const menu = document.getElementById('snoozeMenu-' + btn.dataset.snooze);
      closeAllPopups(menu);
      menu.classList.toggle('open');
    });
  });
  container.querySelectorAll('[data-snooze-do]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      snoozeAlert(btn.dataset.snoozeDo, btn.dataset.val);
    });
  });
  // V7: Custom snooze
  container.querySelectorAll('[data-snooze-custom]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      closeAllPopups(null);
      openCustomSnooze(btn.dataset.snoozeCustom);
    });
  });

  // Assign menu open + option pick
  container.querySelectorAll('[data-assign]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const menu = document.getElementById('assignMenu-' + btn.dataset.assign);
      closeAllPopups(menu);
      menu.classList.toggle('open');
    });
  });
  container.querySelectorAll('[data-assign-do]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      assignAlert(btn.dataset.assignDo, btn.dataset.prov);
    });
  });

  // Checkbox select
  container.querySelectorAll('[data-select]').forEach(cb => {
    cb.addEventListener('click', e => e.stopPropagation());
    cb.addEventListener('change', e => toggleSelect(cb.dataset.select, e.target.checked));
  });

  // Resolve / dismiss
  container.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      markRead(id);
      if (btn.dataset.action === 'resolve') resolveAlert(id);
      if (btn.dataset.action === 'dismiss') dismissAlert(id);
    });
  });

  // Mark read on card body click (not on interactive children)
  container.querySelectorAll('.alert-card').forEach(card => {
    card.addEventListener('click', e => {
      if (e.target.closest('a,button,input,label,.snooze-menu,.assign-menu')) return;
      markRead(card.dataset.id); renderBell();
    });
  });
}

function closeAllPopups(except) {
  document.querySelectorAll('.snooze-menu.open, .assign-menu.open').forEach(m => {
    if (m !== except) m.classList.remove('open');
  });
}

/* ── Bulk action bar (feature 9) ────────────────────────────── */
function renderBulkBar() {
  let bar = document.getElementById('bulkBar');
  const count = state.selected.size;
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'bulkBar'; bar.className = 'bulk-bar';
    bar.innerHTML = `
      <span class="bulk-count"><b id="bulkCount">0</b> selected</span>
      <div class="bulk-actions">
        <button class="btn btn-outline btn-sm" id="bulkResolveBtn">✓ Resolve</button>
        <button class="btn btn-outline btn-sm" id="bulkSnoozeBtn"><span style="display:inline-flex;width:13px;height:13px;vertical-align:-2px;margin-right:4px">${ICONS.SNOOZE_ACTION}</span>Snooze 3h</button>
        <button class="btn btn-outline btn-sm" id="bulkDismissBtn">Dismiss</button>
        <button class="btn btn-outline btn-sm" id="bulkClearBtn">Clear</button>
      </div>`;
    document.body.appendChild(bar);
    document.getElementById('bulkResolveBtn').addEventListener('click', bulkResolve);
    document.getElementById('bulkSnoozeBtn').addEventListener('click', bulkSnooze);
    document.getElementById('bulkDismissBtn').addEventListener('click', bulkDismiss);
    document.getElementById('bulkClearBtn').addEventListener('click', () => { clearSelection(); render(); });
  }
  document.getElementById('bulkCount').textContent = count;
  bar.classList.toggle('show', count > 0);
}

/* ── "My submissions" toggle (feature 3b — provider only) ───── */
function renderMineToggle() {
  const btn = document.getElementById('mineToggle');
  if (!btn) return;
  const show = state.role === 'PROVIDER';
  btn.style.display = show ? 'inline-flex' : 'none';
  btn.classList.toggle('active', !!state.mineOnly);
  if (!show && state.mineOnly) { state.mineOnly = false; }
}

/* ── Cluster toggle bar (V6) ─────────────────────────────────── */
function renderClusterBar() {
  const bar = document.getElementById('clusterBar');
  const ra  = alertsForRole(state.role).filter(a => a.status === state.activeTab);
  bar.innerHTML = ALERT_CLUSTERS.map(c => {
    const n = c.id === 'ALL' ? ra.length : ra.filter(a => CLUSTER_OF[a.type] === c.id).length;
    const active = c.id === 'ALL' ? state.filterClusters.size === 0 : state.filterClusters.has(c.id);
    const risk   = c.id === 'RISK' && n > 0 ? ' risk-hot' : '';
    return `<button class="pill cluster-pill${active ? ' active' : ''}${risk}" data-cluster="${c.id}">${c.label}<span class="pill-count">${n}</span></button>`;
  }).join('');
}

/* ── Priority pill states (V6 multi-select) ──────────────────── */
function renderPriorityPills() {
  const set = state.filterPriority;
  document.querySelectorAll('#priorityFilters [data-priority]').forEach(p => {
    const v = p.dataset.priority;
    p.classList.toggle('active', v === 'ALL' ? set.size === 0 : set.has(v));
  });
}

/* ── Role label ──────────────────────────────────────────────── */
function renderRoleLabel() {
  const el = document.getElementById('roleLabel');
  if (!el) return;
  el.textContent = `Viewing as: ${
    state.role === 'PROVIDER' ? 'Provider' :
    state.role === 'ADMIN'    ? 'Admin' : 'Supervisor'
  }`;
}

/* ── Full render ─────────────────────────────────────────────── */
function render() {
  // Lifecycle sweeps (backend will do these server-side; run on each render here)
  wakeSnoozed();
  autoResolveCompleted();
  escalateOverdue();
  autoResolveAged();       // V8: per-type N-day auto-resolve rules
  releaseNotifications();  // V8: quiet-hours releases + digest flushes

  // Selection is active-only: drop ids that were resolved/dismissed/snoozed
  // by a single-card action so the bulk bar count never goes stale.
  state.selected.forEach(id => {
    const a = state.alerts.find(x => x.id === id);
    if (!a || a.status !== 'active') state.selected.delete(id);
  });

  renderStats();
  renderTabCounts();
  renderClusterBar();
  renderPriorityPills();
  renderProviderPills();  // V12.2: multi-select provider pills
  renderBell();
  renderSidenav();   // V9: sync sidenav + bottom-tab badges
  renderUserChip();  // V9: sync bottom user chip
  renderDesktopPermBtn(); // V10: show/hide perm button
  renderTypeFilter();
  renderAlertList();
  renderRoleLabel();
  renderBulkBar();
  renderMineToggle();
  renderFilterChips();  // V12: result count + active-filter chips + Filters badge

  // V7: show user filter for Supervisor/Admin (V12: a group inside the Filters panel)
  const isPriv = state.role === 'SUPERVISOR' || state.role === 'ADMIN';
  const ufw = document.getElementById('userFilterWrap');
  if (ufw) ufw.style.display = isPriv ? '' : 'none';

  // V7: unread-only toggle active state
  const uot = document.getElementById('unreadOnlyToggle');
  if (uot) uot.classList.toggle('active', state.filterUnreadOnly);

  // V7: sound on new CRITICAL alerts (after user gesture unlock)
  checkCriticalSound();

  // V8: Escalation tab swaps the alert list + filter chrome for the rules panel
  const isEsc = state.activeTab === 'escalation';
  const escPanel = document.getElementById('escalationPanel');
  const listEl   = document.getElementById('alertList');
  // V12: the filter chrome is now the command bar's right side + the chips row
  const toolbarEl = document.getElementById('hubBarRight');
  const chipsEl   = document.getElementById('filterChips');
  if (escPanel) {
    escPanel.style.display = isEsc ? '' : 'none';
    if (listEl)    listEl.style.display    = isEsc ? 'none' : '';
    if (toolbarEl) toolbarEl.style.display = isEsc ? 'none' : '';
    if (chipsEl)   chipsEl.style.display   = isEsc ? 'none' : '';

/* ── V7: Focus-trap utility ─────────────────────────────────── */
function trapFocus(modalEl) {
  const sel = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function getFocusable() { return [...modalEl.querySelectorAll(sel)].filter(el => !el.closest('[style*="display:none"]')); }
  function handler(e) {
    if (e.key !== 'Tab') return;
    const items = getFocusable();
    if (!items.length) { e.preventDefault(); return; }
    const first = items[0], last = items[items.length - 1];
    if (e.shiftKey) { if (document.activeElement === first) { e.preventDefault(); last.focus(); } }
    else            { if (document.activeElement === last)  { e.preventDefault(); first.focus(); } }
  }
  modalEl.addEventListener('keydown', handler);
  const items = getFocusable();
  if (items.length) items[0].focus();
  return () => modalEl.removeEventListener('keydown', handler);
}

function dtPickerNav(d) {

function dtPickDay(day) {

function renderDtPicker() {
  const y = _dtPicker.y, m = _dtPicker.m, sel = _dtPicker.sel;
  const MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const firstDow = new Date(y, m, 1).getDay();
  const dim = new Date(y, m+1, 0).getDate();

  // Nav row with month/year CDDs
  const yearOpts = []; for (let yy = new Date().getFullYear(); yy <= new Date().getFullYear()+5; yy++) yearOpts.push(`<option value="${yy}"${yy===y?' selected':''}>${yy}</option>`);
  const monthOpts = MON.map((nm,i) => `<option value="${i}"${i===m?' selected':''}>${nm}</option>`);
  const nav = document.getElementById('dtPickerNav');
  nav.innerHTML = `
    <button class="nav-btn" onclick="dtPickerNav(-1)" aria-label="Previous month">‹</button>
    <select class="dt-time-sel" style="flex:1" onchange="dtSetMonth(this.value)" aria-label="Month">${monthOpts.join('')}</select>
    <select class="dt-time-sel" style="width:80px" onchange="dtSetYear(this.value)" aria-label="Year">${yearOpts.join('')}</select>
    <button class="nav-btn" onclick="dtPickerNav(1)" aria-label="Next month">›</button>`;

  // Calendar grid
  const dow = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let cells = dow.map(d => `<div class="dt-cal-dow">${d}</div>`).join('');
  for (let i = 0; i < firstDow; i++) cells += '<div></div>';
  for (let dnum = 1; dnum <= dim; dnum++) {
    const ds = `${y}-${String(m+1).padStart(2,'0')}-${String(dnum).padStart(2,'0')}`;
    const on = sel === ds;
    cells += `<button class="dt-cal-day${on?' selected':''}" onclick="dtPickDay(${dnum})" aria-label="${ds}" aria-pressed="${on}">${dnum}</button>`;
  }
  document.getElementById('dtCalGrid').innerHTML = cells;

  // Time selects (populate on first render, preserve value)
  const hSel = document.getElementById('dtHourSel');
  const mSel = document.getElementById('dtMinSel');
  if (!hSel.options.length) {
    for (let h = 1; h <= 12; h++) hSel.innerHTML += `<option value="${h}">${String(h).padStart(2,'0')}</option>`;
    hSel.value = '8';
  }
  if (!mSel.options.length) {
    ['00','15','30','45'].forEach(v => mSel.innerHTML += `<option value="${v}">${v}</option>`);
  }
}
function dtSetMonth(v) { _dtPicker.m = Number(v); renderDtPicker(); }

function dtPickerSave() {
  if (!_dtPicker.sel) { showToast('Please pick a date.'); return; }
  const h = Number(document.getElementById('dtHourSel').value);
  const mn = document.getElementById('dtMinSel').value;

/* ── V7: CRITICAL alert sound ───────────────────────────────── */
let _audioCtx = null;
function unlockAudio() {
  if (state._audioUnlocked) return;
  try {
    _audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    state._audioUnlocked = true;
  } catch(e) {}
}
function playCriticalBeep() {
  if (!_audioCtx) return;
  try {
    const osc = _audioCtx.createOscillator();
    const gain = _audioCtx.createGain();
    osc.connect(gain); gain.connect(_audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, _audioCtx.currentTime);
    gain.gain.setValueAtTime(0.18, _audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, _audioCtx.currentTime + 0.22);
    osc.start(_audioCtx.currentTime);
    osc.stop(_audioCtx.currentTime + 0.22);
  } catch(e) {}
}
function checkCriticalSound() {
  if (!state._audioUnlocked) return;
  const currentCritIds = new Set(
    alertsForRole(state.role).filter(a => a.status === 'active' && a.priority === 'CRITICAL').map(a => a.id)
  );
  let hasNew = false;
  currentCritIds.forEach(id => { if (!state._lastCriticalIds.has(id)) hasNew = true; });
  state._lastCriticalIds = currentCritIds;
  if (hasNew) playCriticalBeep();
}

// Base64 icon for OS toast — green "C" on rounded rect
const CREDIFY_ICON_B64 = 'data:image/svg+xml;base64,' + btoa(
  '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">' +
  '<rect width="64" height="64" rx="14" fill="#1a8a66"/>' +
  '<text x="32" y="47" font-family="Georgia,serif" font-size="42" font-weight="bold" text-anchor="middle" fill="white">C</text>' +
  '</svg>'
);

// Dedup set — prevents duplicate OS toasts for the same alert across ticks
let _desktopFired = new Set();
window._desktopFired = _desktopFired; // expose for test access

// Fire a real OS desktop notification for an alert (gracefully degrades)
function fireDesktopToast(alert) {
  if (typeof Notification === 'undefined') return;
  if (Notification.permission !== 'granted') return;
  if (_desktopFired.has(alert.id)) return;
  _desktopFired.add(alert.id);
  const def = typeDef(alert.type);
  const eff = effectivePriority(alert.type);
  const title = `[${eff}] ${alert.clientName || def.label} — ${def.label}`;
  const body  = (alert.body || '').slice(0, 100);
  try {
    const n = new Notification(title, {
      body,
      tag:               `credify-${alert.id}`,
      icon:              CREDIFY_ICON_B64,
      requireInteraction: eff === 'CRITICAL',
    });
    n.onclick = () => {
      window.focus();
      markRead(alert.id);
      const row = document.querySelector(`[data-alert-id="${alert.id}"]`);
      if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
      n.close();
    };
  } catch (err) {
    console.warn('[desktop toast] failed:', err);
  }
}

// Show/hide the "Enable desktop alerts" button based on current permission
function renderDesktopPermBtn() {
  const btn = document.getElementById('desktopPermBtn');
  if (!btn) return;
  const perm = typeof Notification !== 'undefined' ? Notification.permission : 'denied';
  btn.style.display = perm === 'default' ? '' : 'none';
}

// Handle click on the Enable desktop alerts button
function requestDesktopPerm() {
  if (typeof Notification === 'undefined') return;
  Notification.requestPermission().then(perm => {
    renderDesktopPermBtn();
    logAudit('desktop-perm', null, `Desktop notification permission: ${perm}`);
  });
}

function wireEvents() {
  // Bell
  document.getElementById('bellBtn').addEventListener('click', e => {
    e.stopPropagation();
    const open = document.getElementById('bellDropdown').classList.contains('open');
    open ? closeBell() : openBell();
  });
  document.addEventListener('click', e => {
    if (!document.getElementById('bellDropdown').contains(e.target) &&
        !document.getElementById('bellBtn').contains(e.target)) closeBell();
  });
  document.getElementById('markAllReadBtn').addEventListener('click',  () => { markAllRead(); closeBell(); });
  document.getElementById('dismissAllBtn').addEventListener('click',   () => { dismissAll();  closeBell(); });
  document.getElementById('viewAllLink').addEventListener('click',     e => { e.preventDefault(); closeBell(); });

  // Role
  const _roleSelectEl = document.getElementById('roleSelect');
  if (_roleSelectEl) _roleSelectEl.addEventListener('change', e => {
    state.role = e.target.value;
    state.activeTab = 'active';
    clearAllFilters();
    clearSelection();
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === 'active'));
    render(); // renderPriorityPills()/renderClusterBar() repaint filter states
  });

  // Tabs
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      clearSelection();
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });

  // "My submissions" toggle (provider)
  document.getElementById('mineToggle').addEventListener('click', () => {
    state.mineOnly = !state.mineOnly;
    render();
  });

  // V12: severity meter segments in the hub header double as filters
  document.getElementById('statsRow').addEventListener('click', e => {
    const seg = e.target.closest('[data-stat]');
    if (!seg) return;
    const v = seg.dataset.stat;
    if (v === 'UNREAD') state.filterUnreadOnly = !state.filterUnreadOnly;
    else state.filterPriority.has(v) ? state.filterPriority.delete(v) : state.filterPriority.add(v);
    render();
  });

  // V12: Filters popover — one button holds category / priority / type / provider
  const filtersBtn   = document.getElementById('filtersBtn');
  const filtersPanel = document.getElementById('filtersPanel');
  window.closeFiltersPanel = function () {
    filtersPanel.classList.remove('open');
    filtersBtn.setAttribute('aria-expanded', 'false');
  };
  filtersBtn.addEventListener('click', e => {
    e.stopPropagation();
    const on = filtersPanel.classList.toggle('open');
    filtersBtn.setAttribute('aria-expanded', on ? 'true' : 'false');
  });
  // Clicks inside the panel must not close it — the dropdowns live in here
  filtersPanel.addEventListener('click', e => e.stopPropagation());
  document.addEventListener('click', () => closeFiltersPanel());
  document.getElementById('filtersPanelClear').addEventListener('click', () => {
    clearAllFilters();
    render();
  });

  // V12: chip row — each chip clears its own filter; "Clear all" resets them
  document.getElementById('filterChips').addEventListener('click', e => {
    const chip = e.target.closest('[data-clear]');
    if (!chip) return;
    chip.dataset.clear === 'ALL' ? clearAllFilters() : clearFilter(chip.dataset.clear);
    render();
  });

  // Priority pills
  document.getElementById('priorityFilters').addEventListener('click', e => {
    const pill = e.target.closest('[data-priority]');
    if (!pill) return;
    const v = pill.dataset.priority;
    if (v === 'ALL') state.filterPriority.clear();
    else state.filterPriority.has(v) ? state.filterPriority.delete(v) : state.filterPriority.add(v);
    render(); // renderPriorityPills() paints active states
  });

  // Cluster toggle bar (V6) — delegated; bar contents rebuilt each render
  document.getElementById('clusterBar').addEventListener('click', e => {
    const pill = e.target.closest('[data-cluster]');
    if (!pill) return;
    const id = pill.dataset.cluster;
    // V12.2: multi-select — "All" clears, any other pill toggles. The old
    // single-select reset the type filter to avoid dead intersections; the
    // chips row now makes an empty result explainable, so nothing is cleared
    // behind the user's back.
    if (id === 'ALL') state.filterClusters.clear();
    else state.filterClusters.has(id) ? state.filterClusters.delete(id) : state.filterClusters.add(id);
    render();
  });

  // Type filter — CDD mounted per-render via renderTypeFilter(); native handled there too

  moreBtn.addEventListener('click', e => {

  moreMenu.addEventListener('click', () => closeMoreMenu()); // item chosen → menu closes; items keep their own openers
  document.addEventListener('click', e => { if (!e.target.closest('.kebab-wrap')) closeMoreMenu(); });
  window._closeMoreMenu = closeMoreMenu; // reachable from the Escape handler

  // Prefs modal
  document.getElementById('openPrefsBtn').addEventListener('click', openPrefs);
  document.getElementById('closePrefsBtn').addEventListener('click', closePrefs);
  document.getElementById('cancelPrefsBtn').addEventListener('click', closePrefs);
  document.getElementById('savePrefsBtn').addEventListener('click', savePrefs);

  // Audit modal — action filter CDD mounted ONCE (static markup); search live
  state._auditCDD = mountCDD({
    triggerId:     'auditActionTrigger',
    menuId:        'auditActionMenu',
    nativeId:      'auditActionSelect',
    triggerTextId: 'auditActionText',
    items:         [{ value:'ALL', label:'All actions' }],
    value:         'ALL',
    onChange:      v => { state.auditAction = v; renderAuditList(); },
  });
  // V8.2: role filter CDD — mounted ONCE; counts in the action catalog follow it
  const AUDIT_ROLE_ITEMS = [
    { value:'ALL',        label:'All roles' },
    { value:'PROVIDER',   label:'Provider' },
    { value:'SUPERVISOR', label:'Supervisor' },
    { value:'ADMIN',      label:'Admin' },
  ];
  state._auditRoleCDD = mountCDD({
    triggerId:     'auditRoleTrigger',
    menuId:        'auditRoleMenu',
    nativeId:      'auditRoleSelect',
    triggerTextId: 'auditRoleText',
    items:         AUDIT_ROLE_ITEMS,
    value:         'ALL',
    onChange:      v => { state.auditRole = v; refreshAuditActionCDD(); renderAuditList(); },
  });
  document.getElementById('auditRoleSelect').innerHTML =
    AUDIT_ROLE_ITEMS.map(i => `<option value="${i.value}">${i.label}</option>`).join('');
  document.getElementById('auditSearchInput').addEventListener('input', e => {
    state.auditSearch = e.target.value; renderAuditList();
  });
  document.getElementById('openAuditBtn').addEventListener('click', openAudit);
  document.getElementById('closeAuditBtn').addEventListener('click', closeAudit);
  document.getElementById('closeAuditFooterBtn').addEventListener('click', closeAudit);

  // V8: Notification Log modal — channel CDD mounted ONCE (static markup)
  state._notifChanCDD = mountCDD({
    triggerId:     'notifChanTrigger',
    menuId:        'notifChanMenu',
    nativeId:      'notifChanSelect',
    triggerTextId: 'notifChanText',
    items:         [{ value: 'ALL', label: 'All channels' }].concat(CHANNELS.map(c => ({ value: c.key, label: c.label }))),
    value:         'ALL',
    onChange:      v => { state.notifChannel = v; renderNotifList(); },
  });
  document.getElementById('notifChanSelect').innerHTML =
    [{ value: 'ALL', label: 'All channels' }].concat(CHANNELS.map(c => ({ value: c.key, label: c.label })))
      .map(i => `<option value="${i.value}">${i.label}</option>`).join('');
  document.getElementById('notifSearchInput').addEventListener('input', e => {
    state.notifSearch = e.target.value; renderNotifList();
  });
  document.getElementById('openNotifLogBtn').addEventListener('click', openNotifLog);
  document.getElementById('closeNotifBtn').addEventListener('click', closeNotifLog);
  document.getElementById('closeNotifFooterBtn').addEventListener('click', closeNotifLog);

  // Close modals on overlay click
  document.getElementById('prefsModal').addEventListener('click', e => { if (e.target === e.currentTarget) closePrefs(); });
  document.getElementById('auditModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeAudit(); });
  document.getElementById('notifModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeNotifLog(); });
  document.getElementById('newAlertModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeNewAlert(); });

  // Keyboard close
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      closePrefs(); closeAudit(); closeBell(); closeAllPopups(null);
      closeNewAlert(); closeDtPicker(); closeNotifLog(); closeUserSwitcher();

/* ══════════════════════════════════════════════════════════════
   V8 — Escalation rules admin panel (Admin-only tab)
══════════════════════════════════════════════════════════════ */
function encodeNotify(n) { return n && n.kind === 'provider' ? 'prov:' + n.providerId : 'role:' + ((n && n.role) || 'SUPERVISOR'); }
function decodeNotify(v) {
  const [kind, val] = String(v).split(':');
  return kind === 'prov' ? { kind: 'provider', providerId: val } : { kind: 'role', role: val };
}
function destroyEscCDDs() {
  (state._escCDDs || []).forEach(c => { try { c.destroy(); } catch(e){} });
  state._escCDDs = [];
}
function escRuleChanged(t, field, val) {
  saveState();
  logAudit('escalation-rule-changed', null, `${t.label}: ${field} → ${val}`);
  renderTabCounts(); // enabled-count badge only — no full render, keeps input focus
}
function renderEscalationPanel() {
  if (state._escPanelBuilt) return;
  const panel = document.getElementById('escalationPanel');
  const rules = state.escRules.rules;
  const notifyItems = [
    { value: 'role:SUPERVISOR', label: 'All Supervisors' },
    { value: 'role:ADMIN',      label: 'All Admins' },
  ].concat(PROVIDER_ROSTER.map(p => ({ value: 'prov:' + p.id, label: p.name })));

  let html = `
    <div class="esc-panel-head">
      <div>
        <div class="esc-panel-title">Escalation Rules</div>
        <div class="esc-panel-sub">An active alert left <strong>unread</strong> past its threshold escalates once — optional one-level priority bump — and notifies the target through their channel preferences. Auto-resolve closes aged active alerts. Changes save immediately.</div>
      </div>
      <button class="btn btn-outline btn-sm" id="escRestoreDefaultsBtn">Restore defaults</button>
    </div>
    <div class="esc-head">
      <span>Alert type</span><span>Enabled</span><span>Threshold</span><span>Bump priority</span><span>Notify</span><span>Auto-resolve</span>
    </div>`;
  html += ALERT_TYPES.map(t => {
    const r = rules[t.id];
    return `<div class="esc-row" data-type="${t.id}">
      <div class="esc-cell esc-type">${icon(t.id,'15px')}<span>${t.label}</span></div>
      <div class="esc-cell" data-col="Enabled">
        <label class="sw"><input type="checkbox" class="sw-input esc-enabled" data-type="${t.id}" ${r.enabled ? 'checked' : ''} aria-label="Enable escalation for ${t.label}"><span class="sw-slider"></span></label>
      </div>
      <div class="esc-cell" data-col="Threshold">
        <input type="number" class="esc-num esc-threshold" data-type="${t.id}" step="0.5" min="0.5" value="${Math.round(r.thresholdMin / 60 * 10) / 10}" aria-label="Threshold hours for ${t.label}"><span class="esc-unit">hrs unread</span>
      </div>
      <div class="esc-cell" data-col="Bump priority">
        <label class="sw"><input type="checkbox" class="sw-input esc-bump" data-type="${t.id}" ${r.bump ? 'checked' : ''} aria-label="Bump priority for ${t.label}"><span class="sw-slider"></span></label>
      </div>
      <div class="esc-cell esc-notify" data-col="Notify">
        <div class="cdd-wrap esc-cdd">
          <button class="cdd-trigger" id="escTrig-${t.id}" aria-haspopup="listbox" aria-expanded="false">
            <span class="cdd-trigger-label"><span class="cdd-trigger-text" id="escText-${t.id}"></span></span>
            <svg class="cdd-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 5 5 5-5"/></svg>
          </button>
          <div class="cdd-menu" id="escMenu-${t.id}" role="listbox"></div>
          <select class="filter-sel cdd-native" id="escSel-${t.id}" aria-label="Notify target for ${t.label}">
            ${notifyItems.map(i => `<option value="${i.value}" ${encodeNotify(r.notify) === i.value ? 'selected' : ''}>${i.label}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="esc-cell" data-col="Auto-resolve">
        <input type="number" class="esc-num esc-autoresolve" data-type="${t.id}" step="1" min="0" value="${r.autoResolveDays || ''}" placeholder="—" aria-label="Auto-resolve days for ${t.label}"><span class="esc-unit">days</span>
      </div>
    </div>`;
  }).join('');
  panel.innerHTML = html;

  // Notify-target CDDs (custom desktop / native mobile per convention)
  destroyEscCDDs();
  ALERT_TYPES.forEach(t => {
    state._escCDDs.push(mountCDD({
      triggerId:     `escTrig-${t.id}`,
      menuId:        `escMenu-${t.id}`,
      nativeId:      `escSel-${t.id}`,
      triggerTextId: `escText-${t.id}`,
      items:         notifyItems,
      value:         encodeNotify(rules[t.id].notify),
      onChange:      v => {
        rules[t.id].notify = decodeNotify(v);
        escRuleChanged(t, 'notify', notifyTargetLabel(rules[t.id].notify));
      },
    }));
  });

  // Live-save switches + number inputs (delegated; panel is static until teardown)
  panel.addEventListener('change', e => {
    const el = e.target;
    const typeId = el.dataset.type;
    if (!typeId || !rules[typeId]) return;
    const t = typeDef(typeId);
    if (el.classList.contains('esc-enabled')) {
      rules[typeId].enabled = el.checked;
      escRuleChanged(t, 'enabled', el.checked ? 'on' : 'off');
    } else if (el.classList.contains('esc-bump')) {
      rules[typeId].bump = el.checked;
      escRuleChanged(t, 'bump', el.checked ? 'on' : 'off');
    } else if (el.classList.contains('esc-threshold')) {
      const hrs = Math.max(0.5, parseFloat(el.value) || 4);
      el.value = hrs;
      rules[typeId].thresholdMin = Math.round(hrs * 60);
      escRuleChanged(t, 'threshold', hrs + 'h');
    } else if (el.classList.contains('esc-autoresolve')) {
      const days = parseInt(el.value, 10);
      rules[typeId].autoResolveDays = (days && days > 0) ? days : null;
      escRuleChanged(t, 'auto-resolve', rules[typeId].autoResolveDays ? days + 'd' : 'off');
    }
  });

  document.getElementById('escRestoreDefaultsBtn').addEventListener('click', () => {
    state.escRules = defaultEscRules();
    saveState();
    logAudit('escalation-rules-reset', null, 'All escalation rules restored to defaults');
    destroyEscCDDs();
    state._escPanelBuilt = false;
    renderEscalationPanel();
    renderTabCounts();
    showToast('Escalation rules restored to defaults.');
  });

  state._escPanelBuilt = true;
}

/* ══════════════════════════════════════════════════════════════
   V8 — Notification Log modal (simulated channel deliveries)
══════════════════════════════════════════════════════════════ */
function visibleNotifEntries() {
  let list = (state.notifLog && state.notifLog.entries) || [];
  if (state.role === 'PROVIDER') {
    list = list.filter(e => e.recipientId === CURRENT_USER.providerId);
  } else if (state.role === 'SUPERVISOR') {
    list = list.filter(e => e.recipientId === CURRENT_USER.providerId || e.recipientId === 'role-SUPERVISOR');
  } // ADMIN sees everything
  if (state.notifChannel !== 'ALL') list = list.filter(e => e.channel === state.notifChannel);
  const q = state.notifSearch.trim().toLowerCase();
  if (q) {
    list = list.filter(e =>
      [e.recipientName || '', typeDef(e.typeKey).label || '', e.clientName || '',
       e.channel || '', e.status || '', e.reason || '']
        .join(' ').toLowerCase().includes(q));
  }
  return list;
}
function notifStatusPill(e) {
  const fmt = iso => new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  if (e.status === 'sent')   return `<span class="nl-pill nl-sent">Sent · ${fmt(e.sentTs || e.ts)}</span>`;
  if (e.status === 'held')   return `<span class="nl-pill nl-held">Held until ${fmt(e.releaseAt)}</span>`;
  if (e.status === 'queued') return `<span class="nl-pill nl-queued">Queued · ${String(e.batchKey || '').startsWith('D:') ? 'daily' : 'hourly'} digest</span>`;
  if (e.status === 'digest') return `<span class="nl-pill nl-digest">Digest · ${e.count || (e.items || []).length} alerts</span>`;
  return `<span class="nl-pill">${esc(e.status || '')}</span>`;
}
function renderNotifList() {
  const body = document.getElementById('notifBody');
  const list = visibleNotifEntries();
  if (!list.length) {
    body.innerHTML = `<p style="color:var(--muted);text-align:center;padding:32px 0">${
      (state.notifLog.entries || []).length ? 'No notifications match your filters.' : 'No notifications yet.'}</p>`;
    return;
  }
  const chanLabel = k => (CHANNELS.find(c => c.key === k) || {}).label || k;
  body.innerHTML = list.map(e => {
    const what = e.status === 'digest'
      ? `Email digest for ${esc(e.recipientName)}`
      : `${typeDef(e.typeKey).label || e.typeKey}${e.clientName ? ' — ' + esc(e.clientName) : ''}`;
    const items = e.status === 'digest' && (e.items || []).length
      ? `<div class="nl-items">${e.items.slice(0, 4).map(i =>
          `<div class="nl-item">• ${typeDef(i.typeKey).label || i.typeKey}${i.clientName ? ' — ' + esc(i.clientName) : ''}</div>`).join('')}${
          e.items.length > 4 ? `<div class="nl-item nl-more">+${e.items.length - 4} more</div>` : ''}</div>`
      : '';
    return `<div class="nl-row">
      <div class="nl-main">
        <div class="nl-top">
          <span class="nl-chip nl-chip-${e.channel}">${chanLabel(e.channel)}</span>
          <span class="nl-recipient">${esc(e.recipientName || '')}</span>
          <span class="nl-time">${new Date(e.ts).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</span>
        </div>
        <div class="nl-what">${what}${e.reason === 'escalation' ? ' <span class="nl-reason">· escalation</span>' : ''}</div>
        ${items}
      </div>
      ${notifStatusPill(e)}
    </div>`;
  }).join('');
}
let _notifTrap = null;
function openNotifLog() {
  state.notifSearch = '';
  state.notifChannel = 'ALL';
  document.getElementById('notifSearchInput').value = '';
  if (state._notifChanCDD) state._notifChanCDD.setCurrent('ALL');

/* ── V8: minute tick — time-driven sweeps without waiting for a render ── */
function v8Tick() {
  let c = false;
  c = wakeSnoozed() || c;
  c = autoResolveCompleted() || c;
  c = escalateOverdue() || c;
  c = autoResolveAged() || c;
  c = releaseNotifications() || c;
  if (c) render();
}

/* ── Custom tooltip singleton (desktop only) ────────────────── */
(function() {
  // The tip node is markup that follows this script, so resolve it lazily —
  // grabbing it at parse time yields null and every hover throws.
  let tip = null;
  const getTip = () => (tip = tip || document.getElementById('credify-tip'));
  let hideTimer;
  function show(el, text) {
    const tip = getTip(); if (!tip) return;
    clearTimeout(hideTimer);
    tip.textContent = text;
    tip.classList.add('visible');
    positionTip(el);
  }
  function hide() {
    hideTimer = setTimeout(() => { const t = getTip(); if (t) t.classList.remove('visible'); }, 60);
  }
  function positionTip(el) {
    const tip = getTip(); if (!tip) return;
    const r  = el.getBoundingClientRect();
    const tw = tip.offsetWidth  || 140;
    const th = tip.offsetHeight || 24;
    const gap = 6;
    // Prefer above; fall back to below
    let top  = r.top - th - gap;
    let left = r.left + r.width / 2 - tw / 2;
    if (top < 4) top = r.bottom + gap;
    left = Math.max(6, Math.min(left, window.innerWidth - tw - 6));
    tip.style.top  = top  + 'px';
    tip.style.left = left + 'px';
  }
  // Single delegated mouseover on document
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip]');
    if (!el) return;
    show(el, el.dataset.tip);
  });
  document.addEventListener('mouseout', e => {
    const el = e.target.closest('[data-tip]');
    if (el) hide();
  });
  // Re-position on scroll/resize while visible
  document.addEventListener('scroll', () => {
    const t = getTip();
    if (t && t.classList.contains('visible')) t.classList.remove('visible');
  }, { passive: true, capture: true });
  window.addEventListener('resize', () => { const t = getTip(); if (t) t.classList.remove('visible'); });
})();
